4\n1. **NIFTYBEES split 10:1 on 19 Dec 2019** (NSE circular NSE/CML/42873). Yahoo adjusted the history but **double-adjusted 19–20 Dec**\n   (these are the \"bad ticks\" from Day 4). The ratio test catches them; we set them to NaN, not a guess.\n2. **No dividends in Yahoo's Adj Close.** Vendors disagree: Trendlyne lists 2003–2012, while Investing.com and StockEvents add 2013–2015.\n   The price-gap test clearly confirms only **9 Mar 2012** (seen −1.80% vs expected −1.87%). Over 2009–2018 the ETF's CAGR\n   is 14.04% price-only, 14.25% with the confirmed dividend and 14.75% with all claimed ones. **Resolve this from the AMC's IDCW\n   record** (Nippon India MF site) and write the policy down.\n3. **Official NSE close ≠ Yahoo?** For Dec 2018 they match exactly once you divide the pre-split NSE price by 10. Good.\n   But the official close ≠ last trade (up to ₹2 on a ₹1,124 unit), as on Day 11.\n4. **The ISIN changed** (INF732E01011 in 2018 → INF204KB14I2 now). Don't key history on ISIN alone.\n5. **Calendar is data:** Budget-Saturday and Muhurat sessions appear (2015-02-28, 2020-11-14, 2025-02-01), and the\n   6-day gap to 2014-10-07 is real holidays. Yahoo's NIFTY and NIFTYBEES files don't even agree on these sessions.\n6. **Timezones:** the S&P close (16:00 New York) lands at 01:30/02:30 IST the next day. Joining by calendar date shows a\n   correlation of +0.30, but the tradable, lagged version is +0.22.\n7. **Holdout sealed:** `load(\"HOLDOUT_SEALED\")` raises an error unless you set the Day 20 unlock string, and every file is\n   checked against its SHA-256 in `manifest.json`.\n\n## Mentor's rulings\n- **Raw files are read-only.** Every fix is code + a log line + a reason.\n- **Signals and fills from the official NSE file** (bhavcopy, later Kite). Yahoo is a cross-check only.\n- **Upgrade the benchmark now:** NIFTY 50 TRI (with dividends) and a real cash leg (LIQUIDBEES or the overnight rate) replace\n  \"price index + 6%\". If your Day 12 pre-reg says otherwise, file a v2 *before* any holdout look and log it in the trial log.\n- **Network etiquette:** browser-like User-Agent, ≥1 s between requests, cache everything. Getting blocked is a pipeline failure.\n\nSend me: manifest.json, your data README, the TRI/cash series you added, the 10 problems, and your training-log row.\nTeaser for Day 14: NSE shows a 26 Dec 2018 NIFTYBEES **open of 1188 vs close 1123.82** (−5.4% intraday on a flat-ish day). Bad print or real?\n", "resources": "# Day 13 resources (checked 31 Oct 2026). ✅ = in this ZIP\n\n## Data quality and structure (01_data_quality)\n- ✅ Wickham (2014), \"Tidy Data,\" Journal of Statistical Software 59(10) (author copy).\n- Ince & Porter (2006), \"Individual Equity Return Data from Thomson Datastream: Handle with Care!\" J. Fin. Research 29(4): the classic on vendor data errors. SSRN blocked our download: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=486523\n\n## NSE / index primary sources (02_nse_sources)\n- ✅ NSE circular NSE/CML/42873 (11 Dec 2019): NIFTYBEES face value ₹10 → ₹1, effective 19 Dec 2019.\n- ✅ NSE circular MSD61773: discontinuation of old trade/bhavcopy files. Related: circular 62424 (12 Jun 2024) set the old CM bhavcopy's end for 8 Jul 2024 (named on https://www.nseindia.com/all-reports).\n- ✅ NSE \"UDiFF Standards for Generation and Implementation\" v1.0 (the new file-naming and field standard).\n- ✅ NIFTY Equity Indices methodology (NSE Indices). Includes the Total Return Index method. Concept page: https://www.niftyindices.com/resources/index-concepts/total-return-index\n- NSE ETF master list (symbol, ISIN, listing date, face value): ✅ `06_data/nse_etf_list.csv`, from https://nsearchives.nseindia.com/content/equities/eq_etfseclist.csv\n- NSE holidays: https://www.nseindia.com/resources/exchange-communication-holidays\n- Official TRI history: https://www.niftyindices.com/reports/historical-data (\"Total returns Index Values\")\n\n## Tools and docs\n- jugaad-data (NSE/RBI/AMFI data, incl. TRI via niftyindices): https://github.com/jugaad-py/jugaad-data\n- niftyindices TRI endpoint notes (quirks: User-Agent stall, double JSON): https://github.com/satwikbasu/indian-market-data-endpoints/blob/main/endpoints/niftyindices-tri-api.md\n- Kite Connect historical candles (you'll use these from Day 22): https://kite.trade/docs/connect/v3/historical/\n- pandas time series & time zones: https://pandas.pydata.org/docs/user_guide/timeseries.html\n- pandas I/O (Parquet section): https://pandas.pydata.org/docs/user_guide/io.html\n- Apache Parquet concepts (row groups, column chunks, pages): https://parquet.apache.org/docs/concepts/\n\n## Videos\n- Data Mozart, \"Parquet File Format: Explained to a 5 Year Old!\": https://www.youtube.com/watch?v=5NA57Pfpdr4\n- Learn Data with Mark, \"An introduction to Apache Parquet\" (pyarrow hands-on): https://www.youtube.com/watch?v=KLFadWdomyI\n\n## Build-alongs (03_build_along), tested here unless noted\n- `pipeline.py` / `.ipynb`: ingest + SHA-256, normalise (session date, IST close), validate, corporate actions with evidence, ETF total return, Parquet + manifest, sealed holdout `load()`, timezone trap.\n- `bhavcopy_ingest.py` / `.ipynb`: official NSE bhavcopy in the old and UDiFF formats → one schema; cross-check vs Yahoo; close vs last; ISIN change. Cached files included so it runs offline.\n- `fetch_nifty_tri.py`: niftyindices TRI downloader. **Not testable from our server (blocked)**; run it on your laptop.\n- Reuse: Day 7 `nse_costs.py` (unchanged).\n\n## Data (06_data)\n- raw/: NIFTY50, NIFTYBEES, SP500 daily (Yahoo, downloaded 31 Oct 2026, left raw on purpose).\n- corporate_actions_NIFTYBEES.csv: split + dividends with **status and source per row** (vendor conflicts marked).\n- bhavcopy_cache/: 5 NSE bhavcopy files (4 in Dec 2018, old format; 1 in Oct 2026, UDiFF format, used for the format demo only).\n", "problems": "# Day 13: 10 problems\n1. Yahoo's NIFTYBEES shows ~129 on 18 Dec 2019, ~13 on 19–20 Dec, ~130 on 23 Dec. What happened, and what's the primary source?\n2. Why does the pipeline set those two days to NaN instead of multiplying them by 10?\n3. Yahoo's NIFTYBEES \"Adj Close\" equals \"Close\". What does that tell you, and roughly how much does it matter here?\n4. Four vendors give three different dividend lists. Rank the evidence: vendor list, price-gap test, AMC IDCW record, NSE corporate-action filing.\n5. The price-gap test confirms 2012-03-09 (seen −1.80% vs expected −1.87%) but not 2013-03-13 (seen 0.00% vs −1.25%). Give two reasons the test can miss a real dividend.\n6. The validator flags 2015-02-28 and 2020-11-14 as weekend sessions. Bug or real? How do you check?\n7. A 6-day gap ending 2014-10-07. Bad data or holidays?\n8. The S&P closes at 16:00 New York. For which NSE session is that close first usable? Why is the same-calendar-date correlation (+0.30) misleading?\n9. Why Parquet + SHA-256 + manifest instead of \"just save a CSV\"?\n10. Your Day 12 pre-reg uses NIFTY price index (no dividends) and a 6% cash return. Name the two data upgrades that most change your overlay's measured return give-up, and how you'd source each.\n", "files": ["00_START_HERE.md", "01_data_quality/Wickham_2014_Tidy_Data_JSS.pdf", "02_nse_sources/NIFTY_Equity_Indices_Methodology.pdf", "02_nse_sources/NSE_UDiFF_guidance_document_v1.pdf", "02_nse_sources/NSE_circular_CML42873_2019_NIFTYBEES_face_value_split.pdf", "02_nse_sources/NSE_circular_MSD61773_old_bhavcopy_discontinuation.pdf", "03_build_along/bhavcopy_ingest.ipynb", "03_build_along/bhavcopy_ingest.py", "03_build_along/fetch_nifty_tri.py", "03_build_along/pipeline.ipynb", "03_build_along/pipeline.py", "04_templates/data-README-template.md", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "06_data/bhavcopy_cache/BhavCopy_NSE_CM_0_0_0_20261029_F_0000.csv.zip", "06_data/bhavcopy_cache/cm26DEC2018bhav.csv.zip", "06_data/bhavcopy_cache/cm27DEC2018bhav.csv.zip", "06_data/bhavcopy_cache/cm28DEC2018bhav.csv.zip", "06_data/bhavcopy_cache/cm31DEC2018bhav.csv.zip", "RESOURCES.md"]}, {"day": 14, "date": "Fri 13 Nov 2026", "focus": "DATA AUDIT · GATE 2", "week": 2, "start_here": "# DAY 14: Fri 13 Nov 2026: DATA AUDIT · GATE 2\n## Yesterday you built the pipe. Today you try to prove it leaks.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 20 min | Drill | Zetamac + \"30 samples, 7 bad: give the 95% range\" × 3 | |\n| 35 min | Read | Brownlees & Gallo (2006), secs 1–3: data errors and the moving-window filter. Skim ECB WP 948 for how to choose filter parameters. | 01_ |\n| 35 min | Read | Brown, Goetzmann, Ibbotson & Ross (1992), intro + sec 1 (survivorship). Deutsche Bank's *Seven Sins*: survivorship, look-ahead, data mining. | 02_ |\n| 15 min | Read | NSE rules that explain \"weird\" prints: pre-open FAQ, ETF price-band circular (equity ETFs: no pre-open book, ±10% band flexing to ±20%) | 03_ |\n| 60 min | Run | `audit.py`: predict each check's verdict first, then run. Read `audit_report.md`. | 04_ |\n| 25 min | Run | `rebuild_from_bhavcopy.py` on your laptop (~50 min unattended, resumable) | 04_ |\n| 30 min | Own it | Run the perturbation test on YOUR signal function from the pre-reg | 04_ |\n| 20 min | Write | Audit decision log + Gate 2 checklist | 05_ |\n| 20 min | Problems | 10 problems | 06_ |\n≈ 4.0 h (plus the unattended rebuild).\n\n## What the audit found (2009–2018, exploration window only)\n- **Your signal input is clean.** Yahoo's NIFTY 50 matched NSE's own index file on all 19 random dates with an NSE file. Watch out: NSE named the index \"S&P CNX Nifty\", then \"CNX Nifty\", then \"Nifty 50\".\n- **Your execution series is not.** Yahoo's NIFTYBEES close was off from NSE's bhavcopy by > 0.1% on **7 of 30 random dates**\n  (2010, 2012–13). Worst: 2010-02-05 (+14%) and 2010-10-06 (−15%), each a one-day spike that reverses.\n- **Fake bars:** 171 zero-volume days, 119 of them in 2013, often with open == close where NSE shows real trading. Vendor filler.\n- **Real but untradeable:** NSE's own 26 Dec 2018 record has an open of 1188 (= day high) after a 1118.37 previous close, on a flat NIFTY day.\n  Equity ETFs have no pre-open auction, so the \"open\" is just the first trade. **Never model fills at the open.**\n- **Look-ahead in code:** the classic month-end bug (`bfill`) inflates the Faber filter's Sharpe from +0.53 to +1.26. The perturbation\n  test catches it. The one-day delay test does NOT (1.26 → 1.23), because the leak reaches up to a month ahead.\n- **Day 13 teaser answered:** it's real (NSE records it), and it's exactly why you use limit orders.\n\n## Mentor's rulings for Gate 2\n- Data roles are audited separately: **signal** (index: PASS), **execution** (ETF: rebuild from NSE), **benchmark** (TRI, from Day 13).\n- Every WARN/FAIL gets a row in the decision log. \"Ignored\" is a decision too, and it has to be written down.\n- Your own signal function must pass the perturbation test before Day 15 starts.\n- Gate 2 is graded on process. Passing it with a bad data decision is worse than failing it honestly.\n\nSend me: audit_report.md, the decision log, the Gate 2 checklist (with the verify output and the prereg-v1 tag URL), perturbation-test output for your signal, the 10 problems, and your training-log row.\n", "resources": "# Day 14 resources (checked 31 Oct 2026). ✅ = in this ZIP\n\n## Data-cleaning papers (01_cleaning_papers)\n- ✅ Brownlees & Gallo (2006), \"Financial Econometric Analysis at Ultra-High Frequency: Data Handling Concerns\" (Univ. Florence working-paper version of CSDA 51(4)). The standard bad-tick filter.\n- ✅ ECB Working Paper 948 (2008), \"Clustering Techniques Applied to Outlier Detection of Financial Market Series Using a Moving Window Filtering Algorithm\": outlier filtering for daily data, and how to set the parameters.\n\n## Bias papers (02_bias_papers)\n- ✅ Brown, Goetzmann, Ibbotson & Ross (1992), \"Survivorship Bias in Performance Studies,\" RFS 5(4).\n- ✅ Luo et al. (2014), Deutsche B older)\n| Version | CAGR | Vol | Excess Sharpe | Max DD | Trades | Costs |\n|---|---|---|---|---|---|---|\n| Buy & hold | 8.0% | 22.1% | 0.20 | −59.8% | 2 | ₹187 |\n| **Faber 10m** | 8.1% | 13.4% | **0.22** | −26.2% | 21 | ₹4,951 |\n| + vol target 12% | 6.6% | 9.3% | 0.11 | −17.6% | **1,184** | ₹13,576 |\n| + 10% band | 6.7% | 9.1% | 0.12 | −16.5% | 94 | ₹5,340 |\n- Faber's 0.22 excess Sharpe matches the Day 12 number (0.21): the engine agrees with your earlier research.\n- Vol targeting halves the drawdown but also halves the excess Sharpe here, and without a band it churns daily.\n- Frictionless engine = vectorised one-liner to 1e-10 (test 5). So every gap between them is a friction you modelled on purpose.\n\n## Mentor's rulings\n- The engine changes **how** you test, not **what** you test. Vol targeting and bands aren't in your pre-reg → log them as trials. They're not your strategy.\n- Report **excess-of-cash** Sharpe from now on. A 0%-rf Sharpe flatters any part-time-in-cash filter.\n- No fills at the open, ever. No fills on the decision bar, ever.\n- Trade instrument: plug in the NSE-rebuilt NIFTYBEES CSV (Day 14). The demo uses the index only as a stand-in.\n- A green test suite isn't proof. Tomorrow's planted bugs measure how good your tests really are.\n\nSend me: pytest output, your new test, your strategy's engine run table, the acceptance checklist, the 10 problems, and your training-log row.\n", "resources": "# Day 15 resources (checked 31 Oct 2026). ✅ = in this ZIP\n\n## Papers (01_papers)\n- ✅ Harvey, Hoyle, Korgaonkar, Rattray, Sargaison & Van Hemert (2018), \"The Impact of Volatility Targeting,\" JPM 45(1): helps Sharpe for risk assets (via the leverage effect) and thins the left tail.\n- ✅ Moreira & Muir (2017), \"Volatility-Managed Portfolios,\" NBER w22208 (JF version 2017).\n- ✅ J.P. Morgan/Reuters (1996), *RiskMetrics Technical Document*, 4th ed.: EWMA and λ = 0.94 for daily data.\n- Already in earlier kits, so not repeated: Chan ch. 1 (Day 9), Harvey & Liu *Backtesting* (Day 5), Arnott-Harvey-Markowitz protocol (Day 10), Frazzini-Israel-Moskowitz costs (Day 7).\n\n## Architecture: free articles\n- QuantStart, *Event-Driven Backtesting with Python*, Parts I–VIII (Part I): https://www.quantstart.com/articles/Event-Driven-Backtesting-with-Python-Part-I\n  Part II (events): https://www.quantstart.com/articles/Event-Driven-Backtesting-with-Python-Part-II · Part IV (strategy): https://www.quantstart.com/articles/Event-Driven-Backtesting-with-Python-Part-IV/ · Part VII (performance): https://www.quantstart.com/articles/Event-Driven-Backtesting-with-Python-Part-VII/\n- QuantStart, \"Backtesting Systematic Trading Strategies in Python: Considerations and Open Source Frameworks\": https://www.quantstart.com/articles/backtesting-systematic-trading-strategies-in-python-considerations-and-open-source-frameworks\n- Scott Rome, \"Build Your Own Event-Based Backtester in Python\": http://srome.github.io/Build-Your-Own-Event-Based-Backtester-In-Python/\n\n## Video\n- Michael Halls-Moore, \"When Should You Build Your Own Backtester?\" (QuantCon 2016). Event-driven design starts around 28:09: https://www.youtube.com/watch?v=OhGdVdolqkU\n\n## GitHub (read the code, don't adopt it wholesale)\n- quantstart/qstrader (the portfolio/position-sizer split): https://github.com/quantstart/qstrader\n- tobiasbrodd/backtester (runnable version of the QuantStart series): https://github.com/tobiasbrodd/backtester\n- robcarver17/pysystemtrade (vol-targeted position sizing done properly; huge, so read `sysquant` and the sizing code): https://github.com/robcarver17/pysystemtrade\n- nautechsystems/nautilus_trader (same code for backtest and live; the Week 4 idea): https://github.com/nautechsystems/nautilus_trader\n\n## Testing\n- Hypothesis (property-based testing) docs: https://hypothesis.readthedocs.io\n\n## Build-along (03_build_along), all tested here\n- `engine.py`, plus `test_engine.py` (17 tests incl. a Hypothesis property test: `pip install pytest hypothesis`), `run_demo.py`/`.ipynb`, `nse_costs.py` (Day 7)\n", "problems": "# Day 15: 10 problems\n1. Why can't FaberMonthly decide on the last session of the month, even though that's what the paper says?\n2. The order holds a target WEIGHT and units are computed at the fill bar's close. What's realistic and what's optimistic about that?\n3. Test 5 compares the engine to `(1 + w.shift(2) * r).cumprod()`. Why shift(2) and not shift(1)?\n4. Buy & hold shows 2 trades, not 1. Find the second one in the trade log and explain it.\n5. Vol targeting made 1,184 trades. Why does an EWMA sizer trade almost daily, and why is a 10% band a reasonable fix?\n6. Excess Sharpe: Faber 0.22, Faber + vol target 0.11, yet the vol-targeted drawdown is smaller. Harvey et al. (2018) say vol targeting improves equity Sharpe. Why didn't it here? Give two reasons.\n7. The \"no costs, cash 0%\" row has a 0%-rf Sharpe of 0.50 but the real run has an excess Sharpe of 0.22. Where did the difference go?\n8. Which test catches swapping step 1 (interest) and step 2 (fill)? If none, design one.\n9. Property-based test 14: what does Hypothesis buy you over 40 hand-picked examples?\n10. You like the vol-targeted version's −16.5% max DD. Can you switch to it now? What does the process require?\n", "files": ["00_START_HERE.md", "01_papers/Harvey_et_al_2018_Impact_of_Volatility_Targeting_JPM.pdf", "01_papers/JPMorgan_Reuters_1996_RiskMetrics_Technical_Document_EWMA.pdf", "01_papers/Moreira_Muir_2017_Volatility_Managed_Portfolios_NBER_w22208.pdf", "02_architecture/engine_v2_design.md", "03_build_along/engine.py", "03_build_along/nse_costs.py", "03_build_along/run_demo.ipynb", "03_build_along/run_demo.py", "03_build_along/test_engine.py", "04_templates/engine-v2-acceptance.md", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "RESOURCES.md"]}, {"day": 16, "date": "Sun 15 Nov 2026", "focus": "BUG HUNT (I planted 3 bugs in your engine)", "week": 3, "start_here": "# DAY 16: Sun 15 Nov 2026: BUG HUNT (I planted 3 bugs in your engine)\n\n`03_bug_hunt/engine.py` is \"v2.1, small refactors for speed\". It has **3 planted bugs**. The Day 15 suite turns red on 2 tests, but red tests don't tell you where or why, and one bug turns nothing red.\n**Honour rule: don't diff against Day 15** until your report is in. Real bugs don't come with a clean copy.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 20 min | Drill | Zetamac + spot-the-bug: 5 one-line pandas snippets you write yourself (`shift`, `bfill`, `resample`, `iloc`) | |\n| 30 min | Read | Zeller, *The Debugging Book*: Intro to Debugging chapter (link). `bug_hunt_protocol.md` | 02_ |\n| 20 min | Read | Just et al. (2014), sections 1, 5, 7 (does mutation score mean anything?) | 01_ |\n| 90 min | Hunt | Run the suite + the demo, observe, hypothesise, experiment. Log every step. | 03_, 05_ |\n| 30 min | Fix | Failing test FIRST, then fix, for each bug | 03_ |\n| 40 min | Mutation | `python mutate.py ../03_bug_hunt/engine.py ../03_bug_hunt/test_engine.py` on your FIXED engine; kill survivors | 04_ |\n| 20 min | Write | `bug-report.md` | 05_ |\n| 20 min | Problems | 10 problems | 06_ |\n≈ 4.5 h. That's over budget, so cut the mutation block to 25 min if you need to.\n\n## Hints (read one at a time, only when stuck for 20+ min)\n<details><summary>Hint 1<\/summary>Two of the bugs live in the same class.<\/details>\n<details><summary>Hint 2<\/summary>One bug is invisible in the P&L and the suite. Build a one-trade scenario and compute the cash by hand.<\/details>\n<details><summary>Hint 3<\/summary>Look at `res.targets`, not just `res.weights`.<\/details>\n\n## Mentor's rulings\n- A bug counts only with a test that fails before the fix and passes after.\n- Your Day 15 suite scores **57%** on mutation testing (`BASELINE_day15_suite.md`). Its biggest holes: `metrics()` and the **holdout seal**. Close the seal hole today: that's the one thing in the engine you can't undo.\n- From now on, no engine change without a failing-first test and a mutation score that doesn't drop.\n- `SEALED_answer_key.zip` is password-locked. Send me your bug report and I'll give you the password.\n\nSend me: bug report, bug-hunt log, new tests, mutation score before → after, the 10 problems, and your training-log row.\n", "resources": "# Day 16 resources (checked 31 Oct 2026). ✅ = in this ZIP\n\n## Papers (01_papers)\n- ✅ Just, Jalali, Inozemtseva, Ernst, Holmes & Fraser (2014), \"Are Mutants a Valid Substitute for Real Faults in Software Testing?\" FSE (ACM SIGSOFT Distinguished Paper): 357 real faults; mutant detection correlates with real-fault detection, independent of coverage.\n- ✅ Jia & Harman (2011), \"An Analysis and Survey of the Development of Mutation Testing,\" IEEE TSE 37(5): the mutation operators `mutate.py` uses.\n- ✅ Papadakis, Kintis, Zhang, Jia, Le Traon & Harman (2019), \"Mutation Testing Advances: An Analysis and Survey,\" *Advances in Computers* 112 (accepted version, UCL): reference only, skim sec. on equivalent mutants.\n\n## Free book and course readings\n- Andreas Zeller, *The Debugging Book* (free online): https://www.debuggingbook.org/. Start with \"Introduction to Debugging\": https://www.debuggingbook.org/html/Intro_Debugging.html · Delta debugging: https://www.debuggingbook.org/html/DeltaDebugger.html\n- MIT 6.031, Reading 13: Debugging (reproduce, localise, scientific method): https://web.mit.edu/6.031/www/fa21/classes/13-debugging\n- Stuart Halloway, \"Debugging with the Scientific Method\" (Clojure/conj 2015), transcript: https://github.com/matthiasn/talk-transcripts/blob/master/Halloway_Stuart/DebuggingWithTheScientificMethod.md · video: https://www.youtube.com/watch?v=FihU5JxmnBg\n\n## Tools\n- mutmut (industrial Python mutation testing): https://github.com/boxed/mutmut\n- cosmic-ray: https://github.com/sixty-north/cosmic-ray\n- git bisect docs: https://git-scm.com/docs/git-bisect\n- Hypothesis: https://hypothesis.readthedocs.io\n\n## Earlier kits, not repeated\n- Day 14: look-ahead papers, the perturbation test. Day 15: engine design, QuantStart series, vol-targeting papers.\n\n## Build-along\n- `03_bug_hunt/engine.py` (v2.1, 3 planted bugs) + `test_engine.py` (Day 15 suite) + `nse_costs.py`\n- `04_mutation_lab/mutate.py`: 80-line mutation tester, tested here; baseline 57% on the clean Day 15 engine\n- `SEALED_answer_key.zip`: answer key + 3 reference tests (password after your report)\n", "problems": "# Day 16: 10 problems (do AFTER the hunt)\n1. The 3 bugs together moved the excess Sharpe from 0.121 to 0.122. What does that tell you about finding bugs by looking at results?\n2. A perturbation test passed at t=250 and t=400 but failed at t=520 on the same leaky engine. How can that happen, and how do you make the test reliable?\n3. Your risk-limit test checks the HELD weight. Why is that weaker than checking the TARGET? Give the live-trading scenario where it matters.\n4. Define an \"equivalent mutant\". Give one from the baseline and explain why no test could ever kill it.\n5. Just et al. (2014) found mutant detection correlates with real-fault detection, even after controlling for coverage. Why is coverage alone a weak measure? Give an engine line that's 100% covered and still wrong.\n6. 18 survivors sit in `metrics()`. Write one test that kills at least 10 of them (hint: a hand-computable equity curve).\n7. The holdout-seal mutant `>= → >` survives. Write the 3-line test. Why is this the most expensive survivor in the whole engine?\n8. Scientific debugging: write the hypothesis → prediction → experiment for \"interest is accrued on the wrong cash balance\".\n9. When is `git bisect` the right tool, and why wasn't it useful today?\n10. After today, what's your rule for every future engine change?\n", "files": ["00_START_HERE.md", "01_papers/Jia_Harman_2011_Analysis_and_Survey_of_Mutation_Testing_TSE.pdf", "01_papers/Just_et_al_2014_Are_Mutants_a_Valid_Substitute_for_Real_Faults_FSE.pdf", "01_papers/Papadakis_et_al_2019_Mutation_Testing_Advances_survey.pdf", "02_debugging_method/bug_hunt_protocol.md", "03_bug_hunt/engine.py", "03_bug_hunt/nse_costs.py", "03_bug_hunt/test_engine.py", "04_mutation_lab/BASELINE_day15_suite.md", "04_mutation_lab/mutate.py", "05_templates/bug-hunt-log.md", "05_templates/bug-report.md", "06_problems/10_problems.md", "06_problems/SOLUTIONS_open_after_all_10.md", "RESOURCES.md", "SEALED_answer_key.zip"]}, {"day": 17, "date": "Mon 16 Nov 2026", "focus": "THE IN-SAMPLE RUN", "week": 3, "start_here": "# DAY 17: Mon 16 Nov 2026: THE IN-SAMPLE RUN\n## Describe the past honestly, count every trial, and don't touch 2019+.\n\nThe plan said \"first 70%\". **Overruled on Day 12: the boundary is 2019-01-01.** In-sample = 2007-09 → 2018-12-31. The holdout isn't even in this ZIP.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 20 min | Drill | Zetamac + \"Sharpe 0.5, 10 yrs daily: SE?\" × 5 (answer ≈ √((1 + 0.5²/2)/10) ≈ 0.34) | |\n| 30 min | Read | Ledoit & Wolf (2008), sections 1 to 3 + the conclusion | 01_ |\n| 20 min | Watch | StatQuest bootstrapping + standard error | links |\n| 20 min | Re-read | Lo (2002) on serial correlation (Day 11 kit) | |\n| 15 min | Predict | Write down your guesses for primary Sharpe, vol ratio and DD difference BEFORE running | |\n| 40 min | Run | `python is_report.py --trade <your NIFTYBEES> --prereg <prereg.md> --lock <LOCK.txt>`, then `pytest test_is_report.py`, then `python crosscheck_arch.py` | 03_ |\n| 45 min | Write | `IS-report-writeup.md` (1 page) + checklist | 04_ |\n| 15 min | Log | trial-log.csv rows for all 4 runs; decide the N you'll use for DSR | 04_ |\n| 20 min | Problems | 10 problems | 05_ |\n≈ 3.9 h.\n\n## What the demo shows (index stand-in, OECD cash, after costs, aligned start 2008-09-01)\n| | CAGR | Vol | Sharpe xs cash | Max DD | Trades |\n|---|---|---|---|---|---|\n| Buy & hold | 8.9% | 20.7% | 0.19 | −43.9% | 2 |\n| Faber 8m (grid) | 9.3% | 14.0% | 0.22 | −24.3% | 22 |\n| **Faber 10m (primary)** | 8.6% | 14.2% | 0.18 | −25.6% | 22 |\n| Faber 12m (grid) | 7.4% | 13.1% | 0.09 | −25.6% | 14 |\n\n- **Sharpe:** 0.18, 90% band −0.32 to +0.64. Indistinguishable from buy & hold. No alpha, as pre-registered.\n- **Vol ratio:** 0.69 (0.56 to 0.81). **DD shallower:** +18 pp, P = 94%. The risk claim holds in-sample.\n- **Warm-up trap caught:** started at the data's first day, the DD edge reads +34 pp, because the filter was in cash for 10 months by construction while buy & hold ate the 2008 crash. The script now starts every run on the first day all variants can act.\n- **Effective N of the 3 Faber lengths = 1.15.** They're almost one bet.\n- Faber's longest time underwater (1,289 days) is longer than buy & hold's. Remember that on Day 21.\n\n## Mentor's rulings\n1. Today you describe, you don't decide. No parameter changes; 8m \"looking better\" is noise (problem 4).\n2. Report the aligned numbers. Show the unaligned DD once, labelled as an artifact.\n3. Every headline number carries a band, or it's marked \"point only\".\n4. Decide your DSR N **today**, in writing, before Day 20. Default: total trials in the family from your log.\n5. Cash leg: the OECD series is provisional for 2007 to 2012. Swap in RBI 91-day T-bills before Day 20 and log it.\n6. Write your Day 20 predictions in the write-up. That's what turns Day 20 into a test.\n\nSend me: IS_report.md + your 1-page write-up + checklist + trial-log rows + the 10 problems + training-log row.\nDay 18 (Tue 17 Nov): walk-forward and the parameter-stability heat map.\n", "resources": "# Day 17 resources (checked 31 Oct 2026). ✅ = in this ZIP\n\n## Papers (01_papers)\n- ✅ Ledoit & Wolf (2008), \"Robust Performance Hypothesis Testing with the Sharpe Ratio,\" *Journal of Empirical Finance* 15(5) (author-hosted). Why textbook Sharpe tests fail with fat tails and autocorrelation; studentized time-series bootstrap instead.\n- Politis & Romano (1994), \"The Stationary Bootstrap,\" *JASA* 89(428), DOI 10.1080/01621459.1994.10476870 (paywalled; read the arch docs below for the method; `is_report.py` implements it in 10 lines)\n- Politis & White (2004), \"Automatic Block-Length Selection for the Dependent Bootstrap,\" *Econometric Reviews* 23(1) (the rule behind `optimal_block_length`)\n- Magdon-Ismail & Atiya (2004), \"Maximum Drawdown,\" *Risk* 17(10): how expected max DD scales with years and Sharpe. SSRN: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=874069\n\n## Already in earlier kits (re-read, not repeated)\n- Lo (2002), \"The Statistics of Sharpe Ratios\": Day 2 / Day 11 kit. Re-read the serial-correlation section.\n- Bailey & López de Prado: PSR (2012) and Deflated Sharpe (2014): Day 5 kit. Today you produce DSR's inputs (N, Sharpe variance).\n- Faber (2007) and the Chan ch. 1 replication: Day 9. Pre-registration: Day 12.\n\n## Videos\n- StatQuest, *Bootstrapping Main Ideas!!!* (~10 min): https://www.youtube.com/watch?v=Xz0x-8-cgaQ\n- StatQuest, *The Standard Error, Clearly Explained!!!*: https://www.youtube.com/watch?v=XNgt7F6FqDU\n- StatQuest, *Using Bootstrapping to Calculate p-values!!!*: https://www.youtube.com/watch?v=N4ZQQqyIf6k\n\n## Docs, code, courses\n- Kevin Sheppard's `arch` package, bootstrap examples (Sharpe ratio CI with the stationary bootstrap): https://bashtage.github.io/arch/bootstrap/bootstrap_examples.html · confidence-interval methods: https://bashtage.github.io/arch/bootstrap/confidence-intervals.html · GitHub: https://github.com/bashtage/arch\n- OECD SDMX data API (the cash series): https://sdmx.oecd.org · RBI DBIE (the series to switch to): https://data.rbi.org.in\n\n## Build-along (03_build_along), all run and tested here\n- `is_report.py`: hash-checked pre-reg → aligned runs of the full grid → bootstrap bands → years/regimes → trial accounting → `IS_report.md` + charts + manifest. ~10 s.\n- `test_is_report.py`: 6 tests (bootstrap indices, effective N, hand-checked DD, warm-up alignment, gate, and the shared-state bug).\n- `crosscheck_arch.py`: my bootstrap vs `arch`, same 90% band (−0.32 to +0.64).\n- `is_out/`: the demo report generated on the index stand-in.\n", "problems": "# Day 17: 10 problems\n1. Unaligned, the filter's max-DD edge is +34 pp; aligned, +18 pp. Explain the mechanism in two sentences. Which number goes in your report, and why?\n2. Primary Sharpe 0.18 with a 90% band of −0.32 to +0.64. B&H 0.19 (−0.34 to +0.74). What can you honestly claim about Sharpe? What can't you?\n3. The vol ratio band is 0.56 to 0.81 and never crosses 1. Why is a risk claim so much easier to support than a return claim on the same data?\n4. Grid: 8m Sharpe 0.22, 10m 0.18, 12m 0.09. Your primary is 10m. Someone says \"switch to 8m\". Write your reply in 3 lines.\n5. Effective N for the three Faber lengths is 1.15. What does that mean, and which N should DSR use on Day 20: 3, 1.15, or your total trial-log count? Defend it.\n6. Faber's longest time underwater (1,289 days) is LONGER than buy & hold's (1,086). How can a filter with half the drawdown sit underwater longer? Why does this matter for you as a human running it?\n7. While building `is_report.py` I reused one FaberMonthly object for two runs and got −132 bps of \"cost drag\" (negative drag: costs made it better). Find the mechanism, and say which test now guards it.\n8. The cash rate is flat 6.00% for 2007 to 2012 in the OECD series. How much could a wrong cash leg move (a) CAGR, (b) excess Sharpe, for a strategy that's in cash ~30% of the time? Rough numbers.\n9. The Politis-White automatic block length for squared excess returns comes out ~1.6 days; the report uses 20. Which is safer for Sharpe bands, and why might the automatic rule mislead you on a strategy that's flat for months?\n10. Write your Day 20 predictions now: the vol-ratio and DD-difference bands you expect on 2019+. Why does writing them today matter?\n", "files": ["00_START_HERE.md", "01_papers/Ledoit_Wolf_2008_Robust_Performance_Hypothesis_Testing_Sharpe_JEF.pdf", "03_build_along/crosscheck_arch.py", "03_build_along/engine.py", "03_build_along/is_out/IS_report.md", "03_build_along/is_out/equity.png", "03_build_along/is_out/is_results.json", "03_build_along/is_out/manifest.json", "03_build_along/is_out/rolling_vol.png", "03_build_along/is_out/underwater.png", "03_build_along/is_report.py", "03_build_along/nse_costs.py", "03_build_along/test_is_report.py", "04_templates/IS-report-checklist.md", "04_templates/IS-report-writeup.md", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "06_data/DATA_NOTES.md", "RESOURCES.md"]}, {"day": 18, "date": "Tue 17 Nov 2026", "focus": "WALK-FORWARD AND THE STABILITY HEAT MAP", "week": 3, "start_here": "# DAY 18: Tue 17 Nov 2026: WALK-FORWARD AND THE STABILITY HEAT MAP\n## Does the result depend on a lucky parameter, or a lucky start date?\n\nExploration window only (≤ 2018-12-31). The holdout isn't in this ZIP.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 20 min | Drill | Zetamac + \"3 near-identical rules, best Sharpe 0.22: what's the haircut?\" × 5 | |\n| 30 min | Listen | Pardo Part II on walk-forward analysis (first 30 min) | RESOURCES |\n| 25 min | Read | Carver, \"The three kinds of (over) fitting\" + FPP3 §5.10 | links |\n| 25 min | Read | Bergmeir, Hyndman & Koo, sections 1, 2 and 5 | 01_ |\n| 15 min | Predict | Will WF-reselection beat fixed 10m? Will the DD edge survive a different start? Write it down | |\n| 40 min | Run | `python walk_forward.py --trade <your NIFTYBEES>` then `pytest -q` | 03_ |\n| 45 min | Write | `stability-report-writeup.md` (1 page) | 04_ |\n| 10 min | Log | Add today's 11 trials to trial-log.csv | 04_ |\n| 20 min | Problems | 10 problems | 05_ |\n≈ 3.8 h.\n\n## What the demo shows (index stand-in, OECD cash, after costs, common start 2008-11-03)\n| Test years 2011–2018 | CAGR | Vol | Sharpe xs cash | Max DD |\n|---|---|---|---|---|\n| Re-pick each Jan (expanding) | 4.8% | 11.1% | −0.19 | −22.5% |\n| Re-pick each Jan (rolling 5y) | 4.6% | 11.2% | −0.20 | −22.5% |\n| **Fixed 10m (pre-registered)** | 4.0% | 11.5% | −0.24 | −23.9% |\n| Buy & hold | 7.7% | 15.5% | 0.08 | −26.2% |\n\n- **Re-picking doesn't clearly help.** The expanding scheme picked 8m every single year; the gap to 10m is noise. Walk-forward efficiency is only 0.38 to 0.43.\n- **Plateau, not spike:** across 6 to 14 months, full-period Sharpe runs 0.05 to 0.22; 10m sits in the middle (0.18).\n- **Hansen SPA:** p ≈ 0.91. The best of the grid does NOT beat buy & hold once you pay for the search.\n- **The big one: start-date stability.** The vol ratio stays 0.69 to 0.84 for every start from Sep 2008 to Dec 2009. The drawdown edge is **+18 pp if you start in Sep 2008 and +2 pp from Nov 2008 onward.** One crash month carries the whole DD claim.\n\n## Mentor's rulings\n1. No parameter changes. WF is a diagnostic, not a picker. 10m stays.\n2. The neighbourhood scan is allowed **once**, logged as trials, never selectable.\n3. The start-date finding goes in the write-up in bold. If you want a v2 pre-reg that leans on the vol falsifier over the DD falsifier, write it **before** Day 20, with the reason and trials up. Doing it after you look is fraud.\n4. Report what WF did to the trial count: today adds 11.\n\nSend me: stability_report.md + charts + 1-page write-up + trial-log rows + the 10 problems + training-log row.\nDay 19 (Wed 18 Nov): stress tests: 2× costs, 1-bar delay, drop the best trades, bootstrap.\n", "resources": "# Day 18 resources (checked 31 Oct 2026). ✅ = in this ZIP\n\n## Papers\n- ✅ Bergmeir, Hyndman & Koo (2018), \"A Note on the Validity of Cross-Validation for Evaluating Autoregressive Time Series Prediction,\" *CSDA* 120 (author working paper). When shuffled K-fold is OK for time series and when it isn't. Read sections 1, 2 and 5.\n- Hansen (2005), \"A Test for Superior Predictive Ability,\" *JBES* 23(4). Open copy at the UNC repository: https://cdr.lib.unc.edu/concern/articles/hd76s214m (my sandbox couldn't reach it; open it on your laptop). It asks whether the *best* of many rules beats a benchmark after paying for the search. `walk_forward.py` runs it via `arch`.\n- White (2000), \"A Reality Check for Data Snooping,\" *Econometrica* 68(5), DOI 10.1111/1468-0262.00152 (paywalled; Hansen section 1 summarises it).\n- Pardo, *The Evaluation and Optimization of Trading Strategies* (2nd ed., Wiley 2008), ch. 11 \"Walk-Forward Analysis\" (book, not free; the podcast below covers it).\n\n## Already in earlier kits (re-read, not repeated)\n- Bailey et al., *Probability of Backtest Overfitting* (CSCV): Day 5. That's the combinatorial cousin of today's walk-forward.\n- Arnott, Harvey & Markowitz, *A Backtesting Protocol*: Day 10. Re-read the \"cross-validation\" and \"model dynamics\" items.\n- Harvey & Liu, *Backtesting* (haircuts): Day 5.\n\n## Videos and podcasts\n- *The Algorithmic Advantage* ep. 035, Bob Pardo Part II: \"Building Trading Strategies that Work with Walk Forward Analysis\" (2025). The inventor explains WFA, walk-forward efficiency, and window sizing. https://www.youtube.com/watch?v=Y6cbSyCtKz0\n- Chad Thackray, \"Walk Forward Optimization in Python with Backtesting.py\" (code-along, ~1 h). Watch it for mechanics, then notice that it re-optimises freely, which your pre-reg forbids. https://www.youtube.com/watch?v=9m987swadQU\n- Ernest Chan, \"What is the risk of overfitting a single asset time series?\" (short): https://www.youtube.com/watch?v=S5Qk8WJjehQ\n\n## Blogs and guides (free)\n- Rob Carver, \"The three kinds of (over) fitting\": explicit, implicit, tacit; expanding vs rolling windows. https://qoppac.blogspot.com/2015/11/the-three-kinds-of-overfitting.html\n- Rob Carver, \"Breaking Badly: finding the structural breaks in parameter estimates\" (June 2026): how many years in-sample before a refit helps. https://qoppac.blogspot.com/2026/06/breaking-badly-finding-structural.html\n- Rob Carver, \"Trading strategies that are designed, not fitted\" (slides). Real data is used only for a sensitivity check. https://www.slideshare.net/slideshow/trading-strategies-that-are-designed-not-fittedby-robert-carver-independent-systematic-futures-trader-writer-and-research-consultant/75640564\n- Better System Trader ep. 60 with Robert Pardo (show notes): https://bettersystemtrader.com/060-strategy-optimization-with-robert-pardo/\n- Hyndman & Athanasopoulos, *Forecasting: Principles and Practice* (3rd ed., free online), §5.10 \"Time series cross-validation\": https://otexts.com/fpp3/tscv.html\n\n## Code and docs\n- `arch` multiple-comparison procedures (SPA, StepM, MCS): https://bashtage.github.io/arch/multiple-comparison/multiple-comparisons.html\n- scikit-learn `TimeSeriesSplit` (expanding-window splitter; note its `gap` argument): https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\n- Rob Carver's `pysystemtrade` (expanding-window fitting in production code): https://github.com/robcarver17/pysystemtrade\n\n## Build-along (03_build_along), all run and tested here\n- `walk_forward.py`: WF selection (expanding + rolling 5y) over the pre-registered grid, walk-forward efficiency, year × lookback heat map, 6–14m plateau heat map, Hansen SPA, and **start-date stability**. ~10 s.\n- `test_walk_forward.py`: 5 tests, including \"the pick for year y can't see year y\". `test_is_report.py`: Day 17's 6 tests (11 in total, all passing).\n- `wf_out/`: the demo stability report and 4 charts.\n", "problems": "# Day 18: 10 problems\n1. Re-picking each January (expanding) gave Sharpe −0.19 over 2011–2018; fixed 10m gave −0.24. Does that justify switching to \"WF-selected\"? What else would you need to see?\n2. The expanding scheme picked 8m every year. Two readings: \"8m is truly best\" vs \"early-sample luck locked in\". How would you tell them apart without touching 2019+?\n3. Walk-forward efficiency came out ~0.38 (expanding) and ~0.43 (rolling). Pardo treats ~0.5+ as healthy. Why might a low WFE here say more about regime change than about overfitting?\n4. Start-date stability: the vol ratio stays 0.69 to 0.84 for every start from Sep 2008 to Dec 2009, but the drawdown edge collapses from +18 pp to +2 pp once the start passes Oct 2008. Write the one-sentence consequence for your pre-registered falsifiers.\n5. The SPA \"consistent\" p-value is ~0.91 for \"the best of 8/10/12 beats buy & hold on excess returns\". State the null, the alternative, and what 0.91 means in plain words.\n6. Plateau: 10m ranks 4th of 9 on full-period Sharpe; neighbours range 0.05 to 0.22. Plateau or spike? Why is \"middle of a plateau\" a GOOD place for a primary?\n7. 2009 shows −31 pp vs buy & hold for 8–11m and −58 pp for 12–14m. Explain the mechanism (what was the filter doing in March to May 2009?).\n8. Why must the walk-forward harness run on the SAME aligned start for all variants? What breaks if 14m starts later than 8m?\n9. Your switch cost is 13.9 bps × |Δw|. Name two costs the WF harness still ignores, and say which direction each biases the WF result.\n10. You ran 9 lookbacks + 2 WF schemes today. Update your trial count. Does the neighbourhood scan count toward the DSR N for the primary? Defend your answer in two lines.\n", "files": ["00_START_HERE.md", "01_papers/Bergmeir_Hyndman_Koo_2018_Validity_of_CV_for_Time_Series_author_WP.pdf", "03_build_along/engine.py", "03_build_along/is_report.py", "03_build_along/nse_costs.py", "03_build_along/test_is_report.py", "03_build_along/test_walk_forward.py", "03_build_along/walk_forward.py", "03_build_along/wf_out/heatmap_neighbourhood.png", "03_build_along/wf_out/heatmap_year_x_param.png", "03_build_along/wf_out/stability_report.md", "03_build_along/wf_out/start_date_stability.png", "03_build_along/wf_out/wf_equity.png", "03_build_along/wf_out/wf_results.json", "04_templates/stability-report-writeup.md", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "06_data/DATA_NOTES.md", "RESOURCES.md"]}, {"day": 19, "date": "Wed 18 Nov 2026", "focus": "STRESS TESTS", "week": 3, "start_here": "# DAY 19: Wed 18 Nov 2026: STRESS TESTS\n## Try to kill it before the holdout does\n\nData ≤ 2018-12-31 only. Day 20 (Thu 19 Nov) opens the holdout ONCE.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 20 min | Drill | Zetamac + \"11 trades, best one = all the edge: what's the t-stat?\" × 5 | |\n| 30 min | Read | Hoffstein et al., *Rebalance Timing Luck* (intro, section 2, conclusion) | 01_ |\n| 25 min | Read | Novy-Marx & Velikov intro + buy/hold spread section | 01_ |\n| 25 min | Watch | neurotrader on permutation tests | RESOURCES |\n| 15 min | Predict | Write down BEFORE running: which stress will hurt most? | |\n| 45 min | Run | `python stress.py --trade <your NIFTYBEES> --vol-ratio-max <yours> --dd-edge-min <yours>`, then `pytest -q` | 03_ |\n| 45 min | Write | `stress-report-writeup.md`: verdict per claim | 04_ |\n| 20 min | Problems | 10 problems | 05_ |\n≈ 3.8 h.\n\n## Demo results (index stand-in, same aligned start as Day 17: 2008-09-01)\n| Stress | Sharpe xs cash | Vol ratio | DD edge |\n|---|---|---|---|\n| Base | 0.18 | 0.69 | +18.3 pp |\n| Costs ×3 | 0.16 | 0.69 | +17.9 pp |\n| Delay +1 bar | 0.20 | 0.69 | +20.3 pp |\n| Timing luck, decision days 1–15 | 0.18 to 0.31 | 0.63 to 0.69 | +16.7 to +23.5 pp |\n| **Drop best 1 of 11 trades** | **−0.09** | n/a | n/a |\n| Drop best 10 days | −0.18 | n/a | n/a |\n| Cash −1 pp | 0.22 | 0.69 | +17.6 pp |\n\n- **Costs, delay and timing barely matter.** It trades ~11 times in 10 years.\n- **Returns rest on one trade.** Drop it and Sharpe goes negative. So: no return claim, ever.\n- **Random-timing null:** being in cash ~30% of the time at random dates gives a vol ratio of ~0.87; the real rule gets 0.69 (p ≈ 0.06). About 40% of the vol cut is just exposure. The DD cut isn't clearly better than random timing (p ≈ 0.16).\n- **Bootstrap** (placeholder lines 0.85 / 5 pp): vol falsifier met in 99% of resamples, DD in 80%.\n\n## Mentor's rulings\n1. Use YOUR locked falsifier numbers. The defaults are placeholders.\n2. Stress runs aren't trials (no rule changed). Log them as `stress`, counted_in_dsr = no.\n3. Verdict per claim today: keep / weaken / drop. Any v2 pre-reg must be hashed and dated **before** you open 2019+ tomorrow.\n4. No fixing what a stress reveals. A fix is a new strategy, and it starts again at Day 12.\n\nSend me: stress_report.md + charts + 1-page write-up + stress log rows + 10 problems + training-log row.\nDay 20 (Thu 19 Nov): open the holdout once, run the pre-registered rule, Deflated Sharpe, and grade against your written predictions.\n", "resources": "# Day 19 resources: stress testing (checked 1 Nov 2026). ✅ = in this ZIP\n\n## Papers\n- ✅ Hoffstein, Faber & Braun (2020), \"Rebalance Timing Luck: The (Dumb) Luck of Smart Beta\" (22 pp; SSRN 3673910, open copy via Epsilon Theory). Same rule, different rebalance day, results 100+ bps apart. That's stress S3. Read the intro, section 2 and the conclusion.\n- ✅ Novy-Marx & Velikov (2016), \"A Taxonomy of Anomalies and Their Trading Costs,\" *RFS* 29(1) (NBER WP 20721). Turnover decides whether costs kill a strategy. Your rule trades ~11 times in 10 years, which is why S1 barely moves it. Read the intro + section on the buy/hold spread (it's your band from Day 15).\n- Hoffstein, Sibears & Faber (2019), \"Rebalance Timing Luck: The Difference between Hired and Fired,\" *J. Index Investing* 10(1), DOI 10.3905/jii.2019.1.070. Derives the timing-luck formula and the fix (tranching). Paywalled; the Newfound summary page below covers it.\n- Timothy Masters, *Permutation and Randomization Tests for Trading System Development* (2020, book, not free): the reference for S7. The neurotrader video below teaches the core idea free.\n\n## Already in earlier kits (re-read, not repeated)\n- Frazzini, Israel & Moskowitz, *Trading Costs*: Day 7. Your costs ×2/×3 should be judged against real NSE costs from `nse_costs.py`.\n- Politis & Romano stationary bootstrap / Politis & White block length: Day 17 (`is_report.py`). S8 reuses it.\n- Hansen SPA, Bergmeir et al.: Day 18. Aronson, *Evidence-Based TA*: Day 5.\n\n## Videos\n- neurotrader, \"How I Develop Trading Strategies | Permutation Tests and Trading Strategy Development with Python\": in-sample excellence → in-sample permutation test → walk-forward → walk-forward permutation. https://www.youtube.com/watch?v=NLBXgSmRBgU\n- (Re-watch the Pardo Part II segment on robustness from Day 18 if you skipped it.)\n\n## Blogs and guides (free)\n- Newfound Research, \"Rebalance Timing Luck\" hub (all their papers + plain-English summary): https://www.thinknewfound.com/rebalance-timing-luck\n- Newfound, \"The Dumb (Timing) Luck of Smart Beta\" (2019 blog version): https://blog.thinknewfound.com/2019/11/the-dumb-timing-luck-of-smart-beta\n- Newfound, \"Timing Luck and Systematic Value\" (case study on their own fund, honest about it): https://blog.thinknewfound.com/2019/07/timing-luck-and-systematic-value\n\n## Code\n- neurotrader888/mcpt (MIT): bar-permutation Monte Carlo tests, in-sample and walk-forward. Read `bar_permute.py`; compare its null (shuffle the market) with S7's null (shuffle your timing). https://github.com/neurotrader888/mcpt\n- `arch` bootstrap docs (S8's engine, cross-checked on Day 17): https://bashtage.github.io/arch/bootstrap/bootstrap.html\n\n## Build-along (03_build_along), run and tested here\n- `stress.py`: 8 stress families (S1–S8) on the pre-registered rule, with your falsifier lines → `stress_out/stress_report.md` + 3 charts. ~13 s.\n- `test_stress.py`: 6 tests (delay shifts exactly k bars, cost scaling, spell detection, drop-best logic). Carried over: Day 17–18 scripts.\n", "problems": "# Day 19: 10 problems\n1. Tripling costs moves Sharpe only 0.18 → 0.16. Work out roughly why from turnover (11 round trips in ~10 years, ~14 bps each). At what cost per round trip would the overlay's excess return vanish?\n2. A +5-bar delay IMPROVES the demo (Sharpe 0.24). Is that good news? What does it say about the precision of \"first session of the month\"?\n3. Timing luck: the DD edge ranges from about +17 to +24 pp across decision days 1–15. Using Hoffstein et al.'s idea, propose a tranching fix and say what it costs.\n4. Dropping the single best of 11 trades turns Sharpe 0.18 into −0.09. Write the one sentence this puts in your Day 20 write-up about any RETURN claim.\n5. Why are S4/S5 marked \"n/a\" for the vol and DD falsifiers? What would a fair \"drop best days\" test against buy & hold have to do?\n6. Random-timing null: real vol ratio 0.69 vs a random-timing median of 0.87 (p ≈ 0.06). Split the vol cut into \"exposure\" and \"timing\" in plain words.\n7. The DD cut vs random timing has p ≈ 0.16. Combine that with Day 18's start-date result. What do you now believe about the DD claim?\n8. The cash −1 pp stress barely moves the vol ratio but changes the Sharpe. Why does the cash leg matter more for Sharpe than for vol?\n9. Bootstrap: the vol falsifier holds in ~99% of resamples, the DD falsifier in ~80%. Translate each into the probability language you'd put in front of an investor, without overclaiming.\n10. A friend says: \"It passed every stress, ship it.\" List three things today's stresses CANNOT tell you (hint: regime, capacity, plumbing).\n", "files": ["00_START_HERE.md", "01_papers/Hoffstein_Faber_Braun_2020_Rebalance_Timing_Luck.pdf", "01_papers/NovyMarx_Velikov_2016_Taxonomy_of_Anomalies_and_Trading_Costs_NBER_WP.pdf", "03_build_along/engine.py", "03_build_along/is_report.py", "03_build_along/nse_costs.py", "03_build_along/stress.py", "03_build_along/stress_out/bootstrap.png", "03_build_along/stress_out/random_timing.png", "03_build_along/stress_out/stress_report.md", "03_build_along/stress_out/stress_results.json", "03_build_along/stress_out/timing_luck.png", "03_build_along/test_stress.py", "03_build_along/walk_forward.py", "04_templates/stress-report-writeup.md", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "06_data/DATA_NOTES.md", "RESOURCES.md"]}, {"day": 20, "date": "Thu 19 Nov 2026", "focus": "THE ONE LOOK", "week": 3, "start_here": "# DAY 20: Thu 19 Nov 2026: THE ONE LOOK\n## Open 2019–2026 once. Grade the rule and grade yourself.\n\n**Order matters. Do it in this sequence. Don't open anything sealed early.**\n\n| Step | Time | What | Files |\n|---|---|---|---|\n| 1 | 20 min | Drill: \"SE of an 8-year Sharpe?\" \"E[max of 25 zero-skill Sharpes]?\" × 5 | |\n| 2 | 60 min | Read the base rates: Falck et al. (intro, section 3), McLean-Pontiff (abstract, OOS section), Hurst et al. (skim exhibits) | 01_ |\n| 3 | 20 min | Problems 1–5 (before sealing) | 05_ |\n| 4 | 40 min | Fill `04_templates/predictions.json`: point + 90% interval for 6 numbers, 3 probabilities, your locked falsifier lines, your Day 17 DSR N and trial-Sharpe std, reasoning | 04_ |\n| 5 | 5 min | `python seal_predictions.py --prereg <yours> --lock <LOCK.txt> --pred ../04_templates/predictions.json`, which prints the password | 03_ |\n| 6 | 10 min | Unzip `06_data/SEALED_holdout_2019_2026.zip`. Build or extend your NIFTYBEES 2019–2026 series (bhavcopy, split ex 2019-12-19) | 06_ |\n| 7 | 15 min | `python holdout_report.py --pred ../04_templates/predictions.json --full-signal <FULL csv> --cash <cash 2007_2026 csv> --trade <your NIFTYBEES>`, **once** | 03_ |\n| 8 | 45 min | `holdout-writeup.md` + problems 6–10 | 04_, 05_ |\n| 9 | after | Open my sealed demo report and compare. Mine ran on the index stand-in. | demo/ |\n≈ 3.8 h.\n\n## Mentor's rulings for today\n1. **Predictions first, data second.** The scripts enforce it, the log records it, and I grade the log.\n2. **One run.** `OPENED.log` counts runs. A second run gives the same numbers by construction. Anything you change before a second run makes it a new strategy, with no clean data left to test it on.\n3. **The verdict is the pre-registered falsifiers, as written.** No \"adjusting for COVID\", no re-cut dates, no new lookbacks.\n4. **The real verdict runs on NIFTYBEES** (`--trade`). The index run is a cross-check only.\n5. Surviving ≠ proven. A surviving claim goes into the Day 21 rulebook as \"not yet refuted\", with this report attached.\n6. Write your DSR N exactly as decided on Day 17. If you change it now, say so and why.\n\nSend me: HOLDOUT_REPORT.md + OPENED.log + PREDICTIONS_LOCK.txt + predictions.json + write-up + problems + training-log row.\nDay 21 (Fri 20 Nov, Gate 3): signed rulebook: sizing, risk limits, kill switches, what you'll trade and when.\n", "resources": "# Day 20 resources: the one look (checked 1 Nov 2026). ✅ = in this ZIP\n\nRead these BEFORE you seal your predictions. They tell you how much a backtest usually shrinks out of sample, which is the base rate your predictions should start from.\n\n## Papers\n- ✅ Falck, Rej & Thesmar (2021), \"Why and How Systematic Strategies Decay\" (arXiv 2105.01380; published in *Quantitative Finance* 2022 as \"When do systematic strategies decay?\"). Published anomalies keep about **half** their in-sample Sharpe out of sample. Read the intro + section 3.\n- ✅ McLean & Pontiff (2016), \"Does Academic Research Destroy Stock Return Predictability?\" *JF* 71(1) (author working paper, 2012 version). Returns are **26% lower out of sample** and 58% lower after publication. Abstract + section on OOS vs post-publication.\n- ✅ Hurst, Ooi & Pedersen (2017), \"A Century of Evidence on Trend-Following Investing,\" *JPM* 44(1) (AQR copy). The out-of-sample case FOR trend: it worked across decades and in 8 of the 10 worst 60/40 crises. Your base rate for whether trend survives.\n- Suhonen, Lennkh & Perez (2017), \"Quantifying Backtest Overfitting in Alternative Beta Strategies,\" *JPM* 43(2). 215 bank strategies, median **73% Sharpe drop** from backtest to live; more complex = worse. Paywalled; free summary: https://alphaarchitect.com/looking-at-alternatives-avoid-complexity-and-magical-backtests\n\n## Already in earlier kits: use them today\n- Bailey & López de Prado, **Deflated Sharpe Ratio** (2014) and **PSR** (2012): Day 5 kit, `01_core_papers`. `holdout_report.py` implements both (cross-checked against Day 5's `overfitting_lab.py`).\n- Bailey et al., PBO; Harvey & Liu, *Backtesting*: Day 5. Arnott-Harvey-Markowitz protocol: Day 10. Faber (2007/2013): Day 9.\n\n## Videos\n- Marcos López de Prado, \"Dangers of Backtest Overfitting\" (Day 5 link, re-watch the DSR part): https://www.youtube.com/watch?v=QxhxLwNbMMg\n- The Algorithmic Advantage ep. 035, Bob Pardo Part II (Day 18): his take on what out-of-sample results can and can't prove. https://www.youtube.com/watch?v=Y6cbSyCtKz0\n\n## Blogs (free)\n- Alpha Architect summary of Suhonen et al. (above).\n- CXO Advisory, \"Live Performance of Alternative Beta Products\": https://www.cxoadvisory.com/big-ideas/live-performance-of-alternative-beta-products\n- AQR's page for the century paper: https://www.aqr.com/Insights/Research/Journal-Article/A-Century-of-Evidence-on-Trend-Following-Investing\n\n## Data\n- OECD SDMX API, Short-term interest rates for India (IR3TIB), used for the 2019–2026 cash leg: dataflow `OECD.SDD.STES,DSD_STES@DF_FINMARK`, query `IND.M.IR3TIB.PA.....`\n- RBI DBIE (91-day T-bill, the better cash leg): https://data.rbi.org.in\n\n## Build-along (03_build_along), run and tested here (10 tests pass)\n- `seal_predictions.py`: verifies your pre-reg lock, checks every prediction has a point + 90% interval, hashes them, and prints the holdout password.\n- `holdout_report.py`: refuses to run if predictions changed after sealing, logs every opening, runs the pre-registered rule ONCE, then reports: falsifiers, bootstrap bands, PSR/DSR, your predictions graded (90%-interval hits + Brier), yearly table, charts.\n- `demo/predictions.json`: my own predictions, written before my demo run. `demo/SEALED_mentor_demo_holdout_report.zip` holds my results (same password). Open it only AFTER your own run, to compare.\n", "problems": "# Day 20: 10 problems (do 1–5 BEFORE sealing, 6–10 after the report)\n1. McLean-Pontiff: −26% OOS; Falck et al.: ~50% kept; Suhonen et al.: −73% live. Why are these so different? Which base rate fits a simple 1-parameter trend overlay?\n2. Your IS Sharpe is ~0.18 with a 90% CI roughly −0.3 to +0.6. Over ~8 holdout years, what's a sensible 90% interval for the holdout Sharpe? (Hint: SE ≈ 1/√years for a Sharpe.)\n3. DSR: with N = 25 trials and a trial-Sharpe std of 0.15, the expected best-of-N Sharpe is ≈ 0.30. Your IS Sharpe is 0.18. What does DSR say before you even open the holdout?\n4. Give one reason a monthly filter might do BETTER on drawdown in 2019–2026 than you expect, and one reason it might do worse.\n5. Write the exact sentence you'll publish if the vol falsifier survives and the DD falsifier fails.\n6. Your 90% intervals caught k of 6. If you were perfectly calibrated, what's the probability of catching all 6? Of catching 4 or fewer?\n7. The holdout Sharpe beat your point prediction. Is that evidence you were right? What would \"being right\" look like for a probabilistic forecast?\n8. Holdout ÷ IS Sharpe came out above 1. Name two explanations that are not \"the strategy got better\".\n9. A friend says \"just re-run it on NIFTYBEES instead of the index, and with 9 months, to double-check.\" Which of those is allowed and which is fraud? Why?\n10. The holdout is spent. Where does your next untouched data come from, and how long until it says anything (use the SE from Q2)?\n", "files": ["00_START_HERE.md", "01_papers/Falck_Rej_Thesmar_2021_Why_and_How_Systematic_Strategies_Decay_arXiv.pdf", "01_papers/Hurst_Ooi_Pedersen_2017_Century_of_Evidence_on_Trend_Following_AQR.pdf", "01_papers/McLean_Pontiff_2016_Does_Academic_Research_Destroy_Predictability_WP.pdf", "03_build_along/demo/SEALED_mentor_demo_holdout_report.zip", "03_build_along/demo/predictions.json", "03_build_along/engine.py", "03_build_along/holdout_report.py", "03_build_along/is_report.py", "03_build_along/nse_costs.py", "03_build_along/seal_predictions.py", "03_build_along/stress.py", "03_build_along/test_day20.py", "04_templates/holdout-writeup.md", "04_templates/predictions.json", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "06_data/DATA_NOTES.md", "06_data/SEALED_holdout_2019_2026.zip", "RESOURCES.md"]}, {"day": 21, "date": "Fri 20 Nov 2026", "focus": "THE RULEBOOK · GATE 3", "week": 3, "start_here": "# DAY 21: Fri 20 Nov 2026: THE RULEBOOK · GATE 3\n## Write the rules while you're calm. They're for the day you aren't.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 20 min | Drill | Kelly f* = SR/σ for 5 (SR, σ) pairs; \"worst day in 10 years of NIFTY?\" | |\n| 30 min | Read | SEC Knight order ¶1–30 + FIA section 1 | 02_ |\n| 20 min | Read | SEBI circular (6 pp) + Zerodha summary | 02_, RESOURCES |\n| 25 min | Read | Triple penance (sections 1–3, 6) + Carver \"trading the equity curve\" | 01_, RESOURCES |\n| 30 min | Run | Edit `rulebook.json` → `python limits_calibrator.py --trade <NIFTYBEES IS> --sharpe-lo90 <yours>` → `pytest -q` | 03_ |\n| 50 min | Write | `RULEBOOK.md`, then sign it with the json hash | 04_ |\n| 15 min | Gate | `gate3-checklist.md` | 04_ |\n| 20 min | Problems | 10 problems | 05_ |\n≈ 3.5 h.\n\n## What the demo calibration shows (IS data, Faber 10m, index stand-in)\n- **Kelly:** 1.23× at the point Sharpe, **0× at the lower bound**, so size by risk budget, capped at 1.0×.\n- **False alarms per year while nothing is wrong:** daily halt at 3% fires 41% of years, 5% fires 18%; monthly halt at 10% fires 6%, at 12% 1%; kill at 1.25× backtest DD fires 0.1%.\n- The strategy's worst IS day was −5.9%, so a bootstrap can't say anything about bigger days. Real ones happen.\n- **Triple penance at SR 0.18:** recovery from a bad drawdown can take decades, so no time-based retirement rule.\n- **Draft kill limit on ₹20,000:** about ₹7,700 of drawdown. Change the capital, not the limit.\n\n## Mentor's rulings\n1. **Two kinds of stop:** HALT keeps the position and stops orders. KILL flattens and retires. Loss limits HALT. Only rulebook breaches KILL.\n2. **Every rule is code, every rule has a test that makes it say no.** No test, no rule.\n3. **Capital at risk = money you can lose.** Not money you \"probably won't\" lose.\n4. **No overrides.** Amendments are dated, cooled off for 48 h, re-hashed, and never written during market hours.\n5. **Gate 3 needs the Day 20 verdict.** If the strategy died there, write the backup decision honestly and we run Week 4 plumbing on a simple baseline.\n\nSend me: signed RULEBOOK.md + rulebook.json + limits_report.md + pytest output + gate3-checklist + 10 problems + training-log row.\nDay 22 (Sat 21 Nov): Kite Connect app, cloud VM with a static IP, IP whitelist, 2FA login flow.\n", "resources": "# Day 21 resources: the rulebook (checked 1 Nov 2026). ✅ = in this ZIP\n\n## Regulation and real failures (02_regulation_and_cases)\n- ✅ **SEBI circular, 4 Feb 2025, \"Safer participation of retail investors in Algorithmic trading\"** (SEBI/HO/MIRSD/MIRSD-PoD/P/CIR/2025/0000013, 6 pp). API access only via a unique key + static IP + 2FA; registration needed above a broker-set orders-per-second threshold; brokers keep a kill switch. Page: https://www.sebi.gov.in/legal/circulars/feb-2025/safer-participation-of-retail-investors-in-algorithmic-trading_91614.html\n  - Went live **1 April 2026** after extensions (Livemint, 1 Apr 2026: https://www.livemint.com/market/stock-market-news/sebi-algo-trading-norms-kick-in-today-2fa-audit-trails-for-brokers-now-mandatory-11775022862982.html)\n  - Zerodha's plain-English read of the NSE implementation standards: individuals under **10 orders/second** per segment per exchange need no registration, just a static IP tied to the API key. https://zerodha.com/z-connect/general/a-comprehensive-overview-of-nses-circular-on-the-new-retail-algo-trading-framework\n- ✅ **SEC order against Knight Capital (16 Oct 2013, Release 34-70694)**, 10 pp. 45 minutes, millions of erroneous orders, ~$460M lost. No check comparing orders sent with orders intended, no automated kill, and a dead flag reused. Read paragraphs 1–30. Each failure maps to a check in `risk_engine.py`.\n- ✅ **FIA, *Best Practices for Automated Trading Risk Controls and System Safeguards*** (July 2024, 22 pp). The industry checklist: pre-trade limits, price bands, max order size, kill switches, post-trade reconciliation. Read section 1.\n\n## Papers (01_papers)\n- ✅ Bailey & López de Prado (2015), \"Stop-Outs Under Serial Correlation and 'The Triple Penance Rule',\" *J. of Risk* 18(2) (author copy). Recovery takes ~3× as long as the fall; low-Sharpe strategies can stay under water for decades. Read sections 1–3 and 6.\n- ✅ Van Hemert, Ganz, Harvey, Rattray, Sánchez Martin & Van Hemert (2020), \"Drawdowns,\" *JPM* (Duke copy). Max drawdown is mostly a function of Sharpe and track length, not skill. How deep a drawdown should look, before you panic.\n\n## Already in earlier kits (re-read, not repeated)\n- Thorp (2006) Kelly chapter; MacLean, Thorp & Ziemba (2010): **Day 3**. Today's `kelly_report()` is that chapter applied to your numbers.\n- Carver, \"How much risk should we take?\" and the Kelly posts: **Days 3 and 15**.\n\n## Blogs (free)\n- Rob Carver, \"Random data: Evaluating 'Trading the equity curve'\" (2015): why switching a system off after losses usually hurts. It's the reason your loss limits HALT and don't liquidate. https://qoppac.blogspot.com/2015/11/random-data-evaluating-trading-equity.html\n- Rob Carver, \"When endogenous risk management isn't enough: a simple risk overlay\" (2020): https://qoppac.blogspot.com/2020/05/when-endogenous-risk-management-isnt.html\n- SEC press release on Knight (1-page summary): https://www.sec.gov/newsroom/press-releases/2013-222\n\n## Videos (light block)\n- \"the worst trading algorithm ever created\" (2026): a clear walk-through of Knight's SMARS router and what failed. https://www.youtube.c
