us": "PAPER SESSION 1", "week": 4, "start_here": "# DAY 24: Mon 23 Nov 2026: PAPER SESSION 1\n## Kill switch · crash recovery · phone alerts · dead man's switch\n\nToday the system meets real days. It will mostly do nothing, and doing nothing correctly is the test.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 08:30–09:15 | Pre-market | Manual Kite login → `preflight.py` → `fire_drill.py` (5 alerts on your phone) | 03_ |\n| 20 min | Read | Kite Orders (statuses, today-only book) + Zerodha kill switch page | RESOURCES |\n| 30 min | Set up | Telegram bot or ntfy topic + healthchecks.io check (free, 20 checks) | RESOURCES |\n| 30 min | Study | `recovery.py` + `kill.py`; map each to a Knight failure | 03_ |\n| evening | **Session 1** | append today's NIFTYBEES + NIFTY bhavcopy rows → `python run_live.py …` → read journal + alerts | 03_, 04_ |\n| 30 min | Break it | 2 of the 3 deliberate failures in session-1-log.md | 04_ |\n| 20 min | Problems | 10 problems | 05_ |\n≈ 3.5 h, split around the market.\n\n## The honest calendar\nNSE is shut **Tue 24 Nov** (Guru Nanak Jayanti). Paper sessions run Mon 23, Wed 25, Thu 26, Fri 27 Nov. **None is a decision day.** The next is **Tue 1 Dec**. So Week 4 tests the plumbing, not the strategy. You may run **one** `--force-target` drill to push a paper order through end to end, and label it a drill.\n\n## Mentor's rulings\n1. **Three stop layers:** KILL file (seconds) → `kill.py` cancel/flatten (seconds) → Zerodha Console kill switch (manual, 12-hour lock). Use them in that order.\n2. **Every restart starts with recovery.** Broker truth first; never resend while an order is open.\n3. **A foreign order halts the system.** Including yours from the Kite app. Week 4 has no manual trades.\n4. **Alerts must be rare and actionable.** If you mute a channel, that's an incident.\n5. **The heartbeat lives outside the VM.** Silence is a signal.\n\nSend me: session-1-log.md (with phone screenshots) + journal lines + `pytest -q` (22 pass) + 10 problems + training-log row.\nDay 25 (Tue 24 Nov, market shut): review session 1, fix bugs, build the monitoring dashboard.\n", "resources": "# Day 24 resources: kill switch, recovery, alerts, paper session 1 (checked 1 Nov 2026)\n\n## Broker side\n- Kite Connect **Orders**: `GET /orders` returns today's order book only (\"lives for a day\"); order statuses (OPEN, COMPLETE, CANCELLED, REJECTED and interim ones like VALIDATION PENDING, OPEN PENDING); \"successful placement does not imply execution\": always check order history. `tag` max 20 chars. https://kite.trade/docs/connect/v3/orders/\n- Kite Connect **Portfolio** (holdings incl. `t1_quantity`; positions): https://kite.trade/docs/connect/v3/portfolio/\n- Zerodha **Kill switch** (Console): disables a segment; can be re-enabled only after 12 hours; Zerodha asks you to have no open orders or positions before disabling. https://support.zerodha.com/category/console/segments/killswitch/articles/what-is-the-kill-switch\n- Zerodha video, \"How to disable segments and take a break from trading using Kill Switch?\" (Feb 2024): https://www.youtube.com/watch?v=0C99HmwOAGg\n\n## Alerts and the dead man's switch (all free)\n- Telegram Bot API (`sendMessage`): https://core.telegram.org/bots/api · beginner tutorial (create a bot with BotFather): https://core.telegram.org/bots/tutorial\n- ntfy, publishing (plain HTTP POST, priority header): https://docs.ntfy.sh/publish/\n- healthchecks.io: free Hobbyist plan monitors 20 jobs. https://healthchecks.io/pricing/ · ping endpoints `/start`, `/fail`, success; don't ping more than 5×/min. https://healthchecks.io/docs/http_api/\n\n## Read again (earlier kits)\n- SEC Knight order (Day 21): the 2012 failure was a dormant code path + no automated kill + alerts nobody acted on. Today closes all three.\n- Google SRE ch. 6 (Day 23): alert on symptoms; every page must be actionable.\n\n## Build-along (03_build_along), 22 tests pass\n- `alerts.py`: Telegram + ntfy, INFO/WARN/CRIT, 30-min dedupe for WARN, secret redaction, never crashes the trader. `Heartbeat` for healthchecks.io.\n- `recovery.py`: on every start, reconcile today's broker orders + holdings: apply a missed fill once, never resend while an order is open, HALT on a foreign order or mismatch.\n- `kill.py`: halt (KILL file + cancel our open orders, keep position) / kill (also flatten with a −1% marketable LIMIT) / status / clear (human note ≥ 20 chars → incidents.md).\n- `run_live.py`: the paper session: preflight gate → recovery → run_day → alerts → atomic state → heartbeat. `--force-target` paper-only drill.\n- `fire_drill.py`: sends the 5 drill alerts to your phone + redaction check.\n- Carried: `pipeline.py` (now with `orders_today()`, saved paper-broker state, separate NIFTY signal series), `risk_engine.py`, `rulebook.json`, `kite_session.py`, `preflight.py`, Day 23 tests.\n", "problems": "# Day 24: 10 problems\n1. Why does HALT keep the position while KILL flattens it? Give one situation where flattening on a HALT would hurt you.\n2. Zerodha's Console kill switch needs no open orders first and locks you out for 12 hours. Why is it layer 3 and not layer 1?\n3. Your process crashed right after `place_order` returned an order_id. On restart the order is OPEN at the broker. What must happen, and what must NOT?\n4. Why does a foreign order (no F10 tag) halt the system even if it's on the right side?\n5. Why is a heartbeat from OUTSIDE the VM needed when you already send alerts from inside it?\n6. WARN alerts are deduped for 30 minutes but CRIT never is. Defend both choices.\n7. Paper week (23–27 Nov) has no decision day: the next is Tue 1 Dec. What does the paper week prove, what can't it prove, and why use `--force-target` only once?\n8. ntfy topics are public to anyone who knows the name. What may and may not go in an alert?\n9. The kill flatten uses a −1% LIMIT, not a market order. What can go wrong with that, and what's your fallback?\n10. Write the single sentence you'll put in incidents.md if you ever trade by hand in the Kite app during Week 4.\n", "files": ["00_START_HERE.md", "03_build_along/alerts.py", "03_build_along/fire_drill.py", "03_build_along/kill.py", "03_build_along/kite_session.py", "03_build_along/nse_costs.py", "03_build_along/pipeline.py", "03_build_along/preflight.py", "03_build_along/recovery.py", "03_build_along/risk_engine.py", "03_build_along/rulebook.json", "03_build_along/run_live.py", "03_build_along/test_day24.py", "03_build_along/test_pipeline.py", "04_templates/incident-template.md", "04_templates/session-1-log.md", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "RESOURCES.md"]}, {"day": 25, "date": "Tue 24 Nov 2026", "focus": "(NSE closed, Guru Nanak Jayanti): REVIEW, FIX, SEE", "week": 4, "start_here": "# DAY 25: Tue 24 Nov 2026 (NSE closed, Guru Nanak Jayanti): REVIEW, FIX, SEE\n## Read session 1 like an auditor. Fix with tests. Build the page you'll check every day.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 20 min | Drill | Read 3 journal days → write each session's contract result by hand before running the tool | |\n| 30 min | Read | SRE postmortem chapter + Allspaw \"Blameless PostMortems\" | RESOURCES |\n| 20 min | Demo | `python demo_week.py` → open `demo_out/dashboard.html` + `review.md` | 03_ |\n| 30 min | Review | `python session_review.py --bars … ` on YOUR session-1 files | 03_ |\n| 45 min | Fix | each anomaly → bugs.md: failing-first test → fix → full suite → replay parity still 0 | 04_ |\n| 25 min | Build | `python dashboard.py …` on the VM; view through the SSH tunnel | 03_ |\n| 20 min | Write | 1-page postmortem of session 1 | 04_ |\n| 20 min | Problems | 10 problems | 05_ |\n≈ 3.5 h.\n\n## The 8 session contracts (session_review.py)\nC1 one EOD line a day · C2 no crash · C3 every order resolved · C4 a blocked order is never sent · C5 no unexplained mismatch · C6 book = broker · C7 every CRIT has an incident note · C8 orders only after a decision or a labelled drill.\nA breach becomes a documented event only when incidents.md has a dated note with a cause and a fix.\n\n## Demo week (9 sessions with 3 planted events)\nForced drill → 1 paper buy, shortfall −9.2 bps (noise) · missing preflight → abort + CRIT · planted +5 units → mismatch HALT + CRIT → note → cleared. Contract breaches after the notes: **0**.\n\n## Mentor's rulings\n1. **No fix without a failing-first test**, and replay parity must stay at 0 (Days 16 and 23 rules).\n2. **If a \"fix\" changes when or what you trade, it's a rule change.** 48-hour cooling-off, trial log, no exceptions in Week 4.\n3. **The dashboard shows; it never acts.** Actions go through kill.py and the runbook.\n4. **Postmortems are blameless and specific.** \"Be more careful\" is not an action item.\n5. Paper equity vs buy & hold after a week is noise. Don't read it, don't react to it.\n\nSend me: review.md + bugs.md (with red→green test output) + postmortem.md + a dashboard screenshot + `pytest -q` (31) + 10 problems + training-log row.\nDay 26 (Wed 25 Nov): paper session 2 + live-vs-backtest diff (signals, fills, slippage).\n", "resources": "# Day 25 resources: review, bug fixing, monitoring (checked 1 Nov 2026)\n\n## Reviewing what went wrong, without lying to yourself\n- Google SRE book, ch. 15 \"Postmortem Culture: Learning from Failure\": when to write one, blameless format, what goes in it. https://sre.google/sre-book/postmortem-culture/\n- Google SRE workbook, \"Postmortem Culture\": a worked bad vs good postmortem, side by side. https://sre.google/workbook/postmortem-culture/\n- John Allspaw (Etsy, 22 May 2012), \"Blameless PostMortems and a Just Culture\": the \"second story\": why the action made sense at the time. You are both the engineer and the manager here, so be honest without beating yourself up. https://www.etsy.com/codeascraft/blameless-postmortems\n\n## Monitoring and alerting that you'll obey\n- Google SRE book, ch. 10 \"Practical Alerting\": alert on symptoms, keep pages rare and actionable. https://sre.google/sre-book/practical-alerting/\n- Google SRE workbook, \"Alerting on SLOs\": turning \"is it healthy?\" into numbers with thresholds. Your contract checks C1–C8 are a tiny version. https://sre.google/workbook/alerting-on-slos/\n- SRE ch. 6 golden signals (Day 23 kit): the dashboard's middle panel.\n\n## Measuring the order path\n- Implementation shortfall: the gap between the paper decision and the real fill. The idea comes from André Perold, \"The Implementation Shortfall: Paper Versus Reality\", *Journal of Portfolio Management* 14(3), 1988 (paywalled, so no PDF here). `session_review.py` measures it per fill against the decision-day close.\n\n## Build-along (03_build_along), 31 tests pass\n- `session_review.py`: audits the journal against 8 session contracts (one EOD a day, no crash, every order resolved, blocked orders never sent, no unexplained mismatch, book = broker, every CRIT has an incident note, orders only after a decision or a labelled drill) + implementation shortfall table → `review.md`.\n- `dashboard.py`: one static, read-only HTML page: status banner → risk headroom bars → golden signals → equity vs buy & hold (inline SVG) → preflight → alerts → journal tail. No JS, no CDN, served through an SSH tunnel.\n- `demo_week.py`: a 9-session demo with a forced drill, a missing preflight and a planted mismatch, plus incident notes → `demo_out/review.md`, `demo_out/dashboard.html`. Open it in a browser first.\n- Carried from Day 24: everything + tests.\n", "problems": "# Day 25: 10 problems\n1. The demo week shows contract breaches 0, but two sessions had problems. Why is that correct, and how could it be abused?\n2. Why does the dashboard have NO buttons?\n3. Status priority is KILLED > HALTED > KILL FILE > STALE > OK. Why must HALTED outrank a stale-data warning?\n4. STALE fires after > 4 calendar days without a completed session. Check it against NSE's holiday on Tue 24 Nov 2026. Is 4 right?\n5. The demo drill bought at 273.93 vs the previous close 274.18: shortfall −9.2 bps. Does that mean your execution is good?\n6. A bug fix changes when the order is sent (15:00 → 14:45). Bug fix or rule change? What process applies?\n7. Your dashboard shows equity −0.87% vs buy & hold −0.42% after a week. Write the one sentence you'd tell a friend who says \"your strategy is losing\".\n8. Why does every CRIT alert need an incident note, even for a drill?\n9. Which of the 8 contracts would have caught Knight Capital's failure mode on day one? Explain.\n10. Name one thing the dashboard does NOT tell you that you still must check by hand each day.\n", "files": ["00_START_HERE.md", "03_build_along/alerts.py", "03_build_along/dashboard.py", "03_build_along/demo_out/alerts.log", "03_build_along/demo_out/dashboard.html", "03_build_along/demo_out/incidents.md", "03_build_along/demo_out/journal.jsonl", "03_build_along/demo_out/preflight.json", "03_build_along/demo_out/review.md", "03_build_along/demo_out/state.json", "03_build_along/demo_week.py", "03_build_along/fire_drill.py", "03_build_along/kill.py", "03_build_along/kite_session.py", "03_build_along/nse_costs.py", "03_build_along/pipeline.py", "03_build_along/preflight.py", "03_build_along/recovery.py", "03_build_along/risk_engine.py", "03_build_along/rulebook.json", "03_build_along/run_live.py", "03_build_along/session_review.py", "03_build_along/test_day24.py", "03_build_along/test_day25.py", "03_build_along/test_pipeline.py", "04_templates/bugs.md", "04_templates/postmortem.md", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "RESOURCES.md"]}, {"day": 26, "date": "Wed 25 Nov 2026", "focus": "PAPER SESSION 2 + LIVE vs BACKTEST", "week": 4, "start_here": "# DAY 26: Wed 25 Nov 2026: PAPER SESSION 2 + LIVE vs BACKTEST\n## Same days, same rule: did live do what the backtest says it would?\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 08:30–09:20 | Pre-market | login → preflight → dashboard check | Day 24–25 tools |\n| 20 min | Drill | Compute 3 slippage numbers by hand (fill vs close, in bps, signed) | |\n| 40 min | Read | Frazzini–Israel–Moskowitz \"Trading Costs\": intro + shortfall definition + figures | 01_papers |\n| 15 min | Read | NIFTYBEES product note: benchmark, unit size, TRI vs price index | 02_reference |\n| 20 min | Demo | `python demo_paper_weeks.py` → read `demo_out/diff_report.md` | 03_ |\n| evening | **Session 2** | `run_live.py` → `session_review.py` → `dashboard.py` | 03_ |\n| 30 min | Diff | `python live_vs_backtest.py --journal … --bars … --signal …` on sessions 1–2 → fill the template | 03_, 04_ |\n| 20 min | Problems | 10 problems | 05_ |\n≈ 3.5 h, split around the market.\n\n## The five diffs (check in order)\nD1 signal → D2 position → D3 fills → D4 fees → D5 return attribution:\n**live = backtest(index) + timing/sizing + ETF-vs-index + slippage + fees + residual**\n\n## Demo result (25 sessions over the 3 Dec 2018 decision)\nD1 1/1 match · D2 0 mismatch days · D3 1 fill, excess 0.0 bps (paper, by construction) · D4 fee ₹3.72 = model · D5: live −0.30% = backtest −0.06% + timing 0.00% + ETF-vs-index −0.17% + slippage −0.05% + fees −0.02% + residual 0.00%.\n\n## Honest limits\n- Week 4 has **no decision day**, so D1 will be empty for your real sessions; that's expected, not a pass.\n- One or two fills **can't** test slippage. At ~8 bps spread per fill you need about 11 fills to decide at a 5 bps tolerance, roughly 5–6 years at this strategy's pace. Write that into the memo.\n\n## Mentor's rulings\n1. **An unexplained mismatch in D1/D2, or a residual above 5 bps, stops the system.** Slippage and tracking within known bands get logged.\n2. **Measure against the TRI-tracking instrument, not the price index you signal on.** The gap is real money (dividends).\n3. **\"Undecided\" is a valid, honest result.** Never round it up to \"pass\".\n\nSend me: diff template filled + diff_report.md + session-2 review + 10 problems + training-log row.\nDay 27 (Thu 26 Nov): paper session 3 + failure drills (kill switch, lost connection, rejected order).\n", "resources": "# Day 26 resources: live vs backtest (checked 1 Nov 2026)\n\n## Papers (01_papers)\n- **Frazzini, Israel & Moskowitz (2018), \"Trading Costs\"** (AQR/Yale working paper, 88 pp; free author copy). 1.7 trillion dollars of live execution data across 21 developed markets over 19 years: actual costs were an order of magnitude smaller than earlier studies suggested. Read the intro, the implementation-shortfall definition, and the size and time-of-day results. The lesson for you: measure your own fills, don't guess. SSRN: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3229719\n- Perold (1988), implementation shortfall: cited in the Day 25 kit.\n\n## The instrument you actually trade (02_reference)\n- **Nippon India ETF Nifty 50 BeES, product note (Sep 2026, official PDF)**: benchmark is the **Nifty 50 TRI**; 1 unit ≈ 1/100 of the index; NAV is published daily on AMFI by 11 pm. Performance to 30 Sep 2026: 1 year −7.11% vs Nifty 50 TRI −7.09%; 5 years 6.33% vs 6.37% CAGR. https://mf.nipponindiaim.com/FundsAndPerformance/ProductNotes/NipponIndia-ETF-Nifty-50-BeES-Sep-2026.pdf\n- Fund page (NAV, tracking error, monthly disclosures): https://etf.nipponindiaim.com/Funds/details/14\n- NSE, \"Tracking error\" explainer: https://www.nseindia.com/static/products-services/indices-tracking-error\n\n**Why this matters today:** your signal and backtest use the NIFTY 50 *price* index, but NIFTYBEES tracks the *total-return* index and trades at a small premium or discount to its NAV. So D5's \"ETF vs index\" line will drift **positive** over long holds (the dividend yield was 1.22% on 30 Sep 2026, per the same note) and wobble day to day with the premium. The Day 13 ruling (benchmark = NIFTY 50 TRI) is why.\n\n## From earlier kits\n- Cost model `nse_costs.py` (Day 7), ETF round trip ≈ 13.9 bps incl. 5 bps a side for spread (Day 10), \"never model fills at the ETF open\" (Day 14), parity (Day 23), contracts and shortfall (Day 25).\n\n## Build-along (03_build_along), 36 tests pass\n- `live_vs_backtest.py`: five diffs in order: **D1 signal** (live decision vs recomputed on final data), **D2 position** (daily in/out vs backtest, drills labelled), **D3 fills** (slippage vs the 5 bps assumption), **D4 costs** (fees vs model), **D5 return attribution** (live = backtest(index) + timing/sizing + ETF-vs-index + slippage + fees + residual). Plus an honest slippage verdict with the number of fills needed.\n- `demo_paper_weeks.py`: 25 paper sessions over a REAL decision day (3 Dec 2018) with a simulated ETF premium → `demo_out/diff_report.md`.\n- Carried: the full Day 25 stack (pipeline, risk, recovery, alerts, kill, run_live, review, dashboard) + `engine.py`.\n", "problems": "# Day 26: 10 problems\n1. Why must D1 pass before D2, and D2 before D3, means anything?\n2. A decision recomputed on today's data disagrees with the live decision. Give two causes, and how to tell them apart.\n3. Paper fills are close ± 5 bps by construction. So what does D3 actually test during the paper week?\n4. Your demo shows ETF vs index −0.17% in 5 weeks. Over 10 years, which sign do you expect, and why?\n5. The verdict is UNDECIDED with 1 fill. Using sd ≈ 8 bps per fill, how many fills until the test can decide at a 5 bps tolerance? How many years is that at ~2 trades a year?\n6. Given (5), how should the go/no-go memo word the slippage criterion so it's honest?\n7. Residual is +0.000% in the demo. What would a residual of −0.4% most likely mean?\n8. Frazzini et al. found real costs far below earlier estimates. Why can't you borrow their numbers for NIFTYBEES at ₹20,000?\n9. Live holds 99% (whole units), the backtest holds 100%. Where does that show up, and does it matter?\n10. Write the rule: when does a live-vs-backtest gap become a reason to STOP rather than to log?\n", "files": ["00_START_HERE.md", "01_papers/Frazzini_Israel_Moskowitz_2018_Trading_Costs.pdf", problems | 05_ |\n≈ 3.5 h of deep work + the session.\n\n## Code drill results today (before your fixes)\n11 PASS · **1 SAFE-BUT-ACCIDENTAL** (D05: lost connection after the order left. No double order, but only because the duplicate-tag guard HALTED) · 0 FAIL. D10 also left a temp file after a failed save. Both are now failing-first tests for you.\nAfter the fix (checked, sealed in solutions): 12/12 PASS.\n\n## Mentor's rulings\n1. **Drills run on paper only.** Never inject a fault into a live account.\n2. **One fault at a time; undo it before the next.** Two faults at once teach you nothing.\n3. **Safe for the wrong reason is a bug.** Log it, test it, fix it.\n4. **After any 5xx or timeout on an order: ask the broker by tag, never resend.**\n5. **The Console kill switch is a tabletop drill this week** (12-hour lock).\n6. These two fixes don't change when or what you trade, so they're bug fixes, not rule changes. Prove it: replay parity still shows 0 mismatch days.\n\nSend me: drills_report.md (12/12), both bug entries with red and green output, the game-day sheet with phone times, the session-3 review and diff, 10 problems, and a training-log row.\nDay 28 (Fri 27 Nov): paper session 4 + go/no-go memo (graduation).\n", "resources": "# Day 27 resources: failure drills (checked 1 Nov 2026)\n\nAll free. Read in this order.\n\n## Core reading\n1. **Principles of Chaos Engineering** (principlesofchaos.org, last updated March 2019), 10 min. The four-step recipe drills.py follows: define steady state → hypothesis → inject a real-world fault → look for a difference. Plus: minimise blast radius. https://principlesofchaos.org/\n2. **Kripa Krishnan, \"Weathering the Unexpected\"** (ACM Queue vol. 10 no. 9, 16 Sep 2012), 20 min. Google's DiRT disaster-recovery drills. Best lines for you: only one person found the emergency plan on the first drill; \"copious documentation on how something should work doesn't mean anyone will use it\". Read Limoncelli's sidebar (a drill seen from the person being tested). https://queue.acm.org/detail.cfm?id=2371516\n3. **Google SRE Book ch. 17, \"Testing for Reliability\"** (Perry & Luebbe), 30 min. Opens with \"If you haven't tried it, assume it's broken.\" Read: \"tests that are failing generally prove the absence of reliability\", turning every bug into a test, and the break-glass section. https://sre.google/sre-book/testing-reliability/\n4. **Google SRE Book ch. 13, \"Emergency Response\"**, 15 min: what to do when the drill is real. https://sre.google/sre-book/emergency-response/\n\n## The broker side (what your fakes imitate)\n- **Kite Connect, \"Exceptions and errors\"**: TokenException (403, session expired: log in again), NetworkException (can't reach the OMS), MarginException, HoldingException, InputException, OrderException; HTTP 429/502/503/504; limits of 10 orders a second, 400 a minute, 5,000 a day, and 25 modifications per order. https://kite.trade/docs/connect/v3/exceptions/\n- Zerodha Console kill switch: disables a segment, can only be re-enabled after 12 hours (Day 24 kit).\n\n## From earlier kits (not repeated)\nKnight Capital SEC order (Day 21), the kill.py / recovery.py design (Day 24), postmortem templates (Day 25), live-vs-backtest diff (Day 26).\n\n## Build-along (03_build_along): 49 tests pass, plus 2 marked \"expected to fail\" (your bugs)\n- `drills.py`: 12 code drills against your real pipeline, run in temp folders with Kite-shaped fake brokers: kill file, kill.py cancel and flatten, connection lost before or after the send, rejection, missing data, stale preflight, expired token, disk full, double run, a manual trade.\n- `test_day27.py`: every drill as a test, a check that the harness itself catches a broken kill switch, and **2 strict-xfail bugs the drills found**.\n", "problems": "# Day 27: 10 problems\n1. In chaos terms, what is the \"steady state\" for your system? Give three measurable outputs.\n2. D04 and D05 both start with \"connection lost\". Why is one harmless and the other the most dangerous drill of the day?\n3. D05 was safe. Why is \"safe for the wrong reason\" still a bug?\n4. Why does drills.py check that the harness FAILS when the kill switch is broken?\n5. A rejected order: why retry tomorrow with a new tag instead of resizing and resending today?\n6. Kite returns 504 on place_order. List what you know and don't know, and the ONE call you make next.\n7. Why is a code drill not enough? Name two things only the VM game day can test.\n8. Krishnan: only one person found the emergency plan in the first DiRT. What's your version of that risk?\n9. Why must the Console kill switch stay a tabletop exercise this week?\n10. Write the graduation line \"failure drills passing\" as a checkable rule.\n", "files": ["00_START_HERE.md", "03_build_along/alerts.py", "03_build_along/dashboard.py", "03_build_along/drills.py", "03_build_along/drills_report.md", "03_build_along/engine.py", "03_build_along/fire_drill.py", "03_build_along/is_report.py", "03_build_along/kill.py", "03_build_along/kite_session.py", "03_build_along/live_vs_backtest.py", "03_build_along/nse_costs.py", "03_build_along/pipeline.py", "03_build_along/preflight.py", "03_build_along/recovery.py", "03_build_along/risk_engine.py", "03_build_along/rulebook.json", "03_build_along/run_live.py", "03_build_along/session_review.py", "03_build_along/test_day24.py", "03_build_along/test_day25.py", "03_build_along/test_day26.py", "03_build_along/test_day27.py", "03_build_along/test_pipeline.py", "04_templates/bugs_from_drills.md", "04_templates/game_day_runbook.md", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "RESOURCES.md"]}, {"day": 28, "date": "Fri 27 Nov 2026", "focus": "PAPER SESSION 4 + GO/NO-GO MEMO (GRADUATION)", "week": 4, "start_here": "# DAY 28: Fri 27 Nov 2026: PAPER SESSION 4 + GO/NO-GO MEMO (GRADUATION)\n## Evidence decides. You sign. And GO only ever means Stage 1.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 30 min | Read | SRE ch. 27 (launch checklist, staged rollouts) + Appendix E skim | RESOURCES.md |\n| 30 min | Read | Varsity Module 9: position sizing and psychology chapters | RESOURCES.md |\n| 15 min | Demo | `python demo_gonogo.py` → read why it says NO-GO | 03_ |\n| 60 min | Evidence | Fill evidence.json from your real Week 4 files; confirm Day 27 fixes → drills 12/12 | 04_ |\n| 60 min | Write | memo_sections.md (≥ 300 words), honestly | 04_ |\n| evening | **Session 4** | run_live → session_review → dashboard → live_vs_backtest (sessions 1–4) | 03_ |\n| 15 min | Verdict | `python gonogo.py --evidence evidence.json` → GO_NO_GO.md | 03_ |\n| 20 min | Plan | ramp_plan.md + first_live_day_checklist.md | 04_ |\n| 20 min | Problems | 10 problems | 05_ |\n\n## Demo verdict: NO-GO (on purpose)\nG0 ✅ G1 ✅ G2 ✅ G3 pass with caveat (1 fill can't decide) · **G4 ❌** (D05 safe only by accident: the Day 27 bug) · G5 ✅ · **G6 ❌** (stub memo).\nMinTRL for this rule's in-sample Sharpe: **about 89 months (~7 years)** of live monthly returns before P&L means anything (rough: index, no costs).\nChecked: with the Day 27 fixes and a real memo, the verdict becomes **GO: STAGE 1 ONLY**.\n\n## Mentor's rulings (final)\n1. **NO-GO is a pass of a different kind.** If the evidence says no, the paper week continues. No shame, no shortcuts.\n2. **Never edit evidence to flip a gate.** Change the system, then re-run.\n3. **GO = Stage 1: ≤ 25% of capital_at_risk for ≥ 3 months and ≥ 2 real orders.** Promote by calendar and clean operations, never by P&L.\n4. **Live P&L is noise for years (MinTRL).** Judge plumbing and discipline. Grade decisions, not outcomes, as on Day 1.\n5. **Week 4 had no decision day; the first real one is Tue 1 Dec 2026.** If you go live, that's Stage 1's first order: watch it happen in the Kite app.\n6. No one, me included, can promise this makes money. What you've built is a disciplined way to find out without getting hurt.\n\nSend me: GO_NO_GO.md, your memo sections, evidence.json, the ramp plan and checklist filled in, the session-4 review, 10 problems, and the final training-log row with your own grade for these 28 days.\n", "resources": "# Day 28 resources: graduation and go/no-go (checked 1 Nov 2026)\n\nAll free. Most of what you need was already built in Days 1–27; today's reading is about **launching safely**.\n\n## Read today\n1. **Google SRE Book ch. 27, \"Reliable Product Launches at Scale\"** (Singh, Kirsch, Rau), 30 min. Read \"The Launch Checklist\" (every question must be backed, ideally, by a past launch disaster), \"Gradual and Staged Rollouts\" (canaries), and \"Rollout Planning\" (contingency measures). Your ramp plan is a canary. https://sre.google/sre-book/reliable-product-launches/\n2. **Google SRE Book Appendix E, \"Launch Coordination Checklist\"**, 10 min. Skim it, then cut it down to your own one-page first-live-day checklist (04_templates). https://sre.google/sre-book/launch-checklist/\n3. **Zerodha Varsity, Module 9 \"Risk Management & Trading Psychology\"** (Karthik Rangappa, free), 40 min, chapters on position sizing and your trading psychology. Written for Indian retail traders, on your broker. https://zerodha.com/varsity/module/risk-management/\n\n## Re-read from earlier kits (not repeated here)\n- **Bailey & López de Prado (2012), \"The Sharpe Ratio Efficient Frontier\"**: Minimum Track Record Length (Day 5 kit). gonogo.py uses its formula to tell you how many years live P&L stays noise.\n- **Klein's pre-mortem** (Day 10 kit): section 3 of your memo.\n- **SEBI retail algo framework** (4 Feb 2025 circular, live 1 Apr 2026; Day 21 kit): static IP, 2FA, under 10 orders a second needs no registration.\n- **Knight Capital SEC order** (Day 21): why a wrong live deploy is the most expensive mistake in this whole course.\n- Kite exceptions (Day 27), Zerodha kill switch (Day 24), parity (Day 23), holdout seal (Day 20), rulebook lock (Day 21).\n\n## Build-along (03_build_along): 59 tests pass, plus Day 27's 2 xfails until you fix them\n- `gonogo.py`: reads your evidence pack and checks seven gates. **G0** the strategy passed its own pre-registered holdout test; **G1** no unexplained orders; **G2** signal parity; **G3** slippage; **G4** failure drills (12 of 12 plus the game day); **G5** integrity (rulebook hash, holdout opened once); **G6** human (money you can lose, written memo). It also computes the minimum track record length. It can say NO-GO by itself; GO only ever means **Stage 1**.\n- `demo_gonogo.py`: a full evidence pack from the demo paper weeks gives **NO-GO**, on purpose: G4 fails (the Day 27 bug is still in this code) and G6 fails (stub memo). Checked: with the Day 27 fixes and a real memo, it gives GO: STAGE 1 ONLY.\n", "problems": "# Day 28: 10 problems\n1. Why can gonogo.py say NO-GO alone but never full GO alone?\n2. G0 fails (holdout falsifiers failed) but G1–G6 all pass. What do you do, and why can't great plumbing save it?\n3. G3 is \"PASS WITH CAVEAT\". Write the exact sentence for the memo.\n4. MinTRL says ~7 years. What CAN you judge after 3 months of Stage 1?\n5. Month 2 of Stage 1: you're up 6% and the market's up 1%. What changes in the plan?\n6. Month 2: you're down 9% on a rule-following drawdown inside the band. What changes?\n7. Why does the ramp promote by calendar AND evidence, not by P&L?\n8. Your friend says: \"Skip Stage 1, the code is tested.\" Give two answers from this course.\n9. Why is the account balance itself a risk control?\n10. The demo is NO-GO. List exactly what flips it, and why no flip is allowed by editing evidence.json.\n", "files": ["00_START_HERE.md", "03_build_along/alerts.py", "03_build_along/dashboard.py", "03_build_along/demo_gonogo.py", "03_build_along/demo_out/GO_NO_GO_demo.md", "03_build_along/demo_out/OPENED.log", "03_build_along/demo_out/alerts.log", "03_build_along/demo_out/diff_report.md", "03_build_along/demo_out/evidence.json", "03_build_along/demo_out/incidents.md", "03_build_along/demo_out/journal.jsonl", "03_build_alo           syncSide();
          setMenu(false);
          if (!firstRoute && keep !== true) {
            window.scrollTo(0, 0);
            var h1 = view.querySelector("h1[tabindex], h2[tabindex]");
            if (h1) h1.focus({ preventScroll: true });
          }
          firstRoute = false;
        }

        /* ---------- events ---------- */
        view.addEventListener("click", function (e) {
          var tab = e.target.closest('[role="tab"]');
          if (tab) { selectTab(tab, false); return; }
          var t = e.target.closest("button, a, input, label, select, textarea");
          var row = e.target.closest("tr.x-rowlink");
          if (row && !t) { location.hash = "day-" + row.getAttribute("data-day"); return; }
          if (!t || t.tagName !== "BUTTON") return;
          if (t.hasAttribute("data-start")) { startTimer(route.day, +t.getAttribute("data-start")); return; }
          if (t.hasAttribute("data-toc")) {
            var hd = tocHeads[+t.getAttribute("data-toc")];
            if (hd) {
              hd.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
              hd.focus({ preventScroll: true });
              if (window.innerWidth <= 1100) document.getElementById("toc").open = false;
            }
            return;
          }
          if (t.parentNode.classList.contains("x-more")) {
            var pre = t.parentNode.previousElementSibling, open = pre.classList.toggle("x-clamp");
            t.setAttribute("aria-expanded", open ? "false" : "true");
            t.textContent = open ? "Show all " + pre.textContent.split("\n").length + " lines" : "Show less";
            return;
          }
          if (t.hasAttribute("data-week-filter")) {
            delivWeek = +t.getAttribute("data-week-filter");
            [].forEach.call(view.querySelectorAll("[data-week-filter]"), function (b) { b.setAttribute("aria-pressed", b === t ? "true" : "false"); });
            [].forEach.call(view.querySelectorAll("tr.x-rowlink"), function (r) { r.hidden = !!delivWeek && +r.getAttribute("data-week") !== delivWeek; });
            return;
          }
          if (t.id === "sub-select" || t.id === "code-select") {
            var box = document.getElementById(t.id === "sub-select" ? "sub-out" : "code-out");
            box.focus();
            box.select();
            box.setSelectionRange(0, box.value.length);
            if (t.id === "sub-select") document.getElementById("sub-msg").textContent = "Selected. Press Ctrl+C (or ⌘C) to copy.";
            return;
          }
          if (t.id === "sub-copy") {
            var out = document.getElementById("sub-out"), msg = document.getElementById("sub-msg");
            out.focus(); out.select(); out.setSelectionRange(0, out.value.length);
            var okCopy = false;
            try { okCopy = document.execCommand("copy"); } catch (err) { okCopy = false; }
            msg.textContent = okCopy ? "Copied." : "Copy is blocked here. The text is selected: press Ctrl+C (or ⌘C).";
            return;
          }
          if (t.id === "code-restore") {
            var inp = document.getElementById("code-in"), cmsg = document.getElementById("code-msg");
            if (decodeState(inp.value)) {
              render(true);
              var m2 = document.getElementById("code-msg");
              if (m2) m2.textContent = "Restored: " + doneCount(DAYS) + " days done, " + sentCount() + " deliverables sent.";
              var cb = document.getElementById("code-restore");
              if (cb) cb.focus();
            } else {
              cmsg.textContent = "That code didn't work. Paste the whole code, starting with QA-.";
              inp.focus();
            }
          }
        });
        view.addEventListener("input", function (e) {
          var t = e.target;
          if (t.id === "day-notes") { notes[route.day] = t.value; refreshSub(); }
          else if (t.hasAttribute("data-sub") && t.type !== "checkbox") { (subs[route.day] = subs[route.day] || {})[t.getAttribute("data-sub")] = t.value; refreshSub(); }
          else if (t.id === "lib-q") { libState.q = t.value; renderLib(); }
        });
        function refreshSub() {
          var o = document.getElementById("sub-out");
          if (o) o.value = subMessage(route.day);
        }
        view.addEventListener("keydown", function (e) {
          var tab = e.target.closest && e.target.closest('[role="tab"]');
          if (!tab || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
          var tabs = [].slice.call(view.querySelectorAll('[role="tab"]'));
          var i = tabs.indexOf(tab) + (e.key === "ArrowRight" ? 1 : -1);
          if (i >= 0 && i < tabs.length) selectTab(tabs[i], true);
          e.preventDefault();
          e.stopPropagation();
        });
        view.addEventListener("change", function (e) {
          var t = e.target;
          if (t.id === "done-box") {
            done[route.day] = t.checked;
            syncSide();
          } else if (t.hasAttribute("data-block")) {
            var i = +t.getAttribute("data-block");
            blocksOf(route.day)[i] = t.checked;
            t.closest("li").classList.toggle("is-done", t.checked);
            var st = sessionStats(route.day);
            document.getElementById("sess-line").innerHTML = sessionLine(route.day);
            document.getElementById("sess-meter").style.width = (100 * st.done / st.total) + "%";
          } else if (t.hasAttribute("data-sent")) {
            sent[+t.getAttribute("data-sent")] = t.checked;
            t.closest("tr").classList.toggle("is-sent", t.checked);
            document.getElementById("sent-count").textContent = sentCount() + " of 28 sent";
          } else if (t.hasAttribute("data-gate")) {
            gateChk[+t.getAttribute("data-gate")][+t.getAttribute("data-ci")] = t.checked;
            t.closest("li").classList.toggle("is-done", t.checked);
            var box = t.closest(".x-gatebox"), gi = +t.getAttribute("data-gate");
            var fp = box.querySelector(".x-gatebox__head .fineprint");
            var g = GATES[gi], met = gateChk[gi].filter(Boolean).length;
            fp.innerHTML = '<a class="link" href="#day-' + g.day + '">Day ' + g.day + "</a>: " + esc(planOf(g.day).deliverable) + " · " + met + " of " + g.items.length + " met";
          } else if (t.getAttribute("data-sub") === "withNotes") {
            (subs[route.day] = subs[route.day] || {}).withNotes = t.checked;
            refreshSub();
          } else if (t.id === "lib-domain") { libState.domain = t.value; renderLib(); }
          else if (t.id === "lib-day") { libState.day = t.value; renderLib(); }
        });
        document.addEventListener("keydown", function (e) {
          if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
          var t = e.target, tag = t && t.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
          if (e.key === "/") {
            e.preventDefault();
            var lq = document.getElementById("lib-q");
            if (lq) { lq.focus(); return; }
            if (window.innerWidth <= 900) setMenu(true);
            search.focus();
            search.select();
          } else if (e.key === "t" || e.key === "T") {
            e.preventDefault();
            var target = "day-" + todayTarget();
            if (location.hash.slice(1) === target) render(); else location.hash = target;
          }
        });
        document.addEventListener("keydown", function (e) {
          if (route.name !== "day" || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
          var t = e.target, tag = t && t.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
          if (e.key === "ArrowLeft" && route.day > 1) { location.hash = "day-" + (route.day - 1); e.preventDefault(); }
          if (e.key === "ArrowRight" && route.day < DAYS.length) { location.hash = "day-" + (route.day + 1); e.preventDefault(); }
        });
        menuBtn.addEventListener("click", function () { setMenu(!side.classList.contains("is-open"), true); });
        document.getElementById("menu-close").addEventListener("click", function () { setMenu(false, true); });
        document.getElementById("scrim").addEventListener("click", function () { setMenu(false, true); });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && side.classList.contains("is-open") && !(e.target === search && search.value)) setMenu(false, true);
        });
        window.addEventListener("resize", function () {
          if (window.innerWidth > 900 && side.classList.contains("is-open")) setMenu(false);
        });
        search.addEventListener("input", filter);
        search.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            var first = list.querySelector("li:not([hidden]) [data-day]");
            if (first) location.hash = "day-" + first.getAttribute("data-day");
          }
          if (e.key === "Escape") { search.value = ""; filter(); }
        });
        list.addEventListener("click", function (e) {
          var a = e.target.closest("a");
          if (a && a.getAttribute("href") === location.hash) setMenu(false);
        });
        window.addEventListener("hashchange", function () { render(); });

        buildSide();
        render();
      })();
    </script>
  </body>
</html>
