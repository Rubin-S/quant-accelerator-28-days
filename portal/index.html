<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quant Accelerator: 28 Days</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <style>
      /* full-width layout */
      html, body { overflow-x: clip; }
      #top.page { max-width: none; padding-inline: clamp(12px, 1.6vw, 28px); }
      .x-app { display: grid; grid-template-columns: clamp(260px, 19vw, 320px) minmax(0, 1fr); gap: clamp(24px, 3vw, 56px); align-items: start; }
      .x-main { min-width: 0; padding-inline-end: clamp(0px, 2vw, 40px); }
      .x-main img, .x-main video, .x-main svg { max-width: 100%; height: auto; }
      .x-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 20; display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 24px); height: calc(100dvh - 24px); min-width: 0; }
      .x-drawer-head, .x-scrim { display: none; }
      .x-bar { display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 16px; border-radius: var(--r-pill); box-shadow: var(--hark-shadow); background: var(--fill-primary); color: var(--text-primary-on); border: 1px solid var(--stroke-primary-on); }
      .x-bar :focus-visible { outline-color: var(--fill-primary-on); }
      .x-brand { flex: 1; min-width: 0; min-height: var(--tap); display: flex; align-items: center; font: var(--type-label); color: var(--text-primary-on); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .x-brand span { overflow: hidden; text-overflow: ellipsis; }
      .x-menu { display: none; flex: none; height: var(--tap); min-width: var(--tap); padding: 0 18px; border: 0; border-radius: var(--r-pill); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-label); font-weight: var(--weight-bold); cursor: pointer; }
      .x-panel-side { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 12px; border-radius: var(--r-l); background: var(--fill-tertiary); }
      .x-search { width: 100%; height: var(--tap); padding: 0 14px; border: 1px solid var(--stroke-primary); border-radius: var(--r-s); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-small); }
      .x-search::placeholder { color: var(--text-secondary); }
      .x-list { overflow-y: auto; min-height: 0; margin: 0 -4px; padding: 0 4px; overscroll-behavior: contain; }
      .x-list ul { list-style: none; margin: 0; padding: 0; }
      .x-group { padding: 14px 10px 4px; font: var(--type-tag); color: var(--text-secondary); }
      .x-link { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 8px; align-items: baseline; min-height: var(--tap); padding: 8px 10px; border-radius: var(--r-s); color: var(--text-primary); text-decoration: none; font: var(--type-small); }
      .x-link:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
      .x-link--top { grid-template-columns: minmax(0, 1fr); align-items: center; font: var(--type-label); }
      .x-link__num { font: var(--size-caption)/1.3 "Geist Mono", ui-monospace, monospace; color: var(--text-secondary); }
      .x-link__title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .x-link__meta { grid-column: 2; margin-top: 2px; font: var(--type-caption); color: var(--text-secondary); }
      .x-link.is-done .x-link__meta::after { content: " · Done"; color: var(--fill-system-green); font-weight: var(--weight-medium); }
      .x-link.is-today .x-link__num { color: var(--text-primary); font-weight: var(--weight-bold); }
      .x-link[aria-current="page"] { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-link[aria-current="page"] .x-link__num, .x-link[aria-current="page"] .x-link__meta { color: var(--text-secondary-on); }
      .x-count { padding: 0 4px; font: var(--type-caption); color: var(--text-secondary); }

      .x-main:focus { outline: none; }
      .x-main h1:focus, .x-main h2:focus { outline: none; }
      .x-dayhead { display: grid; gap: 12px; padding-top: 6px; }
      .x-dayhead__eyebrow { font: var(--type-label); color: var(--text-secondary); }
      .x-dayhead h1 { font: var(--type-title); }
      .x-dayhead__row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
      .x-tabs { display: flex; gap: 2px; width: fit-content; max-width: 100%; overflow-x: auto; margin-top: 12px; padding: 4px; border-radius: var(--r-pill); background: var(--fill-tertiary); scrollbar-width: none; }
      .x-tabs button { flex: none; min-height: 36px; padding: 0 16px; border: 0; border-radius: var(--r-pill); background: none; color: var(--text-secondary); font: var(--type-label); cursor: pointer; }
      .x-tabs button:hover { color: var(--text-primary); }
      .x-tabs button[aria-selected="true"] { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-tab-panel { padding-top: 12px; min-width: 0; }
      .x-print-title { display: none; }

      .x-md { font-size: var(--size-prose); line-height: 1.55; min-width: 0; overflow-wrap: break-word; }
      .x-md > * { margin: 0 0 14px; max-width: 80ch; }
      .x-md > .x-scroll, .x-md > pre, .x-md > hr { max-width: none; }
      .x-md h2 { font: var(--type-title); margin: 8px 0 12px; }
      .x-md h3 { font: var(--type-heading); margin: 32px 0 10px; }
      .x-md h4, .x-md h5, .x-md h6 { font: var(--type-body-strong); font-size: var(--size-prose); margin: 24px 0 8px; }
      .x-md > :first-child { margin-top: 0; }
      .x-md ul, .x-md ol { padding-left: 22px; }
      .x-md li { margin: 4px 0; }
      .x-md li > ul, .x-md li > ol { margin: 4px 0; }
      .x-md li.x-task { list-style: none; margin-left: -22px; display: flex; gap: 10px; align-items: baseline; }
      .x-md li.x-task input { flex: none; width: 18px; height: 18px; accent-color: var(--fill-system-green); transform: translateY(3px); }
      .x-md a { color: var(--text-primary); text-decoration: underline; text-decoration-color: var(--stroke-primary); text-underline-offset: 3px; overflow-wrap: anywhere; }
      .x-md a:hover { text-decoration-color: currentColor; }
      .x-app code, .x-tree { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .x-app code { font-size: 0.88em; padding: 1px 5px; border-radius: 6px; background: var(--fill-tertiary); overflow-wrap: anywhere; }
      .x-md pre { padding: 14px 16px; border-radius: var(--r-s); background: var(--fill-tertiary); overflow-x: auto; font-size: var(--size-small); line-height: 1.5; }
      .x-md pre code { padding: 0; background: none; overflow-wrap: normal; }
      .x-md blockquote { padding: 2px 0 2px 16px; border-left: 2px solid var(--stroke-primary); color: var(--text-secondary); }
      .x-md blockquote > * { margin: 0 0 8px; }
      .x-md blockquote > :last-child { margin-bottom: 0; }
      .x-md hr { border: 0; border-top: 1px solid var(--stroke-secondary); margin: 28px 0; }
      .x-md details { padding: 10px 14px; border-radius: var(--r-s); background: var(--fill-tertiary); }
      .x-md details + details { margin-top: -6px; }
      .x-md summary { cursor: pointer; font-weight: var(--weight-medium); min-height: 24px; }
      .x-md details[open] summary { margin-bottom: 6px; }
      .x-scroll { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; -webkit-overflow-scrolling: touch; }
      .x-scroll table { line-height: 1.4; }
      .x-scroll td, .x-scroll th { min-width: 90px; }
      .x-scroll td:first-child, .x-scroll th:first-child { min-width: 60px; }

      .x-tree { margin: 0; padding: 16px 18px; border-radius: var(--r-m); background: var(--fill-tertiary); overflow-x: auto; font-size: var(--size-meta); line-height: 1.7; white-space: pre; }
      .x-tree .x-sealed { color: var(--fill-system-red); }
      .x-files { display: grid; gap: 14px; }

      .x-done { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-top: 40px; padding: 16px 18px; border: 1px solid var(--stroke-primary); border-radius: var(--r-m); }
      .x-done label { display: inline-flex; align-items: center; gap: 12px; min-height: var(--tap); font: var(--type-body-strong); cursor: pointer; }
      .x-done input { width: 20px; height: 20px; accent-color: var(--fill-system-green); }

      .x-dayrow { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 8px; align-items: baseline; color: var(--text-primary); text-decoration: none; min-height: var(--tap); }
      .x-dayrow:hover .x-dayrow__title { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--stroke-primary); }
      .x-dayrow small { grid-column: 2; font: var(--type-caption); color: var(--text-secondary); }
      .x-gate { margin: 4px 0 6px; }

      button.btn { cursor: pointer; }
      .x-kbd { font: var(--type-caption); color: var(--text-secondary); padding: 0 4px; }
      .x-kbd kbd { font-family: "Geist Mono", ui-monospace, monospace; font-size: var(--size-caption); padding: 0 5px; border-radius: 6px; border: 1px solid var(--stroke-primary); background: var(--fill-primary-on); }
      .x-tabs button[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); }

      /* at a glance */
      .x-glance { display: grid; gap: 14px; margin-top: 18px; padding: 18px 20px; border-radius: var(--r-l); background: var(--fill-tertiary); }
      .x-glance__badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .x-glance dl { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.3fr) minmax(0, 0.8fr); gap: 12px 24px; margin: 0; }
      .x-glance dt { font: var(--type-tag); color: var(--text-secondary); margin-bottom: 4px; }
      .x-glance dd { margin: 0; font: var(--type-body); }
      .x-glance dd.x-glance__key { font: var(--type-body-strong); }
      .x-glance dd small { display: block; margin-top: 2px; font: var(--type-caption); color: var(--text-secondary); }
      .x-glance .fineprint { margin: -4px 0 0; }

      /* session blocks */
      .x-sess { display: grid; gap: 10px; margin-bottom: 22px; }
      .x-sess__line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font: var(--type-label); }
      .x-sess__line span:last-child { color: var(--text-secondary); font-weight: var(--weight-regular); }
      .x-meter { display: block; height: 6px; border-radius: var(--r-pill); background: var(--fill-tertiary); overflow: hidden; }
      .x-meter > span { display: block; height: 100%; border-radius: inherit; background: var(--fill-system-green); transition: width var(--dur-quick) var(--ease-out); }
      .x-blocks .timeline__when { white-space: nowrap; }
      .x-blocks .timeline__what { display: grid; gap: 4px; font-size: var(--size-small); }
      .x-blocks .timeline__what p { margin: 0; }
      .x-blocks .x-files-line { color: var(--text-secondary); font-size: var(--size-caption); }
      .x-blocks > li > .x-blockbtn { justify-self: end; }
      .x-blocks > li.is-done .x-check strong { text-decoration: line-through; text-decoration-color: var(--text-tertiary); }
      .x-blocks > li.is-done .timeline__what > p { color: var(--text-secondary); }
      .x-check { display: inline-flex; align-items: center; gap: 10px; min-height: var(--tap); cursor: pointer; font: var(--type-body-strong); }
      .x-check input { flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--fill-system-green); cursor: pointer; }
      .x-check--plain { font: inherit; font-weight: inherit; min-height: 32px; }

      /* timer */
      .x-timer { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 6px; width: max-content; max-width: calc(100vw - 24px); padding: 5px 5px 5px 18px; border-radius: var(--r-pill); background: var(--fill-primary); color: var(--text-primary-on); box-shadow: var(--hark-shadow); }
      .x-timer[hidden] { display: none; }
      .x-timer :focus-visible { outline-color: var(--fill-primary-on); }
      .x-timer__label { min-width: 0; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--type-label); color: var(--text-secondary-on); }
      .x-timer__time { font: var(--weight-regular) var(--size-heading)/1 "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; padding: 0 6px; }
      .x-timer.is-up .x-timer__time { color: var(--fill-system-green); }
      .x-timer button { flex: none; height: var(--tap); min-width: var(--tap); padding: 0 14px; border: 0; border-radius: var(--r-pill); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-label); cursor: pointer; }
      .x-timer button.x-timer__x { background: none; color: var(--text-primary-on); padding: 0 12px; }
      body.has-timer .page { padding-bottom: 90px; }

      /* guide */
      .x-read { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; pointer-events: none; }
      .x-read[hidden] { display: none; }
      .x-read > span { display: block; height: 100%; width: 0; background: var(--fill-primary); }
      .x-guide { display: grid; grid-template-columns: minmax(0, 84ch) 230px; justify-content: space-between; gap: 32px; align-items: start; }
      .x-toc { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; font: var(--type-small); }
      .x-toc summary { font: var(--type-tag); color: var(--text-secondary); min-height: 32px; display: flex; align-items: center; cursor: pointer; list-style: none; }
      .x-toc summary::-webkit-details-marker { display: none; }
      .x-toc ol { list-style: none; margin: 0; padding: 0 0 0 0; border-left: 1px solid var(--stroke-secondary); }
      .x-toc button { display: block; width: 100%; min-height: 32px; padding: 6px 10px 6px 12px; margin-left: -1px; border: 0; border-left: 2px solid transparent; background: none; color: var(--text-secondary); font: var(--type-small); text-align: left; cursor: pointer; }
      .x-toc li.is-sub button { padding-left: 24px; font-size: var(--size-meta); }
      .x-toc button:hover { color: var(--text-primary); }
      .x-toc button.is-active { color: var(--text-primary); border-left-color: var(--fill-primary); font-weight: var(--weight-medium); }
      .x-md pre.x-clamp { max-height: 18em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
      .x-md .x-more { margin-top: -6px; }

      /* forms */
      .x-field { display: grid; gap: 6px; font: var(--type-label); }
      .x-input { width: 100%; min-height: var(--tap); padding: 10px 14px; border: 1px solid var(--stroke-primary); border-radius: var(--r-s); background: var(--fill-primary-on); color: var(--text-primary); font: var(--type-body); }
      textarea.x-input { min-height: 90px; resize: vertical; line-height: 1.45; }
      .x-input::placeholder { color: var(--text-secondary); }
      .x-input[readonly] { background: var(--fill-tertiary); font: var(--weight-regular) var(--size-meta)/1.5 "Geist Mono", ui-monospace, monospace; }
      .x-notes { display: grid; gap: 28px; max-width: 96ch; }
      .x-form { display: grid; gap: 14px; padding: 20px 22px; border: 1px solid var(--stroke-primary); border-radius: var(--r-m); }
      .x-form h3 { font: var(--type-heading); }
      .x-form__two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .x-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .x-row .x-input { flex: 1 1 220px; width: auto; }

      /* overview progress */
      .x-progress { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 24px; align-items: center; padding: 20px 22px; border-radius: var(--r-l); background: var(--fill-tertiary); }
      .x-ring { position: relative; width: 132px; height: 132px; }
      .x-ring svg { width: 100%; height: 100%; display: block; }
      .x-ring__track { stroke: var(--fill-primary-on); }
      .x-ring__fill { stroke: var(--fill-system-green); transition: stroke-dashoffset var(--dur-quick) var(--ease-out); }
      .x-ring__label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font: var(--type-caption); color: var(--text-secondary); }
      .x-ring__fig { font: var(--type-figure); color: var(--text-primary); }
      .x-weeks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
      .x-weeks li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font: var(--type-small); }
      .x-weeks .x-meter { grid-column: 1 / -1; background: var(--fill-primary-on); }
      .x-weeks b { font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
      .x-save { max-width: none; display: grid; gap: 12px; }
      .x-save h3 { margin: 0; }
      .x-save p { margin: 0; }

      /* deliverables, gates, library */
      .x-view-head { border-top: 0; padding-top: 8px; }
      .x-filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .x-filters .x-tabs { margin-top: 0; }
      .table-wrap tr[hidden] { display: none !important; }
      tr.x-rowlink { cursor: pointer; }
      tr.x-rowlink:hover > * { background: var(--hover-wash); }
      tr.x-rowlink a { color: var(--text-primary); text-decoration: none; }
      tr.x-rowlink a:hover { text-decoration: underline; text-underline-offset: 3px; }
      tr.x-rowlink.is-sent td.x-deliv { color: var(--text-secondary); }
      .x-gates { display: grid; gap: 20px; }
      .x-gatebox { padding: 20px 22px; border: 1px solid var(--stroke-primary); border-radius: var(--r-m); display: grid; gap: 12px; }
      .x-gatebox.is-next { border-color: var(--fill-primary); }
      .x-gatebox__head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
      .x-gatebox h3 { font: var(--type-heading); }
      .x-gatebox .checklist__item { font-weight: var(--weight-regular); }
      .x-gatebox .checklist > li { padding-block: 4px; }
      .x-libtools { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 8px; }
      .x-libtools select.x-input { padding-block: 0; }
      .x-lib { list-style: none; margin: 0; padding: 0; }
      .x-lib li { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--stroke-secondary); }
      .x-lib li:last-child { border-bottom: 0; }
      .x-lib__title { color: var(--text-primary); font: var(--type-body-strong); text-decoration: underline; text-decoration-color: var(--stroke-primary); text-underline-offset: 3px; overflow-wrap: anywhere; }
      .x-lib__title:hover { text-decoration-color: currentColor; }
      .x-lib__meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font: var(--type-caption); color: var(--text-secondary); }
      .x-lib__meta a { color: var(--text-primary); text-underline-offset: 2px; text-decoration-color: var(--stroke-primary); display: inline-block; padding: 2px 0; }
      .x-lib__url { font-family: "Geist Mono", ui-monospace, monospace; overflow-wrap: anywhere; }

      @media (max-width: 1100px) {
        .x-guide { grid-template-columns: minmax(0, 1fr); gap: 16px; }
        .x-toc { position: static; max-height: none; order: -1; padding: 6px 14px; border-radius: var(--r-s); background: var(--fill-tertiary); }
        .x-toc summary { min-height: var(--tap); font: var(--type-label); color: var(--text-primary); }
        .x-toc summary::after { content: "Show"; margin-left: auto; font: var(--type-tag); color: var(--text-secondary); }
        .x-toc[open] summary::after { content: "Hide"; }
        .x-toc ol { margin-bottom: 8px; }
        .x-toc button { min-height: var(--tap); }
      }
      /* grids that spread out when there is room */
      .x-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); column-gap: 40px; }
      .x-lib li:last-child { border-bottom: 1px solid var(--stroke-secondary); }
      .x-gates { grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); align-items: start; }
      @media (min-width: 1601px) {
        #weeks .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        #panel-resources .x-md, #panel-problems .x-md { columns: 2; column-gap: 56px; column-rule: 1px solid var(--stroke-secondary); }
        #panel-resources .x-md > :first-child, #panel-problems .x-md > :first-child { column-span: all; }
        #panel-resources .x-md > :is(h2, h3, h4), #panel-problems .x-md > :is(h2, h3, h4) { break-after: avoid; }
        #panel-resources .x-md li, #panel-problems .x-md > p, #panel-problems .x-md details { break-inside: avoid; }
        #panel-resources .x-md > .x-scroll, #panel-problems .x-md > .x-scroll, #panel-resources .x-md > pre, #panel-problems .x-md > pre { column-span: all; }
        .x-notes { max-width: 120ch; }
      }

      @media (max-width: 700px) {
        .x-glance dl, .x-form__two, .x-libtools { grid-template-columns: minmax(0, 1fr); }
        .x-progress { grid-template-columns: minmax(0, 1fr); justify-items: center; }
        .x-weeks { width: 100%; }
        .x-blocks > li > .x-blockbtn { justify-self: start; padding-left: 20px; }
        .x-timer { left: 12px; right: 12px; transform: none; width: auto; }
        .x-timer__label { flex: 1; max-width: none; }
        .x-glance, .x-form, .x-gatebox, .x-progress { padding: 16px; }
        .x-done { padding: 12px 14px; }
      }
      @media (max-width: 480px) {
        .x-timer { flex-wrap: wrap; justify-content: flex-end; padding: 10px; border-radius: var(--r-l); }
        .x-timer__label { flex: 1 1 100%; padding: 0 6px 4px; }
        .x-timer__time { flex: 1; }

    <script type="application/json" id="content">{"plan": "# 28-Day Quant Accelerator — v2 (active)\n\nSat 31 Oct – Fri 27 Nov 2026. Day = ≤4 h deep work + ~2 h light (reading/setup) + 30 min drill + 15 min review with mentor.\nUniverse: index ETFs / NIFTY index, daily (or hourly) bars. Every test goes in the trial log.\nNSE closed: Tue 10 Nov (Diwali-Balipratipada), Tue 24 Nov (Guru Nanak Jayanti). Muhurat session Sun 8 Nov.\nGates every Friday. Fail = fix over the weekend before moving on.\n\n## Week 1 — Foundations (Sat 31 Oct – Fri 6 Nov)\n| Day | Date | Deep work | Deliverable |\n|---|---|---|---|\n| 1 | Sat 31 Oct | Why retail loses (SEBI study), 3 sources of edge. Set up repo, training log, trial log | 1-page \"Why should anyone pay me?\" |\n| 2 | Sun 1 Nov | EV, variance, Bayes, small-sample traps | 10 solved problems + coin-flip sim |\n| 3 | Mon 2 Nov | Kelly sizing; simulate full vs half Kelly vs 2x Kelly to ruin | Kelly notebook with ruin chart |\n| 4 | Tue 3 Nov | Real NIFTY data: log returns, vol, correlation, fat tails | Stats notebook on 10+ yrs NIFTY |\n| 5 | Wed 4 Nov | Overfitting: 20 noise strategies, deflated Sharpe, minimum backtest length | Proof the best noise strategy is fake |\n| 6 | Thu 5 Nov | Microstructure: book, spread, adverse selection, slippage on your orderbook repo | Naive market maker that loses, and why |\n| 7 | Fri 6 Nov | NSE cost stack (brokerage, STT, exchange fee, GST, stamp duty, SEBI fee) | Cost calculator in code. **GATE 1** |\n\nGate 1: Kelly sim, noise proof, cost calculator within 20% of a broker contract note. Daily drill: mental math + 1 market-making game.\n\n## Week 2 — Ideas and paper tests (Sat 7 Nov – Fri 13 Nov)\n| Day | Date | Deep work | Deliverable |\n|---|---|---|---|\n| 8 | Sat 7 Nov | Edge families: trend, mean reversion, momentum, carry, events, pairs. Idea-card template | 3 idea cards |\n| 9 | Sun 8 Nov (Diwali) | Light day: read 2 papers (Chan ch.1–2, one SSRN paper) | 3 more idea cards |\n| 10 | Mon 9 Nov | Mentor kills cards; you defend | 4 more cards (10 total), ~3 survive |\n| 11 | Tue 10 Nov (market shut) | 8-point paper checklist on survivors | Checklist scored per idea |\n| 12 | Wed 11 Nov | Pick ONE + backup. Write hypothesis, falsifier, kill date, FIXED small parameter grid, t > 3 bar | Pre-registration doc (locked) |\n| 13 | Thu 12 Nov | Data pipeline: ETF/index daily data, adjustments, Parquet, timezone checks | Clean dataset |\n| 14 | Fri 13 Nov | Data audit: gaps, bad ticks, look-ahead traps | Audit report. **GATE 2** |\n\nGate 2: one idea passes all 8 checks; pre-registration locked; clean data.\n\n## Week 3 — Build it, try to kill it (Sat 14 Nov – Fri 20 Nov)\n| Day | Date | Deep work | Deliverable |\n|---|---|---|---|\n| 15 | Sat 14 Nov | Upgrade backtester: event loop, cost model, vol sizing, no look-ahead | Engine v2 with tests |\n| 16 | Sun 15 Nov | Mentor plants 3 bugs; find them | Bug report |\n| 17 | Mon 16 Nov | In-sample run on first 70%; last 30% locked | IS report + trial count |\n| 18 | Tue 17 Nov | Walk-forward; parameter stability heat map | Stability report |\n| 19 | Wed 18 Nov | Stress: 2x costs, 1-bar delay, drop best 10 trades; bootstrap | Stress report |\n| 20 | Thu 19 Nov | Factor check (market, size, value, momentum); open OOS ONCE; deflated Sharpe with your trial count | Full research report |\n| 21 | Fri 20 Nov | Rulebook: vol sizing, capped Kelly, daily/monthly loss limits, no-override, retirement rule | Signed rulebook. **GATE 3** |\n\nGate 3: survives OOS + stress, reproducible report, signed rulebook. If it dies, the backup runs D17–20 compressed over the weekend, or we go to W4 with the plumbing on a simple baseline and say so honestly.\n\n## Week 4 — Deploy and run (Sat 21 Nov – Fri 27 Nov)\n| Day | Date | Deep work | Deliverable |\n|---|---|---|---|\n| 22 | Sat 21 Nov | Kite Connect app (₹500 data plan), cloud VM with static IP, IP whitelist, 2FA login flow | Authenticated API on server |\n| 23 | Sun 22 Nov | Pipeline: data → signal → risk checks → paper-fill simulator → logs. Limit orders / market protection only | Pipeline passing dry run |\n| 24 | Mon 23 Nov | Kill switch, duplicate-order guard, reconciliation, phone alerts. Paper session 1 | Session 1 log |\n| 25 | Tue 24 Nov (market shut) | Review session 1; fix bugs; write monitoring dashboard | Fixes + dashboard |\n| 26 | Wed 25 Nov | Paper session 2; compare signals, fills, slippage with backtest | Live-vs-backtest diff |\n| 27 | Thu 26 Nov | Paper session 3; failure drills (kill switch, lost connection, rejected order) | Drill log |\n| 28 | Fri 27 Nov | Paper session 4; post-mortem on decisions; go/no-go memo | Memo. **GRADUATION** |\n\nGraduation: zero unexplained orders, live signals match backtest signals, slippage within assumption, failure drills pass, memo written (size, limits, kill rule).\n\n## After Day 28\nKeep paper running 3+ weeks, then the smallest real size you can afford to lose, capped by the rulebook. Paper P&L is NOT the evidence; plumbing and discipline are.\n", "days": [{"day": 1, "date": "Sat 31 Oct 2026", "focus": "\"Why do most traders lose, and why should anyone pay ME?\"", "week": 1, "start_here": "# DAY 1 — Sat 31 Oct 2026\n## \"Why do most traders lose, and why should anyone pay ME?\"\n\nToday's one question: **where does trading money come from?**\nIf you can't name who is on the other side of your trade and why they agree to lose to you, you have no edge. You have a hobby.\n\nGate for today: the one-page essay (05_templates/why-should-anyone-pay-me.md), written by you, defended to me.\n\n---\n\n## Your day (about 6 hours, deep work capped near 4)\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 30 min | Drill | (1) Zetamac arithmetic, 2 rounds of 2 min, log both scores: https://arithmetic.zetamac.com/  (2) Fermi: SEBI says individuals lost Rs 1,05,603 crore in F&O in FY25. Roughly how much is that per trading day? Per loss-maker? Do it in your head first, then check. | — |\n| 30 min | Setup | Run the setup script, create your research repo, copy in the logs | 06_setup/setup_repo.sh, 05_templates/ |\n| 90 min | Deep 1: Who loses | Read in this order (see reading guide below) | 01_why_retail_loses/ |\n| 90 min | Deep 2: Where edge comes from | Read in this order | 02_sources_of_edge/ |\n| 45 min | Deep 3: Build-along | Run who_pays_whom.py, PREDICT before each change, answer the 4 questions | 04_build_along/ |\n| 45 min | Deep 4: Essay | Write the one page. No copying phrases from papers. | 05_templates/why-should-anyone-pay-me.md |\n| 60–90 min | Light | Videos + optional reading (evening, relaxed) | RESOURCES.md, 03_optional_deeper/ |\n| 15 min | Review | Fill training log; send me the essay | training-log.md |\n\n---\n\n## Reading guide (read with a question in your head, not cover to cover)\n\n### Deep 1 — Who loses, and how? (folder 01)\n1. **SEBI_2024_FnO_FY22-FY24_press_release.pdf** (3 pages, 10 min). 93% of individual F&O traders lost money over FY22–FY24. *Question: what share of losses was transaction costs?*\n2. **SEBI_2024_Intraday_Cash_Study.pdf**, read only \"Summary Findings\" (pages 9–11, 20 min). 71% of intraday cash traders lost in FY23; 80% of those with 500+ trades a year. *Question: why do frequent traders lose more?*\n3. **SEBI_2025_Derivatives_vs_Cash_FY25_losses.pdf**, section C only (5 min). FY25: about 91% lost; net losses Rs 1,05,603 crore.\n4. **Barber_Lee_Liu_Odean_2009_Just_How_Much_Lose.pdf** (30 min). Abstract, intro, and the aggressive vs passive orders section. Every trade in Taiwan, 5 years. *Key line: virtually all individual losses come from aggressive orders. Institutions win on both. Why?*\n5. **Chague_et_al_2019_Day_Trading_for_a_Living.pdf** (16 pages, 20 min). 97% of Brazilian day traders who kept going 300+ days lost money. No evidence of learning. *Question: if they don't learn, why do they keep going?*\n6. Skim abstract + conclusion only: **Barber_Odean_2000_Trading_Is_Hazardous.pdf** (most active traders earned 11.4% vs 17.9% market), **Barber_et_al_Do_Day_Traders_Rationally_Learn.pdf**.\n\n### Deep 2 — Where can edge come from? (folder 02)\n1. **Harris_2015_Trading_and_Electronic_Markets_CFA_RF.pdf**, chapters 1–3 only (pages ~1–25, 50 min). Free CFA monograph by Larry Harris, ex-SEC chief economist. The best plain-English map of who trades, why, and who wins. *Write down his taxonomy of traders from memory afterwards.*\n2. **Hasbrouck_slides_Private_Information_Treynor_model.pdf** (15 min). The Treynor/Bagehot model in slides: informed traders, liquidity traders, and the dealer in between. This is what your build-along simulates.\n3. **AQR_Asness_How_Can_a_Strategy_Still_Work.pdf** (15 min). Cliff Asness on why a known strategy can keep working: it's either a risk you're paid to hold, or a mistake others keep making.\n4. **AQR_Understanding_Style_Premia.pdf** (10 min skim). Value, momentum, carry, defensive: each with its risk story and its behavioural story.\n5. Evening/optional: **Lo_2004_Adaptive_Markets_Hypothesis.pdf** (sections 1 and 5), **Grossman_Stiglitz_1980** (intro + conclusion only; it proves prices can't be perfectly efficient, or nobody would pay to research), **NBER_Noise_Traders_review.pdf**, **Lo_2007_EMH_Palgrave.pdf**.\n\n### The 3 sources of edge (what you're building toward today)\n1. **Risk premium**: you're paid to hold a risk others won't (equity risk, crash risk, illiquidity).\n2. **Behavioural**: you profit from predictable mistakes (overreaction, underreaction, overconfidence, the disposition effect).\n3. **Structural / informational / service**: you provide liquidity, process information better or faster, or take trades others are forced into or barred from.\n\nYour job today: for each, one real example, and *why it hasn't been competed away*.\n\n---\n\n## The mentor's 3 rules for Day 1\n1. **Predict before you run.** Write your guess in the log, then run the code. Grade the guess, not the output.\n2. **Log every idea as a trial** from today (05_templates/trial-log.csv). We count how many things you try, because Bailey et al. (2014) show that trying enough variants makes noise look like skill. That paper is in 03_optional_deeper for Day 5.\n3. **No trading today.** Not even \"just a small one\".\n\nSend me the essay when it's done. I'll grade the reasoning, not the writing.\n", "resources": "# Day 1 resources: every link, sorted by type\nAll free. ✅ = PDF already in this ZIP. Links checked on 31 Oct 2026.\n\n## 1. Regulator studies (India) — the hard numbers\n- ✅ SEBI (Sep 2024) – Profits & losses in equity derivatives FY22–FY24 (93% of individuals lost): https://www.sebi.gov.in/reports-and-statistics/research/sep-2024/study-analysis-of-profits-and-losses-in-the-equity-derivatives-segment-fy22-fy24-_86905.html\n- ✅ SEBI (Jul 2024) – Intraday trading by individuals in equity cash (71% lost; 80% with 500+ trades): https://www.sebi.gov.in/reports-and-statistics/research/jul-2024/study-analysis-of-intraday-trading-by-individuals-in-equity-cash-segment_84946.html\n- ✅ SEBI (Jul 2025) – Derivatives vs cash after new measures (FY25: ~91% lost, Rs 1,05,603 cr net loss): https://www.sebi.gov.in/sebi_data/attachdocs/jul-2025/1751900271726.pdf\n- ✅ SEBI (Jan 2023) – First F&O study, FY22 (89% lost): https://www.sebi.gov.in/reports-and-statistics/research/jan-2023/study-analysis-of-profit-and-loss-of-individual-traders-dealing-in-equity-fando-segment_67525.html\n- All SEBI research: https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=4&smid=109&ssid=81\n\n## 2. Research papers — why retail loses\n- ✅ Barber & Odean (2000), \"Trading Is Hazardous to Your Wealth\", Journal of Finance\n- ✅ Barber, Lee, Liu & Odean (2009), \"Just How Much Do Individual Investors Lose by Trading?\", Review of Financial Studies\n- ✅ Barber, Lee, Liu & Odean (2004), \"Do Individual Day Traders Make Money? Evidence from Taiwan\"\n- ✅ Barber, Lee, Liu, Odean & Zhang, \"Do Day Traders Rationally Learn About Their Ability?\" (published as \"Learning, Fast or Slow\", 2020)\n- ✅ Chague, De-Losso & Giovannetti (2019), \"Day Trading for a Living?\" (Brazil, 97% lost)\n- Odean's full paper list (free PDFs of most): https://faculty.haas.berkeley.edu/odean/index.html\n\n## 3. Research papers — where edge comes from\n- ✅ Larry Harris (2015), *Trading and Electronic Markets: What Investment Professionals Need to Know*, CFA Institute Research Foundation (free book) + 7-page summary\n- ✅ Hasbrouck (NYU Stern), lecture slides \"Efficiency and private information\" (Treynor model)\n- ✅ Grossman & Stiglitz (1980), \"On the Impossibility of Informationally Efficient Markets\", AER\n- ✅ Lo (2004), \"The Adaptive Markets Hypothesis\", Journal of Portfolio Management\n- ✅ Lo (2007), \"Efficient Markets Hypothesis\", New Palgrave\n- ✅ NBER review, \"Noise Traders\"\n- ✅ AQR, \"Understanding Style Premia\"\n- ✅ AQR / Asness, \"How Can a Strategy Still Work If Everyone Knows About It?\"\n- Treynor (Bagehot) (1971), \"The Only Game in Town\", Financial Analysts Journal (paywalled; the Hasbrouck slides and Harris book cover it): https://rpc.cfainstitute.org/research/financial-analysts-journal/1995/the-only-game-in-town\n\n## 4. Optional deeper (in 03_optional_deeper)\n- ✅ Hasbrouck, *Securities Trading: Principles and Procedures* (free draft textbook). Ch. 13 \"Private Information\" pairs with today.\n- ✅ Bailey, Borwein, López de Prado & Zhu (2014), \"Pseudo-Mathematics and Financial Charlatanism\" (backtest overfitting; this is why you keep a trial log from today; full reading on Day 5)\n- ✅ MIT 18.S096 Lecture 1 notes, \"Introduction, Financial Terms and Concepts\"\n\n## 5. YouTube (evening, light block)\n1. Jim Simons, full interview, Numberphile (about 1 h). How Renaissance thinks: small edges, many bets, costs matter. https://www.youtube.com/watch?v=QNznD9hMEh0\n2. Robert Carver: Robustness, Risk and Systematic Trading, In The Money by Zerodha Podcast 04. A systematic trader on an Indian broker's channel. https://www.youtube.com/watch?v=p0znNV4oWe8\n3. Patrick Boyle, The Story of James Simons, Renaissance & Medallion. https://www.youtube.com/watch?v=xkbdZb0UPac\n4. MIT 18.S096, Lecture 1: Introduction, Financial Terms and Concepts (skim the first 30 min). https://www.youtube.com/watch?v=wvXDB9dMdEo\n5. Roman Paolucci, Why Most Traders Lose: Ergodicity for Quant Trading (preview of Day 3 Kelly). https://www.youtube.com/watch?v=dryV1qJYUw8\n6. Trading and Exchanges by Larry Harris, a book summary (a channel summary of the book, not Harris himself; fine as an overview). https://www.youtube.com/watch?v=FTeMtc1GTTg\n\n## 6. Blogs and articles (free, no paywall)\n- Rob Carver, \"This Blog is Systematic\", start-here page: https://qoppac.blogspot.com/p/systematic-trading-start-here.html\n- Rob Carver, \"Using random data\" (why every backtest is partly luck): https://qoppac.blogspot.com/2015/11/using-random-data.html\n- Mechanical Markets (Kipp Rogers), market microstructure, written by a practitioner: https://mechanicalmarkets.wordpress.com/\n- Quantpedia, an encyclopedia of documented anomalies (use it later, in Week 2): https://quantpedia.com/\n\n## 7. Free courses (pace yourself; these support the whole 28 days)\n- MIT OCW 18.S096, Topics in Mathematics with Applications in Finance (videos, notes, problem sets): https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/\n- Zerodha Varsity, free modules on Indian markets (Module 1 for market basics, later the Markets & Taxation module for costs): https://zerodha.com/varsity/\n- Coursera, Financial Markets (Robert Shiller, Yale), free to audit: https://www.coursera.org/learn/financial-markets-global\n- Software Carpentry, Git for beginners (if git is rusty): https://swcarpentry.github.io/git-novice/\n\n## 8. GitHub repos\n- quantopian/research_public: the Quantopian lecture notebooks (statistics, hypothesis testing, factors). Gold for Weeks 1–3. https://github.com/quantopian/research_public\n- wilsonfreitas/awesome-quant: curated list of quant libraries and data sources. https://github.com/wilsonfreitas/awesome-quant\n- pst-group/pysystemtrade: Rob Carver's open-source systematic trading engine. Read its structure in Week 3. https://github.com/pst-group/pysystemtrade\n- stefan-jansen/machine-learning-for-trading: big, later; bookmark only. https://github.com/stefan-jansen/machine-learning-for-trading\n\n## 9. Tools\n- uv (Python env manager used by setup script): https://docs.astral.sh/uv/getting-started/installation/\n- Zetamac arithmetic drill: https://arithmetic.zetamac.com/\n\n## 10. Books worth buying later (not needed for 28 days)\n- Larry Harris, *Trading and Exchanges* (2003): the full version of today's free monograph.\n- Robert Carver, *Systematic Trading* (2015): risk, sizing, and not fooling yourself.\n- Ernest Chan, *Quantitative Trading* (2nd ed., 2021): practical retail quant setup.\n- Lasse Pedersen, *Efficiently Inefficient* (2015): how each hedge-fund style makes money and why.\n", "problems": "", "files": ["00_START_HERE.md", "01_why_retail_loses/Barber_Lee_Liu_Odean_2009_Just_How_Much_Lose.pdf", "01_why_retail_loses/Barber_Odean_2000_Trading_Is_Hazardous.pdf", "01_why_retail_loses/Barber_et_al_Do_Day_Traders_Rationally_Learn.pdf", "01_why_retail_loses/Barber_et_al_Do_Individual_Day_Traders_Make_Money_Taiwan.pdf", "01_why_retail_loses/Chague_et_al_2019_Day_Trading_for_a_Living.pdf", "01_why_retail_loses/SEBI_2023_FnO_FY22_Study.pdf", "01_why_retail_loses/SEBI_2024_FnO_FY22-FY24_Full_Study.pdf", "01_why_retail_loses/SEBI_2024_FnO_FY22-FY24_press_release.pdf", "01_why_retail_loses/SEBI_2024_Intraday_Cash_Study.pdf", "01_why_retail_loses/SEBI_2025_Derivatives_vs_Cash_FY25_losses.pdf", "02_sources_of_edge/AQR_Asness_How_Can_a_Strategy_Still_Work.pdf", "02_sources_of_edge/AQR_Understanding_Style_Premia.pdf", "02_sources_of_edge/Grossman_Stiglitz_1980_Impossibility_Efficient_Markets.pdf", "02_sources_of_edge/Harris_2015_Trading_and_Electronic_Markets_CFA_RF.pdf", "02_sources_of_edge/Harris_2015_Trading_and_Electronic_Markets_SUMMARY.pdf", "02_sources_of_edge/Hasbrouck_slides_Private_Information_Treynor_model.pdf", "02_sources_of_edge/Lo_2004_Adaptive_Markets_Hypothesis.pdf", "02_sources_of_edge/Lo_2007_Efficient_Markets_Hypothesis_Palgrave.pdf", "02_sources_of_edge/NBER_Noise_Traders_review.pdf", "03_optional_deeper/Bailey_et_al_2014_Pseudo-Mathematics_Backtest_Overfitting.pdf", "03_optional_deeper/Hasbrouck_Securities_Trading_Principles_Procedures_draft.pdf", "03_optional_deeper/MIT_18S096_Lecture1_notes.pdf", "04_build_along/README.md", "04_build_along/who_pays_whom.png", "04_build_along/who_pays_whom.py", "05_templates/training-log.md", "05_templates/why-should-anyone-pay-me.md", "06_setup/setup_repo.sh", "RESOURCES.md"]}, {"day": 2, "date": "Sun 01 Nov 2026", "focus": "Expected value, variance, Bayes, and how small samples lie", "week": 1, "start_here": "# DAY 2: Sun 1 Nov 2026\n## Expected value, variance, Bayes, and how small samples lie\n\nYesterday you learned **who** pays whom. Today you learn the arithmetic of **whether** you're being paid, and how to avoid fooling yourself about it.\n\nThree ideas, and every one comes back later:\n1. **EV tells you the direction. Variance tells you whether you survive the trip.** (Day 3: Kelly)\n2. **Bayes: evidence moves a belief in proportion to the base rate.** A great record from a big crowd is weak evidence. (Day 5: overfitting, Week 2: idea selection)\n3. **Small samples are not miniature populations.** They are noisy, and sometimes biased. (Every backtest you'll ever run)\n\n**Today's deliverable:** 10 problems solved (folder 05) + the coin-flip lab run with predictions written first (folder 04).\n\n---\n\n## Your day (about 6 h; deep work about 4 h)\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 30 min | Drill | Zetamac 2 rounds of 2 min (log scores, compare to yesterday) + `make_a_market.py`, 5 rounds (log P&L) | 04_build_along/make_a_market.py |\n| 75 min | Deep 1: Core tools | Jane Street *Probability & Markets* guide (all 13 pages). Then MIT 18.05 reading pp. 18–28 (Bayes) and pp. 29–60 (EV and variance; skim proofs, do the examples). Keep the Stat 110 cheatsheet open. | 01_core_probability/ |\n| 60 min | Deep 2: Traps | Tversky & Kahneman 1971 (6 pp.) → Ioannidis 2005 (6 pp.) → Gigerenzer pp. 1–5 (natural frequencies) → Miller & Sanjurjo intro pp. 1–5 → Lo 2002, intro + Table 1 | 02_, 03_ |\n| 60 min | Deep 3: Lab | Fill `prediction-sheet.md` part by part, THEN run `coin_flip_lab.py`. Answer the 4 questions at the bottom. | 04_build_along/, 06_templates/ |\n| 60 min | Deep 4: Problems | The 10 problems: gut guess → worked answer → trading meaning. Open the solutions only at the end. | 05_problems/ |\n| 45–60 min | Light | 3Blue1Brown on Bayes + the medical test paradox, Veritasium's *Bayesian Trap*. Optional: Stat 110 Lecture 4. | RESOURCES.md |\n| 15 min | Review | Training log row (06_templates), trial log (still empty, good) | |\n\n---\n\n## What to pull from each reading (write one line per item in your notes)\n\n**Jane Street guide:** expected value as a fair price; why market makers think in EV per trade; the adverse-selection question (\"given they want to trade with me, what do they know?\"). This links Day 1 to today.\n\n**MIT 18.05 Class 3 (Bayes):** the tree and the table method. Learn the **table**: hypothesis | prior | likelihood | prior × likelihood | posterior. You'll use it for every strategy decision.\n\n**MIT 18.05 Classes 4–5:** E[X+Y] = E[X] + E[Y] *always*; Var(X+Y) = Var X + Var Y *only if independent*. The second fact is the whole of diversification.\n\n**Tversky & Kahneman 1971:** trained scientists expect small samples to look like the population. You will too. Count how often today.\n\n**Ioannidis 2005:** when true effects are rare and many are tested, most \"significant\" findings are false. Replace \"research finding\" with \"backtest\" and reread the corollaries.\n\n**Gigerenzer:** convert probabilities to counts (\"out of 1,000 days...\") and Bayes becomes easy. Do problem 3 this way.\n\n**Miller & Sanjurjo 2018:** in short sequences, measuring \"what happens after a streak\" is biased even for a fair coin. Any backtest rule like \"buy after 3 down days\" is exposed to this.\n\n**Lo 2002:** a Sharpe ratio is an estimate with a standard error. Table 1 tells you how wide the error is for a given sample length.\n\n---\n\n## Mentor's rules for Day 2\n1. **Gut first, math second, always.** Log the gap. Shrinking that gap over 28 days is the real training.\n2. **Say the base rate out loud** before judging any signal, record, or backtest.\n3. **\"Positive EV\" isn't a plan.** Ask \"what's the variance, and can I survive the bad path?\" That's tomorrow's Kelly lesson.\n\nSend me: your 10 answers (with gut guesses), your prediction sheet, and your answers to the lab's 4 questions.\n", "resources": "# Day 2 resources: every link, sorted by type\nAll free. ✅ = PDF already in this ZIP. Links checked on 31 Oct 2026.\n\n## 1. Core probability (folder 01)\n- ✅ Jane Street, *Probability & Markets* guide (13 pp.): the trading-firm view of EV and market making. https://www.janestreet.com/probability-markets/\n- ✅ MIT 18.05 (Orloff & Bloom), all probability readings in one PDF. Course home, with slides, problem sets and solutions: https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2022/\n- ✅ Stat 110 Probability Cheatsheet (Chen & Blitzstein, 10 pp.). Print it. https://github.com/wzchen/probability_cheatsheet\n- ✅ Grinstead & Snell, *Introduction to Probability* (free, GNU licence). Reference: Ch. 4 Conditional Probability, Ch. 6 Expected Value & Variance, Ch. 8 Law of Large Numbers.\n- Blitzstein & Hwang, *Introduction to Probability* (2nd ed.), free online from the authors (Google Drive link, couldn't be bundled): https://probabilitybook.net/\n- Stat 110 Strategic Practice problems with full solutions (do #2 conditional probability and #4 expectation): https://stat110.hsites.harvard.edu/strategic-practice-problems\n\n## 2. Bayes and base rates (folder 02)\n- ✅ Ioannidis (2005), \"Why Most Published Research Findings Are False\", PLoS Medicine\n- ✅ Gigerenzer, Gaissmaier, Kurz-Milcke, Schwartz & Woloshin (2007), \"Helping Doctors and Patients Make Sense of Health Statistics\" (natural frequencies)\n\n## 3. Small-sample traps (folder 03)\n- ✅ Tversky & Kahneman (1971), \"Belief in the Law of Small Numbers\", Psychological Bulletin\n- ✅ Tversky & Kahneman (1974), \"Judgment under Uncertainty: Heuristics and Biases\", Science\n- ✅ Miller & Sanjurjo (2018), \"Surprised by the Hot Hand Fallacy? A Truth in the Law of Small Numbers\", Econometrica (arXiv version)\n- ✅ Lo (2002), \"The Statistics of Sharpe Ratios\", Financial Analysts Journal\n\n## 4. YouTube\n1. 3Blue1Brown, *Bayes theorem, the geometry of changing beliefs* (15 min). https://www.youtube.com/watch?v=HZGCoVF3YvM\n2. 3Blue1Brown, *The medical test paradox, and redesigning Bayes' rule* (22 min). Base rates done right. https://www.youtube.com/watch?v=lG4VkPoG3ko\n3. Veritasium, *The Bayesian Trap* (10 min). https://www.youtube.com/watch?v=R13BD8qKeTg\n4. 3Blue1Brown, *Binomial distributions | Probabilities of probabilities* (how to judge a win rate from a small sample). https://www.youtube.com/watch?v=8idr1WZ1A7Q\n5. Harvard Stat 110, Lecture 4: Conditional Probability (Blitzstein, about 50 min). https://www.youtube.com/watch?v=P7NE4WF8j-Q\n6. Harvard Stat 110, full playlist (Lectures 1–13 cover everything this week). https://www.youtube.com/playlist?list=PL2SOU6wwxB0uwwH80KTQ6ht66KWxbzTIo\n\n## 5. Free courses\n- MIT 18.05, Introduction to Probability and Statistics: readings, slides, problem sets with solutions, plus interactive checkers on MIT Open Learning Library. https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2022/\n- Harvard Stat 110 (lectures, practice, handouts): https://stat110.hsites.harvard.edu/\n- Stat110x on edX (free to audit): https://www.edx.org/course/introduction-to-probability-0\n\n## 6. Practice (daily, 10–15 min)\n- Zetamac arithmetic: https://arithmetic.zetamac.com/\n- Brainstellar, free probability puzzles used in quant interviews: https://brainstellar.com/puzzles\n- Priors, probability puzzles with a \"guess first, then simulate\" format (matches today's method): http://priorslab.com/\n\n## 7. GitHub\n- wzchen/probability_cheatsheet: LaTeX source of the cheatsheet. https://github.com/wzchen/probability_cheatsheet\n- sinclam2/intro-to-probability-solutions: worked solutions to Grinstead & Snell exercises. https://github.com/sinclam2/intro-to-probability-solutions\n- Your own repo **probability-and-markets**: add today's lab and problems to it as a commit.\n\n## 8. In this ZIP, built for you (folder 04)\n- `coin_flip_lab.py`: 4 tested experiments (same EV with different variance, the streak trap, luck vs skill, Sharpe noise). Reference chart included.\n- `make_a_market.py`: a 5-round market-making drill for your daily warm-up.\n\n## 9. Books for later (not needed today)\n- Xinfeng Zhou, *A Practical Guide to Quantitative Finance Interviews*: the \"green book\" of probability problems.\n- Frederick Mosteller, *Fifty Challenging Problems in Probability* (Dover).\n- Nassim Taleb, *Fooled by Randomness*: the small-sample trap, as a story.\n", "problems": "# Day 2: 10 problems (your deliverable)\nRules: pen and paper first. For each one write (a) your 10-second gut guess, (b) your worked answer, (c) one line on what it means for trading.\nThen check with code if you like. Open SOLUTIONS only after all 10 are done. Grade: how far off was your gut?\n\n1. **Reroll game.** Roll a fair die; you're paid its face value in rupees. After the first roll you may reroll once, and then you must take the second roll. What's the fair price of this game, and what's your rule for rerolling?\n\n2. **A small edge, 100 times.** Each trade wins Rs 200 with probability 0.55 or loses Rs 200 with probability 0.45. You make 100 independent trades. Find the expected total, the standard deviation of the total, and the probability you finish with a loss. Use both a normal approximation and the exact binomial.\n\n3. **Signal or noise (Bayes).** 10% of days are \"big up\" days. Your indicator fires on 80% of big-up days and on 20% of all other days. It fires today. What's the probability today is a big-up day?\n\n4. **Is my backtest real? (Ioannidis-style)** Say 1 in 20 strategy ideas you test has a real edge. A real edge passes your backtest 50% of the time; a fake one passes 5% of the time (p < 0.05). A strategy passes. What's the probability it's real? What happens if 1 in 100 ideas is real?\n\n5. **Martingale.** Bet Rs 100 on red in European roulette (P(win) = 18/37). After a loss, double the bet. You stop after a win, or after 6 straight losses (Rs 6,300 lost). What's the EV of one cycle? What's the probability of the 6-loss disaster? Why does the strategy *feel* safe?\n\n6. **The star fund manager.** 1,000 managers have zero skill, and each beats the market in a given year with probability 0.5. How many do you expect to beat it in at least 7 of 10 years?\n\n7. **Waiting for patterns.** On average, how many fair-coin flips until you see HH? How many until you see HT? Why are they different when both have probability 1/4 on any given pair?\n\n8. **Mean vs median (preview of Day 3).** A stock starts at Rs 100. Each day it goes up 1% or down 1% with equal probability. After 250 days, what's its expected price? What's its median price? (Assume 125 ups and 125 downs for the median.) Why do they differ?\n\n9. **Linearity and diversification.** You hold 10 stocks. Each goes up tomorrow with probability 0.6. (a) Expected number going up? (b) Variance of that number if they're independent? (c) Variance if they're perfectly correlated (all up or all down together)? What does this say about \"diversified\" portfolios of correlated stocks?\n\n10. **Make the trade?** Someone offers to sell you the maximum of two fair dice rolls, paid in rupees, for Rs 4.25. Do you buy? What's your edge per trade? At what price would you sell it?\n", "files": ["00_START_HERE.md", "01_core_probability/Grinstead_Snell_Introduction_to_Probability_FREE.pdf", "01_core_probability/JaneStreet_Probability_and_Markets_Guide.pdf", "01_core_probability/MIT_18.05_All_Probability_Reading_Orloff.pdf", "01_core_probability/Stat110_Probability_Cheatsheet_Chen_Blitzstein.pdf", "02_bayes_and_base_rates/Gigerenzer_et_al_2007_Natural_Frequencies_Health_Statistics.pdf", "02_bayes_and_base_rates/Ioannidis_2005_Why_Most_Published_Research_Findings_Are_False.pdf", "03_small_sample_traps/Lo_2002_Statistics_of_Sharpe_Ratios.pdf", "03_small_sample_traps/Miller_Sanjurjo_2018_Hot_Hand_Small_Numbers.pdf", "03_small_sample_traps/Tversky_Kahneman_1971_Belief_in_Law_of_Small_Numbers.pdf", "03_small_sample_traps/Tversky_Kahneman_1974_Judgment_Under_Uncertainty.pdf", "04_build_along/coin_flip_lab.png", "04_build_along/coin_flip_lab.py", "04_build_along/make_a_market.py", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "06_templates/prediction-sheet.md", "06_templates/training-log-day2-row.md", "RESOURCES.md"]}, {"day": 3, "date": "Mon 02 Nov 2026", "focus": "Kelly sizing: how much to bet, and why too much ruins a winner", "week": 1, "start_here": "# DAY 3: Mon 2 Nov 2026\n## Kelly sizing: how much to bet, and why too much ruins a winner\n\nDay 1: who pays whom. Day 2: whether you're actually being paid, and how small samples lie.\nToday: **given an edge, how big a bet?** This is where most people with a real edge still go broke.\n\nThree ideas to own by tonight:\n1. **Positive EV isn't enough.** You live one path through time, not the average of a crowd. Maximise *growth* (log wealth), not EV.\n2. **Over-betting is far worse than under-betting.** Half Kelly keeps 75% of the growth; 2x Kelly has zero growth and certain deep drawdowns.\n3. **You never know your edge.** Size for the pessimistic end of your estimate. In practice that means half Kelly or less, and a hard leverage cap.\n\n**Deliverable (from the plan):** Kelly notebook with a ruin chart: run `kelly_lab` (folder 04) with predictions written first. Plus the 10 problems and your first draft sizing rule.\n\n---\n\n## Your day (about 6 h; deep work about 4 h)\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 30 min | Drill | Zetamac 2×2 min + `make_a_market.py` from Day 2, 5 rounds. Log both. | |\n| 45 min | Deep 1: The experiment | Haghani & Dewey (8 pp.). Before reading past page 2, write down how YOU would have bet. Then read how 61 finance-trained people did. | 02_kelly_in_practice/ |\n| 75 min | Deep 2: The source | Thorp 2006: sections 1–4 (coin tossing, Kelly formulas, the long run) and section 7 up to eq. 7.11 (Kelly for stocks, chance of a drawdown). Skip blackjack and sports. Then MacLean, Thorp & Ziemba: just the lists of Good and Bad properties. | 01_, 02_ |\n| 60 min | Deep 3: Lab | Fill `prediction-sheet.md`, then run `kelly_lab.py` (or the `.ipynb`). Answer its 4 questions. **This is the Day 3 deliverable.** | 04_build_along/ |\n| 60 min | Deep 4: Problems + rule | 10 problems. Then fill `sizing-rule-draft.md`: your first written risk rule. | 05_, 06_ |\n| 45–60 min | Light | Videos: *The Kelly Criterion* (Mutual Information), Ole Peters on multiplicative dynamics, Thorp interview. Optional: Kelly's own 1956 paper, pp. 917–920, just to see where it came from. | RESOURCES.md |\n| 15 min | Review | Training log row, trial log (still empty) | |\n\n---\n\n## What to pull from each reading\n\n**Haghani & Dewey (2016):** about 30% of quant-trained people went bust on a coin rigged 60/40 in their favour, and only 21% hit the cap. Note every bias they list. Which one would have got you?\n\n**Thorp (2006), §2–4:** the Kelly fraction for coin tossing, why Kelly maximises long-run growth, and that over a short run Kelly can still lose to other strategies. §7: Kelly for stocks (f* = μ/σ²) and the formula for the chance of ever falling to x% of your wealth. Problem 8 uses it.\n\n**MacLean, Thorp & Ziemba (2010):** the honest list. *Good:* fastest long-run growth, never bets you to zero. *Bad:* very volatile in the short run, and it can take a very long time to dominate. Fractional Kelly trades growth for safety.\n\n**Peters & Gell-Mann (2016), optional:** why the expected value can rise while almost everyone loses. That's the +50%/−40% coin in problem 4. Read the introduction and the first example.\n\n**Busseti, Ryu & Boyd (2016), optional/advanced:** Kelly with a hard limit on drawdown probability, solved as a convex optimisation, with code. Bookmark it for Week 3 when you size a real strategy.\n\n---\n\n## Mentor's rules for Day 3\n1. **Size from the bottom of your edge estimate, never the middle.**\n2. **Hard cap: 1.0x, no borrowing, for the whole 28 days.** Kelly may say more. Kelly doesn't know your μ is a guess.\n3. **Write the sizing rule BEFORE you see a backtest.** A rule written after the backtest is just the backtest talking.\n\nSend me: your lab predictions vs results, the 4 lab answers, the 10 problems (with gut guesses), and your sizing-rule draft.\n", "resources": "# Day 3 resources: Kelly, fractional Kelly, ergodicity, ruin\nAll free. ✅ = PDF already in this ZIP. Links checked 31 Oct 2026.\n\n## 1. The originals (folder 01)\n- ✅ Kelly (1956), \"A New Interpretation of Information Rate\", Bell System Technical Journal: where it started (as information theory, not finance).\n- ✅ Thorp (2006), \"The Kelly Criterion in Blackjack, Sports Betting, and the Stock Market\", Handbook of Asset and Liability Management. **The core reading for today.**\n- Breiman (1961), \"Optimal Gambling Systems for Favorable Games\": the proof that Kelly maximises long-run growth. Reference list (no reliable free PDF I could verify): http://stat.wharton.upenn.edu/~steele/Resources/FTSResources/KellyBreiman.htm\n\n## 2. Kelly in practice (folder 02)\n- ✅ Haghani & Dewey (2016), \"Rational Decision-Making Under Uncertainty: Observed Betting Patterns on a Biased Coin\". Elm Wealth's own write-up: https://elmwealth.com/lessons-from-betting-on-a-biased-coin-cool-heads-and-cautionary-tales\n- ✅ MacLean, Thorp & Ziemba (2010), \"Good and Bad Properties of the Kelly Criterion\"\n- ✅ Busseti, Ryu & Boyd (2016), \"Risk-Constrained Kelly Gambling\" (Stanford). Code: https://github.com/cvxgrp/kelly_code\n\n## 3. Ergodicity and ruin (folder 03)\n- ✅ Peters & Gell-Mann (2016), \"Evaluating Gambles Using Dynamics\", Chaos (arXiv version)\n- Peters (2019), \"The Ergodicity Problem in Economics\", Nature Physics: https://www.nature.com/articles/s41567-019-0732-0\n- Ergodicity Economics site (lecture notes, interactive coin-toss apps): https://ergodicityeconomics.com/\n\n## 4. YouTube\n1. Mutual Information, *The Kelly Criterion*: the biased-coin game, growth rates, and why Kelly is dangerous. Best single explainer. https://www.youtube.com/watch?v=-9JM9suCIHs\n2. Ole Peters, *Random multiplicative dynamics* (Ergodicity TV): why the average and the typical path split apart. https://www.youtube.com/watch?v=CCLtQHL-VUs\n3. *Gambling With an Edge*, guest Ed Thorp: the man who first used Kelly for real money, in his own words. https://www.youtube.com/watch?v=D5FLKOmfdTM\n4. Nassim Taleb, *How you will go bust on a favorable bet (Kelly/Shannon/Thorp)*. https://www.youtube.com/watch?v=91IOwS0gf3g\n5. *Edward Thorp on gaining an edge in the market and in life*: a longer talk, for the light block. https://www.youtube.com/watch?v=HsspiVJM_rs\n6. Already in your Day 1 list: Paolucci, *Why Most Traders Lose: Ergodicity for Quant Trading*. https://www.youtube.com/watch?v=dryV1qJYUw8\n\n## 5. Blogs (practitioner view)\n- Rob Carver, *If you're so smart, how come you're not SBF? The Kelly criterion and choice of expectations and utility function*: why he sizes from a pessimistic quantile, not the mean. https://qoppac.blogspot.com/2022/11/if-youre-so-smart-how-come-youre-not.html\n- Rob Carver, *Kelly versus classical portfolio theory*. https://qoppac.blogspot.com/2018/06/kelly-versus-classical-portfolio-theory.html\n- Rob Carver, *How much risk should we take?* (vol target = Sharpe, then cut it). https://qoppac.blogspot.com/2020/03/how-much-risk-should-we-take.html\n\n## 6. GitHub\n- cvxgrp/kelly_code: Boyd group's risk-constrained Kelly code (Python, CVXPY). Read after the lab. https://github.com/cvxgrp/kelly_code\n- Your repo **probability-and-markets**: commit `kelly_lab.py` and your problems.\n\n## 7. In this ZIP, built for you (folder 04)\n- `kelly_lab.py` / `kelly_lab.ipynb`: 4 parts, all tested. Reference chart `kelly_lab.png`.\n  - Growth curve\n  - 10,000-player replay of the biased-coin game at ½x, 1x, 2x and 3x Kelly\n  - Estimation error\n  - Kelly leverage on an index\n\n## 8. Books for later\n- Edward Thorp, *A Man for All Markets* (autobiography: blackjack to hedge funds).\n- William Poundstone, *Fortune's Formula* (the story of Kelly, Shannon and Thorp).\n- Victor Haghani & James White, *The Missing Billionaires* (2023): sizing for real investors, from the coin-experiment author.\n- MacLean, Thorp & Ziemba (eds.), *The Kelly Capital Growth Investment Criterion* (the full research collection).\n", "problems": "# Day 3: 10 Kelly problems\nRules as before: gut guess → worked answer → one line on what it means for your trading. Solutions only after all 10.\nFormulas you need: even money f* = p − q. Odds b:1 → f* = (b·p − q)/b. Growth per bet g(f) = p·ln(1+b·f) + q·ln(1−f).\nContinuous (stocks): Kelly leverage L* = μ/σ², growth g(L) = L·μ − L²σ²/2 (excess over cash).\n\n1. **Thin edge.** Even-money bet, p = 0.55. What's the Kelly fraction? What's the growth per bet at Kelly?\n\n2. **Long shot.** A bet pays 2:1 (win Rs 2 per Rs 1 staked, or lose the Rs 1). p = 0.40. Kelly fraction? Is this bet better or worse than #1 for growth?\n\n3. **No edge.** Even money, p = 0.45. What does Kelly tell you to bet? What does a \"gut\" trader usually do after five losses in a row here?\n\n4. **Peters' coin (ergodicity).** Each flip, your wealth rises 50% on heads or falls 40% on tails. EV per flip? Growth per flip for ONE person who plays forever? After 100 flips, what's the typical (median) outcome vs the average outcome?\n\n5. **Drawdown arithmetic.** What gain do you need to recover from losses of 10%, 20%, 50%, 90%? Why does this make big bets worse than they look?\n\n6. **Kelly on an index.** Assume an index has excess return μ = 8% and volatility σ = 20% (an assumption, not a forecast). Find the Sharpe ratio, the Kelly leverage, and the growth rate at 1x, 2x, 3x and 4x leverage.\n\n7. **How sure is your edge?** Your 100 backtest trades won 58% of the time. What's the standard error of that win rate? What's a 95% range? What does Kelly say at the bottom of that range?\n\n8. **Odds of halving (Thorp 2006, eq. 7.11).** For fractional Kelly c (c = 1 is full Kelly), the chance your wealth EVER falls to a fraction x of where it started is x^(2/c − 1). Find the chance of ever losing half your money at full, half, quarter and 2x Kelly.\n\n9. **The capped game.** In the Haghani-Dewey game the payout was capped at $250 (players weren't told the cap until they got close). You're at $240 with plenty of time left. Should you keep betting 20%? What changes?\n\n10. **Size your future strategy (write the rule before you have a backtest).** Rs 1,00,000 account. Your future strategy shows a backtest Sharpe of 0.8 on 10 years of data. (a) What's its t-stat? (b) Cut the Sharpe in half for overfitting and costs (a common haircut). What annual volatility does full Kelly target? What does half Kelly target? (c) A NIFTY ETF has about 16% annual vol (we'll measure it on Day 4). How much of the account goes into the ETF if your rule also says \"never more than 1x, no borrowing\"?\n", "files" v0.\n\n---\n\n## Your day (about 6 h; deep work about 4 h)\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 30 min | Drill | Zetamac 2×2 + market-making game, 5 rounds. Log both. | |\n| 20 min | Deep 0: Raw audit | Before ANY code from me: open `NIFTYBEES_daily.csv` in pandas, plot Close, look for anything impossible. Write down what you find. | 03_data/ |\n| 75 min | Deep 1: The facts | Cont (2001): sections 1–3 and 5 (the list of stylized facts, plus the tails and volatility clustering). Skim the math. Then Engle, *GARCH 101*: pages 1–8 only, the idea of volatility that changes over time. | 01_, 02_ |\n| 75 min | Deep 2: Lab | Fill `prediction-sheet.md`, run `nifty_stats_lab.py` (or `.ipynb`), answer its 5 questions. **This is the Day 4 deliverable.** Then change one thing yourself: e.g. Bank Nifty instead of NIFTY, or 63-day instead of 21-day vol. | 04_build_along/ |\n| 60 min | Deep 3: Problems | 10 problems on the real numbers. Then start `data-audit-checklist.md`. | 05_, 06_ |\n| 45–60 min | Light | MIT 18.S096 *Volatility Modeling* lecture, the QuantEcon heavy-tails lecture, and the Taleb chapter 1 \"non-technical overview\" (first ~25 pages only). | RESOURCES.md |\n| 15 min | Review | Training log row | |\n\n**Setup:** `pip install numpy pandas matplotlib scipy` (plus `jupytext` if you want to rebuild the notebook). Keep the folder structure; the lab reads `../03_data/`.\n\n---\n\n## What to pull from each reading\n\n**Cont (2001):** a checklist of what any model of returns must reproduce. For each fact, find the matching number in your lab output.\n\n**Engle, GARCH 101:** today's vol is a weighted mix of the long-run average, yesterday's surprise and yesterday's vol. You won't fit GARCH today; you only need the idea that *recent vol predicts near-future vol.*\n\n**Engle's Nobel lecture (optional):** the same idea from its inventor, with VaR and why risk management needs it.\n\n**Taleb, Statistical Consequences of Fat Tails:** 500+ pages; read only the opening overview. The key line for a trader: under fat tails, the sample mean and the sample variance are unreliable, and your worst day hasn't happened yet.\n\n**QuantEcon, Heavy-Tailed Distributions:** Python, hands-on, and it uses market data too. Do the exercises if you finish early.\n\n---\n\n## Mentor's rules for Day 4\n1. **Audit before analysis, every time.** Plot raw prices with your eyes before computing anything.\n2. **Never trust a normal sigma for a risk limit.** Use the worst day in the data, and assume a worse one is coming.\n3. **Write the IST timestamp at which every input becomes known.** Most fake backtests die here.\n4. **Benchmark against what you could actually hold** (TRI or the ETF), never the price index.\n\nSend me: what you found in the raw audit (before reading the lab), lab predictions vs actuals, the 5 lab answers, the 10 problems, and your audit checklist.\n", "resources": "# Day 4 resources: real returns, volatility, correlation, fat tails\nAll free. ✅ = in this ZIP. Links checked 31 Oct 2026.\n\n## 1. Stylized facts and fat tails (folder 01)\n- ✅ Rama Cont (2001), \"Empirical properties of asset returns: stylized facts and statistical issues\", Quantitative Finance. **Core reading.**\n- ✅ Sargent & Stachurski, QuantEcon: \"Heavy-Tailed Distributions\" (PDF of the lecture). Live version with runnable code: https://intro.quantecon.org/heavy_tails.html\n- ✅ Nassim Taleb, *Statistical Consequences of Fat Tails* (3rd ed., arXiv 2001.10488). Read the opening overview only today. https://arxiv.org/abs/2001.10488\n\n## 2. Volatility (folder 02)\n- ✅ Robert Engle (2001), \"GARCH 101: The Use of ARCH/GARCH Models in Applied Econometrics\", Journal of Economic Perspectives\n- ✅ Robert Engle (2003), Nobel Lecture: \"Risk and Volatility: Econometric Models and Financial Practice\"\n- ✅ MIT 15.450 *Analytics of Finance*, Leonid Kogan: Lecture 10 slides, *Volatility Models*\n- Allan Malz (Columbia), lecture notes: *Volatility behavior and forecasting* (EWMA vs GARCH, clear). https://www.columbia.edu/~amm26/lecture%20files/volatilityBehaviorForecasting.pdf\n\n## 3. Data (folder 03)\n- ✅ 6 CSVs, 2007–2026 (see `README_DATA.md`)\n- NSE / Nifty Indices official historical data, including the **NIFTY 50 Total Return Index**: https://www.niftyindices.com/reports/historical-data\n- yfinance (what I used): https://github.com/ranaroussi/yfinance\n- jugaad-data (Python, pulls NSE data directly; useful as a second source to cross-check): https://github.com/jugaad-py/jugaad-data\n\n## 4. Video lectures\nMIT 18.S096 *Topics in Mathematics with Applications in Finance* (Fall 2013), free. Full playlist: https://www.youtube.com/playlist?list=PLUl4u3cNGP63ctJIEC1UnZ0btsphnnoHR\n1. Lecture 9, *Volatility Modeling* (historical vol, GBM, jumps). **Watch today.** https://www.youtube.com/watch?v=cDlbEQz1PQk\n2. Lecture 8, *Time Series Analysis I* (stationarity, autocorrelation). https://www.youtube.com/watch?v=uBeM1FUk4Ps\n3. Lecture 11, *Time Series Analysis II* (ARCH/GARCH). https://www.youtube.com/watch?v=_IFUfFuyQlU\n4. Lecture 7, *Value At Risk (VAR) Models*: for problem 4. https://www.youtube.com/watch?v=92WaNz9mPeY\nCourse page with notes and problem sets: https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/\n\n## 5. Blogs (practitioner view)\n- Rob Carver, *Is predicting vol better worth the effort, and does the VIX help?* (2025): simple EWMA vol vs fancy models, tested. https://qoppac.blogspot.com/2025/11/is-predicting-vol-better-worth-effort.html\n- Rob Carver, *The relationship between ATR and standard deviation*: why recent weeks of vol forecast the next weeks best. https://qoppac.blogspot.com/2018/12/the-relationship-between-atr-and.html\n- Rob Carver, *How much risk should we take?*: links Day 3 (Kelly) to today (vol targets). https://qoppac.blogspot.com/2020/03/how-much-risk-should-we-take.html\n\n## 6. GitHub\n- bashtage/arch: the standard Python GARCH library. Try it
