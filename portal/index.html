ata is −3.62%. In rupees? (c) The average loss on those worst 1% of days (expected shortfall) is −5.46%. Which of the three numbers should your risk limit use?\n\n5. **Breaches.** A good 99% VaR model should be breached on about 1% of days. On NIFTY, the normal-model VaR was breached on 1.79% of days. Is that close enough? What would 4,690 days at 1% look like (expected count and rough standard deviation)?\n\n6. **Square-root-of-time.** Annual vol is 20.5%. What does √time predict for monthly vol? Measured monthly-return vol × √12 came out at 20.7%. What does that agreement tell you, and what could break it?\n\n7. **Diversification.** Since 2009: NIFTY vol 17.9%, gold ETF vol 15.8%, correlation about −0.01. What's the vol of a 50/50 portfolio? (The data gives 11.9%.) Why is it lower than both?\n\n8. **Vol targeting.** Your rule: target 12% annual vol, max 1.0x. Today NIFTY's 21-day vol is 30%. What fraction of capital goes into NIFTY? What if vol is 9%?\n\n9. **Time zones.** NIFTY vs S&P 500 same-date correlation is +0.29; NIFTY today vs S&P yesterday is +0.23. A friend's backtest buys NIFTY at today's close whenever the S&P is up \"today\". What's wrong, and what will happen live?\n\n10. **Price vs what you earn.** Since 2010 the NIFTY 50 price index grew at 9.19% a year; the NIFTYBEES ETF at 10.04%. What explains most of the gap? If you backtest on the price index, is your strategy's return biased up or down vs a buy-and-hold you could really own?\n", "files": ["00_START_HERE.md", "01_stylized_facts/Cont_2001_Empirical_Properties_of_Asset_Returns_Stylized_Facts.pdf", "01_stylized_facts/QuantEcon_Heavy_Tailed_Distributions.pdf", "01_stylized_facts/Taleb_Statistical_Consequences_of_Fat_Tails.pdf", "02_volatility/Engle_2001_GARCH_101.pdf", "02_volatility/Engle_2003_Nobel_Lecture_Risk_and_Volatility.pdf", "02_volatility/MIT_15450_Kogan_Volatility_Models_slides.pdf", "03_data/README_DATA.md", "04_build_along/nifty_stats_lab.ipynb", "04_build_along/nifty_stats_lab.png", "04_build_along/nifty_stats_lab.py", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "06_templates/data-audit-checklist.md", "06_templates/prediction-sheet.md", "06_templates/training-log-day4-row.md", "RESOURCES.md"]}, {"day": 5, "date": "Wed 04 Nov 2026", "focus": "Overfitting: noise strategies, deflated Sharpe, minimum backtest length", "week": 1, "start_here": "# DAY 5: Wed 4 Nov 2026\n## Overfitting: noise strategies, deflated Sharpe, minimum backtest length\n\nToday is the most important defensive day of the 28. Almost every retail \"quant strategy\" dies of what you learn today.\n\nThe idea in one line: **if you try enough things, one will look brilliant by luck, and it will die the day you trade it.**\nYou'll prove it with your own hands, on real NIFTY data: 20 coin-flip strategies, crown a champion, watch it collapse.\n\nThen you get three tools to defend yourself:\n1. **Deflated Sharpe Ratio (DSR):** \"Is this Sharpe still impressive, given how many things I tried?\"\n2. **Minimum Backtest Length (MinBTL):** \"Do I even have enough data for this many tries?\"\n3. **Probability of Backtest Overfitting (PBO via CSCV):** \"Does picking the in-sample winner beat a coin flip out of sample?\"\n\nAnd the habit that matters more than any formula: **count every trial.**\n\n**Deliverable (from the plan):** proof that the best noise strategy is fake = `overfitting_lab` run with predictions first, plus the 10 problems, plus your trial log started properly.\n\n---\n\n## Your day (about 6 h; deep work about 4 h)\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 30 min | Drill | Zetamac 2×2 + market-making game, 5 rounds. Log both. | |\n| 30 min | Deep 0: Do it yourself first | Before opening my lab: in 20 lines of numpy, make 20 random +1/−1 signals on NIFTY returns, compute Sharpe on the first 70%, pick the best, check the last 30%. Write down what you expected first. | 03_data/ |\n| 75 min | Deep 1: Read | **Bailey, Borwein, López de Prado & Zhu (2014)**, *Pseudo-Mathematics and Financial Charlatanism*: sections 1–3 (MinBTL; the key figure is how the best Sharpe grows with trials). Then **Bailey & López de Prado (2014)**, *The Deflated Sharpe Ratio*: sections 1–4 (the False Strategy Theorem + the DSR formula). | 01_core_papers/ |\n| 75 min | Deep 2: Lab | Fill `prediction-sheet.md` → run `overfitting_lab.py` → answer its 5 questions. Then question 5's experiment: rerun on the last 2 years only. | 04_build_along/ |\n| 60 min | Deep 3: Problems | 10 problems. Then set up `trial-log-template.md` and log every backtest you've run so far in this program (yes, including Day 4's). | 05_, 06_ |\n| 45–60 min | Light | Video: López de Prado, *Dangers of Backtest Overfitting*. Then Harvey & Liu, *Evaluating Trading Strategies* (11 pages, very readable). | RESOURCES.md, 02_ |\n| 15 min | Review | Training log row | |\n\n**Setup:** `pip install numpy pandas matplotlib scipy`. The CSV is in `03_data/` (the same NIFTY file as Day 4).\n\n---\n\n## What to pull from each reading\n\n**Pseudo-Mathematics (Bailey et al. 2014):** with 45 independent tries you need about 5 years of data just to expect the best fake Sharpe to stay below 1. Most retail backtests try more than that on less data.\n\n**Deflated Sharpe (2014):** the \"expected maximum Sharpe\" of N zero-skill strategies becomes your new zero. DSR is the probability your Sharpe beats *that*, adjusted for fat tails and sample length.\n\n**Probability of Backtest Overfitting (2017):** skim sections 1–3 for the CSCV idea. The lab implements it in 15 lines.\n\n**Harvey, Liu & Zhu (2016):** read only the intro and the conclusion. With hundreds of factors already tested, a new one needs **t > 3**, not 2. That's where our t > 3 rule comes from.\n\n**Ioannidis (2005):** 6 pages from medicine, the same disease. Read it as a warning about yourself.\n\n---\n\n## Mentor's rules for Day 5 (permanent from today)\n1. **Every backtest you look at is a trial. Log it.** Including bugs, peeks and \"quick checks\".\n2. **The grid is fixed before you see results.** Small: think about 10–20 variants, not 1,000.\n3. **Report DSR and the trial count next to every Sharpe.** A Sharpe without its N is meaningless.\n4. **A holdout is used once.** Peek and tweak, and it's in-sample forever.\n5. **Being ruthless with your own ideas is not pessimism.** It's the job.\n\nSend me: what you predicted in Deep 0 before coding, lab predictions vs actuals, the 5 lab answers, the 10 problems, and your trial log with its current N.\n", "resources": "# Day 5 resources: overfitting, multiple testing, deflated Sharpe\nAll free. ✅ = in this ZIP. Links checked 31 Oct 2026.\n\n## 1. Core papers (folder 01)\n- ✅ Bailey, Borwein, López de Prado & Zhu (2014), \"Pseudo-Mathematics and Financial Charlatanism: The Effects of Backtest Overfitting on Out-of-Sample Performance\", Notices of the AMS (preprint). **MinBTL. Read first.**\n- ✅ Bailey & López de Prado (2014), \"The Deflated Sharpe Ratio: Correcting for Selection Bias, Backtest Overfitting and Non-Normality\", Journal of Portfolio Management (preprint). **Read second.**\n- ✅ Bailey, Borwein, López de Prado & Zhu (2017), \"The Probability of Backtest Overfitting\", Journal of Computational Finance (preprint). The CSCV method.\n- ✅ Bailey & López de Prado (2012), \"The Sharpe Ratio Efficient Frontier\": the Probabilistic Sharpe Ratio (PSR) and Minimum Track Record Length. The maths under DSR.\n\n## 2. Multiple testing (folder 02)\n- ✅ Harvey & Liu (2014), \"Evaluating Trading Strategies\", JPM. Short and readable; the best starting point.\n- ✅ Harvey & Liu (2015), \"Backtesting\", JPM: the Sharpe \"haircut\".\n- ✅ Harvey, Liu & Zhu (2016), \"...and the Cross-Section of Expected Returns\", RFS (NBER working paper). The t > 3 bar.\n- ✅ Campbell Harvey, *Backtesting* lecture slides (Duke, 2024, 115 slides): the whole topic as a lecture.\n- ✅ Ioannidis (2005), \"Why Most Published Research Findings Are False\", PLoS Medicine.\n\n## 3. Video\n- Marcos López de Prado, *Dangers of Backtest Overfitting* (talk). https://www.youtube.com/watch?v=QxhxLwNbMMg\n- Hudson & Thames, *The 7 Sins of Backtesting*. https://www.youtube.com/watch?v=kUtRdaY59RU\n- López de Prado's own lists of lectures and videos (including his Cornell ORIE 5256 course material and \"7 Reasons Most ML Funds Fail\"): https://www.quantresearch.org/Lectures.htm and https://www.quantresearch.org/Videos.htm\n\n## 4. Interactive and blogs\n- Bailey et al., *Backtest overfitting in financial markets*: describes their online Backtest Overfitting Demonstration Tool. https://www.davidhbailey.com/dhbpapers/overfit-tools-at.pdf\n- Mathematical Investor blog (Bailey & Borwein): short essays on overfitting in finance. https://mathinvestor.org/\n- López de Prado's software page (original CSCV / PBO code). https://www.quantresearch.org/Software.htm\n\n## 5. GitHub\n- esvhd/pypbo: PBO, PSR, MinTRL, MinBTL and DSR in Python. Use it to cross-check your own implementation. https://github.com/esvhd/pypbo\n- CH4RL3I/fluke: small and clean: PBO (CSCV), DSR, MinTRL with a noise-vs-signal demo. https://github.com/CH4RL3I/fluke\n- Your repo **nifty50-sma-backtester**: count how many parameter combinations you tried when you built it. Compute its DSR. Write the result in the README honestly.\n\n## 6. Built for you (folder 04)\n`overfitting_lab.py` / `.ipynb` (tested on the NIFTY data; reference chart `overfitting_lab.png`):\n1–2. 20 coin-flip strategies on real NIFTY, IS vs OOS\n3. 2,000 contests vs the False Strategy Theorem\n4. Best fake Sharpe vs number of trials\n5. Deflated Sharpe Ratio\n6. PBO via CSCV (12,870 splits)\n7. MinBTL table\n8. Control experiment with one real edge planted\n\n## 7. Books for later\n- Marcos López de Prado, *Advances in Financial Machine Learning* (2018): chapters 11–14 on backtesting dangers, CPCV and backtest statistics.\n- López de Prado, *Machine Learning for Asset Managers* (2020): section 8, testing set overfitting.\n- David Aronson, *Evidence-Based Technical Analysis* (2006): data-mining bias, explained for traders.\n", "problems": "# Day 5: 10 problems on overfitting\nRules as always: gut guess → worked answer → one-line trading implication. Solutions after all 10.\nHandy: a zero-skill strategy's annual Sharpe over y years is roughly Normal(0, 1/y). t-stat ≈ annual Sharpe × √years.\nExpected max of N standard normals: N=10 → 1.57, N=20 → 1.90, N=100 → 2.53.\n\n1. **Twenty tests.** You test 20 useless strategies, each at the usual 5% significance level. What's the chance at least one looks \"significant\"?\n\n2. **t from Sharpe.** A backtest shows annual Sharpe 0.8 over 5 years. What's its t-stat? How many years would it need to reach t > 3 (Harvey, Liu & Zhu's bar)?\n\n3. **Luck's Sharpe.** You try 100 zero-skill variants on 19 years of NIFTY. What's the expected best Sharpe? On just 5 years of data?\n\n4. **MinBTL.** You want the best of your 20 ideas to be unlikely to show a fake Sharpe of 1.5. How many years of data do you need? For 10 ideas and a target of 1.0?\n\n5. **Bonferroni.** With 20 tests and an overall 5% false-alarm budget (two-sided), what z-score (t-stat) must a single strategy clear?\n\n6. **The haircut.** A strategy shows Sharpe 1.0 over 10 years, and the researcher admits trying 50 variants. Use a Bonferroni correction to find the \"haircut\" Sharpe. What % of the Sharpe disappears?\n\n7. **What deflates the Sharpe?** Name the four things the Deflated Sharpe Ratio takes into account besides the Sharpe itself. For each, say whether more of it makes DSR go up or down.\n\n8. **Correlated trials.** You test SMA crossovers with slow length 190, 195, 200, 205, 210. Is that 5 trials? 1 trial? Why does it matter for DSR?\n\n9. **Counting honestly.** Over a week you: tried 3 lookbacks, on 4 ETFs, then \"fixed a bug\" and reran everything, then also tried the whole thing with and without a stop-loss. How many trials go in the log?\n\n10. **The peeked holdout.** You kept 2022–2026 as out-of-sample. Your strategy failed it, so you tweaked one parameter and it passed. What's the status of 2022–2026 now, and what has the \"pass\" proved?\n", "files": ["00_START_HERE.md", "01_core_papers/Bailey_Borwein_LopezdePrado_Zhu_2014_Pseudo_Mathematics_and_Financial_Charlatanism.pdf", "01_core_papers/Bailey_LopezdePrado_2012_Sharpe_Ratio_Efficient_Frontier_PSR.pdf", "01_core_papers/Bailey_LopezdePrado_2014_Deflated_Sharpe_Ratio.pdf", "01_core_papers/Bailey_et_al_2017_Probability_of_Backtest_Overfitting.pdf", "02_multiple_testing/Harvey_2024_Backtesting_lecture_slides_Duke.pdf", "02_multiple_testing/Harvey_Liu_2014_Evaluating_Trading_Strategies.pdf", "02_multiple_testing/Harvey_Liu_2015_Backtesting.pdf", "02_multiple_testing/Harvey_Liu_Zhu_2016_and_the_Cross_Section_of_Expected_Returns.pdf", "02_multiple_testing/Ioannidis_2005_Why_Most_Published_Research_Findings_Are_False.pdf", "04_build_along/overfitting_lab.ipynb", "04_build_along/overfitting_lab.png", "04_build_along/overfitting_lab.py", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "06_templates/prediction-sheet.md", "06_templates/training-log-day5-row.md", "06_templates/trial-log-template.md", "RESOURCES.md"]}, {"day": 6, "date": "Thu 05 Nov 2026", "focus": "Microstructure: the order book, the spread, adverse selection, slippage", "week": 1, "start_here": "# DAY 6: Thu 5 Nov 2026\n## Microstructure: the order book, the spread, adverse selection, slippage\n\nUntil today, a \"price\" was one number in a CSV. Today you learn it's a fight between two queues of orders, and that every trade you make has someone on the other side who chose to trade with you.\n\nTwo ideas to take away from today:\n1. **The spread exists because some traders know more than the market maker** (Glosten–Milgrom). It's the fee for the risk of trading with them.\n2. **The price you see is not the price you get.** Spread, queue position, impact and missed fills sit between your backtest and your bank account.\n\nYou'll prove idea 1 by building a market maker that loses money for exactly this reason. You'll use idea 2 to write your first cost model.\n\n**Deliverable (from the plan):** a naive market maker that loses, and why = `naive_mm_lab` run (predictions first) + its session replayed through YOUR C++ orderbook + the 10 problems + `cost-model-template.md` started.\n\n---\n\n## Your day (about 6 h; deep work about 4 h)\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 30 min | Drill | Zetamac + market-making game, 5 rounds. Today, while you play: notice when you got picked off. | |\n| 75 min | Deep 1: Read | **Glosten & Milgrom (1985)**: sections 1–3, the model only. Then **Hasbrouck's notes**: the chapters on the Roll model and sequential trade models. **Avellaneda–Stoikov (2008)**: sections 1–3 (reservation price, optimal spread). | 01_, 02_ |\n| 90 min | Deep 2: Lab | Fill `prediction-sheet.md` → run `naive_mm_lab.py` → answer its 5 questions. | 06_build_along/ |\n| 45 min | Deep 3: Your C++ book | Replay `naive_mm_session.csv` through `orderbook_replay`, then run `pnl_from_replay.py`. Does your engine's P&L agree with the sign and rough size the Python lab predicts? If not, find out why. | 06_build_along/ |\n| 45 min | Deep 4: Problems | The 10 problems. Then fill as much of `cost-model-template.md` as you can from REAL sources (your broker's charges page). | 07_, 08_ |\n| 45 min | Light | Video: UCPH *Financial Markets Microstructure*, lectures 1 and 2, plus the Glosten–Milgrom lecture. Skim the NSE pre-open FAQ (in the ZIP) and the market timings page. | RESOURCES.md, 04_ |\n| 15 min | Review | Training log row | |\n\n**Setup:** `pip install numpy pandas matplotlib scipy`.\n\nAbout the C++ replay: I wrote the session CSV in exactly the format your README specifies (`ADD,id,BUY|SELL,price,qty,GTC|IOC` and `CANCEL,id`; prices in integer ticks of ₹0.01). I couldn't compile your engine in my sandbox, so **you** are the first test. If something rejects, that's a free bug hunt. Some `CANCEL` lines will hit already-filled quotes and print `NOT_FOUND`: that's expected.\n\n---\n\n## What to pull from each reading\n- **Glosten–Milgrom:** bid = E[value | someone sells to me]; ask = E[value | someone buys from me]. The spread is pure information cost, even with zero fees.\n- **Kyle (1985):** skim the intro only. An informed trader hides inside noise trading; λ (\"Kyle's lambda\") is how much the price moves per unit of order flow.\n- **Roll (1984):** bid-ask bounce creates negative autocorrelation in price changes. That's why short-horizon \"reversal\" in daily closes can be fake.\n- **Avellaneda–Stoikov:** skew your quotes against your inventory. Inventory is risk you get paid nothing for.\n- **Gould et al. (2013):** the survey of how limit order books actually behave. Read sections 1–3.\n- **NSE documents:** how the 9:00–9:15 pre-open call auction sets the open, plus the order types and price bands. Your future strategy trades inside these rules.\n\n---\n\n## Mentor's rules for Day 6\n1. **You are the one crossing the spread, not the market maker.** Every assumption of a \"free\" fill is a lie until proven otherwise.\n2. **Judge fills by markouts,** meaning where the price goes after, not the price you got.\n3. **Cost numbers come from sources, never memory.** Run every backtest at a low and a high cost case.\n4. **A trade \"at the open\" happens in an auction.** Don't backtest as if you got the open price for free.\n\nSend me: lab predictions vs actuals, the 5 lab answers, your C++ replay P&L (and any bugs you found), the 10 problems, and cost model v0.\n", "resources": "# Day 6 resources: market microstructure\nAll free. ✅ = in this ZIP. Links checked 31 Oct 2026.\n\n## 1. Foundations (folder 01)\n- ✅ Glosten & Milgrom (1985), \"Bid, Ask and Transaction Prices in a Specialist Market with Heterogeneously Informed Traders\", JFE. **The adverse-selection model. Core reading.**\n- ✅ Kyle (1985), \"Continuous Auctions and Insider Trading\", Econometrica. Kyle's lambda.\n- ✅ Joel Hasbrouck, *Empirical Market Microstructure*: teaching notes, NYU Stern (draft 1.1, 2003). The best free textbook-style treatment: Roll model, sequential trade, and more.\n- ✅ Gould, Porter, Williams, McDonald, Fenn & Howison (2013), \"Limit Order Books\", Quantitative Finance (arXiv). The LOB survey.\n- ✅ Biais, Glosten & Spatt (2005), \"Market Microstructure: A Survey of Microfoundations, Empirical Results, and Policy Implications\".\n- ✅ Bouchaud, Farmer & Lillo (2008), \"How Markets Slowly Digest Changes in Supply and Demand\" (arXiv). Price impact and the square-root law. A long reference: read sections 1–2.\n\n## 2. Market making (folder 02)\n- ✅ Avellaneda & Stoikov (2008), \"High-frequency trading in a limit order book\" (author preprint). Inventory skew, reservation price.\n\n## 3. Spread, impact, execution (folder 03)\n- ✅ Roll (1984), \"A Simple Implicit Measure of the Effective Bid-Ask Spread in an Efficient Market\", JF.\n- ✅ Corwin & Schultz, \"A Simple Way to Estimate Bid-Ask Spreads from Daily High and Low Prices\" (NBER conference version; published in JF 2012).\n- ✅ Almgren & Chriss (2000), \"Optimal Execution of Portfolio Transactions\". The cost vs risk trade-off when splitting an order.\n- ✅ Cont, Kukanov & Stoikov (2014), \"The Price Impact of Order Book Events\" (arXiv). Order-flow imbalance.\n\n## 4. NSE rules (folder 04)\n- ✅ NSE FAQ: Pre-open Session in the Equity (CM) Segment (Oct 2026 version).\n- ✅ NSE Capital Market Consolidated Circular (Apr 2026). Trading hours, order types, price bands, and tick sizes (§3.3). Note that ETFs are excluded from the price-linked tick table, so check the ETF's tick in the security file or on Kite.\n- NSE pre-open session page: https://www.nseindia.com/static/products-services/equity-market-pre-open\n- NSE market timings: https://www.nseindia.com/static/market-data/market-timings\n\n## 5. Video and courses\n- **UCPH, *Financial Markets Microstructure*** (Masters course, spring 2020, full YouTube playlist, CC-licensed): https://www.youtube.com/playlist?list=PL4pUs4P_j1Wa2_P1lw44kFWWjKDTGUY7S\n  - Lecture 1, Concepts and Institutions: https://www.youtube.com/watch?v=nPqat782ADI\n  - Lecture 2, Measuring Liquidity: https://www.youtube.com/watch?v=8hYE-QMI2Yg\n  - Then the Glosten–Milgrom and Kyle lectures in the same playlist (lecture list: https://quantfinance.substack.com/p/financial-markets-microstructure)\n- Dale Rosenthal, *Market Microstructure and Electronic Trading* course page, with R code for the Glosten–Milgrom and Kyle models: https://sites.google.com/site/dalerosenthal/teaching/market-microstructure\n- Institut Louis Bachelier, *Practical Introduction to Market Microstructure* MOOC (17 short videos): https://mooc.institutlouisbachelier.org/en/mooc/practical-introduction-to-market-microstructure-2/\n\n## 6. GitHub\n- Your own **Rubin-S/orderbook**: today's lab exports a session in its replay format.\n- jpmorganchase/abides-jpmc-public: an agent-based exchange simulator (market makers, noise and informed agents). For later, if you want to scale up today's toy. https://github.com/jpmorganchase/abides-jpmc-public\n- nkaz001/hftbacktest: a backtester that models queue position and latency. Read its README to see what \"realistic fills\" requires. We won't use it, since we trade daily. https://github.com/nkaz001/hftbacktest\n\n## 7. Built for you (folder 06)\n- `naive_mm_lab.py` / `.ipynb` + reference chart `naive_mm_lab.png`:\n  - A–B: naive market maker vs informed and noise traders, with the P&L split\n  - C: markouts\n  - D: break-even spread vs the share of informed traders\n  - E: fixes (learning from order flow, inventory skew)\n  - F: NIFTYBEES spread estimated from daily data (Roll, Corwin–Schultz) vs the 1-tick floor\n  - G: session export for your C++ engine\n- `naive_mm_session.csv` + `naive_mm_session_truth.csv` + `pnl_from_replay.py`.\n\n## 8. Books for later\n- Larry Harris, *Trading and Exchanges* (2003): the practitioner bible. Chapters on dealers, informed traders and liquidity.\n- Bouchaud, Bonart, Donier & Gould, *Trades, Quotes and Prices* (2018).\n- Cartea, Jaimungal & Penalva, *Algorithmic and High-Frequency Trading* (2015).\n", "problems": "# Day 6: 10 problems on microstructure\nRules: gut guess → worked answer → one-line trading implication. Solutions after all 10.\n\n1. **Spread in bps.** NIFTYBEES shows bid ₹261.87, ask ₹261.88. What's the spread in basis points of the mid? What does crossing it cost on a ₹10 lakh round trip (buy at ask, later sell at bid, same quotes)?\n\n2. **Glosten–Milgrom by hand.** The true value is ₹101 or ₹99 (50/50). A fraction μ = 20% of traders are informed (buy if ₹101, sell if ₹99); the rest buy or sell 50/50. A competitive, risk-neutral market maker sets ask = E[V | a buy arrives] and bid = E[V | a sell arrives]. Find bid, ask, spread. Then do μ = 50%.\n\n3. **Roll's estimator.** The covariance of consecutive price changes is −0.0004 (₹²). Estimated effective spread?\n\n4. **Markouts.** You bought 1 unit at ₹100.00 when the mid was ₹100.01. One minute later the mid is ₹99.97. Your markout at fill and at 1 minute? Was this fill \"good\"?\n\n5. **Square-root impact.** Daily vol 1.3%. You buy 1% of a day's volume. Using impact ≈ Y·σ·√(Q/V) with Y ≈ 1, what's the expected impact in bps? And for 10% of the day's volume?\n\n6. **The queue.** You join the best bid with 50,000 units already ahead of you. About 5,000 units trade at that price per minute and nobody ahead cancels. How long until you're filled? Now: in which kind of minute are you MOST likely to finally get filled, and why is that bad?\n\n7. **Market or limit?** Your daily NIFTYBEES strategy signals \"buy\" at 15:00. A market order pays half a spread now. A limit order at the bid saves that, but it doesn't always fill, and the price runs away on 30% of days by an average of 20 bps. The half-spread is 0.2 bps. Which is cheaper on average?\n\n8. **Inventory skew (Avellaneda–Stoikov).** Reservation price r = s − q·γ·σ²·(T−t). Mid s = ₹100, inventory q = +10, γ = 0.1, σ²(T−t) = 0.04. Find r. Which way do your quotes move, and why does that help?\n\n9. **NSE pre-open auction.** Buy orders: 100 @ ₹262.00, 200 @ ₹261.90, 300 @ ₹261.80. Sell orders: 150 @ ₹261.80, 150 @ ₹261.90, 200 @ ₹262.00. Using NSE's rule (the price that maximises executable volume), find the opening price and traded volume.\n\n10. **The cost budget.** Your strategy's gross edge is 4% a year. All-in cost per round trip (spread + brokerage + STT/fees + impact) is 10 bps. How many round trips a year before costs eat HALF the edge? What if the true cost is 25 bps?\n", "files": ["00_START_HERE.md", "01_foundations/Biais_Glosten_Spatt_2005_Market_Microstructure_survey.pdf", "01_foundations/Bouchaud_Farmer_Lillo_2008_How_Markets_Slowly_Digest_Supply_and_Demand.pdf", "01_foundations/Glosten_Milgrom_1985_Bid_Ask_and_Transaction_Prices.pdf", "01_foundations/Gould_et_al_2013_Limit_Order_Books_survey.pdf", "01_foundations/Hasbrouck_Empirical_Market_Microstructure_lecture_notes.pdf", "01_foundations/Kyle_1985_Continuous_Auctions_and_Insider_Trading.pdf", "02_market_making/Avellaneda_Stoikov_2008_HFT_in_a_Limit_Order_Book.pdf", "03_spread_and_costs/Almgren_Chriss_2000_Optimal_Execution.pdf", "03_spread_and_costs/Cont_Kukanov_Stoikov_2014_Price_Impact_of_Order_Book_Events.pdf", "03_spread_and_costs/Corwin_Schultz_2012_High_Low_Spread_Estimator.pdf", "03_spread_and_costs/Roll_1984_Implicit_Measure_of_Effective_Spread.pdf", "04_nse_rules/NSE_Capital_Market_Consolidated_Circular_Apr2026.pdf", "04_nse_rules/NSE_FAQ_Pre_open_Session_CM_Oct2026.pdf", "05_data/README_DATA.md", "06_build_along/naive_mm_lab.ipynb", "06_build_along/naive_mm_lab.png", "06_build_along/naive_mm_lab.py", "06_build_along/pnl_from_replay.py", "07_problems/10_problems.md", "07_problems/SOLUTIONS_open_after_all_10.md", "08_templates/cost-model-template.md", "08_templates/prediction-sheet.md", "08_templates/training-log-day6-row.md", "RESOURCES.md"]}, {"day": 7, "date": "Fri 06 Nov 2026", "focus": "The NSE cost stack + GATE 1", "week": 1, "start_here": "# DAY 7: Fri 6 Nov 2026\n## The NSE cost stack + GATE 1\n\nYesterday you learned the costs you can't see: spread, adverse selection, impact. Today it's the costs you CAN see, which retail traders still ignore: STT, exchange charges, SEBI fee, stamp duty, GST, DP charges, and the tax on your gains.\n\nThe idea in one line: **a strategy's edge is what's left after the government, the exchange, the depository and your broker have been paid.** SEBI's 2024 study found 71% of individual intraday traders in the cash segment lost money in FY23, and for the loss-makers, trading costs added another 57% on top of their trading losses (in 08_research).\n\n**Deliverable (from the plan):** a cost calculator in code, checked to within 20% of a real contract note. Then **GATE 1**.\n\n---\n\n## Your day (about 6 h; deep work about 4 h)\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 30 min | Drill | Zetamac + market-making game. Log scores. | |\n| 45 min | Deep 1: Sources first | Read `RATES_SNAPSHOT`, then open each official PDF it cites and find the number yourself: NSE/FA/73061 (transaction charge), the BSE Apr 2026 STT table, the SEBI stamp-duty FAQ. **Don't trust my table: verify it.** | 01_official_rates/ |\n| 75 min | Deep 2: Build | BEFORE opening `nse_costs.py`, write your own calculator from the sources (functions for one leg and a round trip; delivery/intraday; share/equity ETF/gold ETF). Then compare it with mine and run `test_nse_costs.py` against yours. Add ≥3 tests of your own. | 04_build_along/ |\n| 30 min | Deep 3: Reality check | `contract_note_check.py` against a REAL contract note. No account yet? Price the same trade on your broker's official brokerage calculator and save a screenshot. Explain every line that differs. | 04_build_along/ |\n| 45 min | Deep 4: Costs vs a strategy | Fill `prediction-sheet.md` → run `cost_drag_lab.py` (costs and tax applied to two toy MA rules on real NIFTYBEES data) → answer its 6 questions. Log both rules in your trial log. | 04_build_along/ |\n| 45 min | Problems | The 10 problems, by hand first. | 05_problems/ |\n| 30 min | **GATE 1** | Go through `GATE_1_CHECKLIST.md` honestly, then send me everything. | 07_gate1/ |\n| 15 min | Review | Training log row. | 06_templates/ |\n\n**Setup:** `pip install numpy pandas matplotlib pytest`.\n\n---\n\n## Two data notes\n- **New bad ticks found:** NIFTYBEES has one-day spikes on 2010-02-05 (+10.8%, then reversed) and 2010-10-06 (−15%, then reversed). Day 4's lab only removed the 2019 glitch. It doesn't change Day 4's CAGR (that uses only the endpoints), but it slightly affects NIFTYBEES volatility and correlation numbers. The lab filters these spikes; Day 14's audit will hunt them properly.\n- **The toy MA rules are not ideas.** They exist only to show what costs do. Both trail buy-and-hold by ~6 CAGR points before a single rupee of cost. That's a lesson too.\n\n---\n\n## What to take from the research (08_research)\n- **SEBI 2024, intraday trading in the cash segment:** the Indian evidence. Read the summary (pp. 3–4).\n- **Novy-Marx & Velikov (2016):** most anomalies with turnover above 50% a month die after costs. A \"buy/hold spread\" (stricter rules to enter than to stay) is the best cheap fix. You'll use that idea in Week 2.\n- **Frazzini, Israel & Moskowitz:** institutional costs are far lower than academic estimates assume. You are not an institution: your fixed fees (DP charge) and tax matter more than impact.\n\n---\n\n## Mentor's rules for Day 7 (permanent)\n1. **Every rate has a source and a date.** If you can't cite it, it's not in the model.\n2. **Costs are computed per order, from the broker's actual rules,** never as a single \"0.1%\" guess.\n3. **Tax is a cost.** Short-term gains on equity are taxed at 20% (+cess). A strategy that turns everything into short-term gains needs to earn that back.\n4. **Compare like with like.** Before \"fixing\" your model against a contract note, check you're comparing the same items (DP charges aren't on Zerodha's note).\n\nSend me: your calculator + tests, the contract-note check output, the lab predictions vs actuals + 6 answers, the 10 problems, and the Gate 1 checklist with your honest verdict.\n", "resources": "# Day 7 resources: the Indian cost stack\n✅ = in this ZIP. All checked 31 Oct 2026. Official sources first; broker pages second; blogs never for a number.\n\n## 1. Official rates (folder 01)\n- ✅ `RATES_SNAPSHOT_2026-10-31.md`: every charge, its rate, and its source. Start here.\n- ✅ NSE circular NSE/FA/73061 (27 Feb 2026): transaction charge ₹306.99 + IPFT ₹0.01 per crore from 1 Mar 2026.\n- ✅ NSE circular NSE/FA/64232 (27 Sep 2024): the uniform \"true to label\" charges from 1 Oct 2024.\n- ✅ BSE Master Circular (Apr 2026), STT extract: the full STT table as amended by the Finance Act 2026.\n- ✅ MSE circular (31 Mar 2026): STT rates from 1 Apr 2026 (a second official copy of the same table).\n- ✅ SEBI FAQ on the Indian Stamp Act amendments (2021): stamp duty rates and who pays.\n- ✅ NSE Capital Market Consolidated Circular (Apr 2026): trading rules, tick sizes.\n- NSE \"SEBI Turnover Fees, STT and Other levies\" page (updated 17 Apr 2026): https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies\n- SEBI \"true to label\" circular (Jul 2024), the reason exchange charges became uniform: https://www.sebi.gov.in/legal/circulars/jul-2024/charges-levied-by-market-infrastructure-institutions-true-to-label_84506.html\n\n## 2. Tax (folder 02)\n- ✅ HSBC Mutual Fund Tax Reckoner FY 2026-27: capital gains rates under the Income-tax Act 2025 as amended by the Finance Act 2026.\n- PIB, Budget 2026 highlights (STT hike on F&O; capital gains rates unchanged): https://www.pib.gov.in/PressReleasePage.aspx?PRID=2221416\n\n## 3. Broker pages and guides\n- Zerodha charges (brokerage, DP charge, IPFT, rounding notes): https://zerodha.com/charges/\n- Zerodha brokerage calculator (your fallback reference for the Gate 1 check): https://zerodha.com/brokerage-calculator/\n- How to read a Zerodha contract note: https://support.zerodha.com/category/console/reports/contract-note/articles/how-to-interpret-the-contract-note\n- Zerodha Varsity, *Markets and Taxation* module (how trading income is taxed, explained simply): https://zerodha.com/varsity/module/markets-and-taxation/\n- Zerodha Varsity, *Clearing and Settlement*: what happens after you click buy (T+1, contract note, DP). https://zerodha.com/varsity/chapter/clearing-and-settlement-process/\n- Z-Connect: the 1 Oct 2024 revision explained: https://zerodha.com/z-connect/business-updates/revision-in-exchange-transaction-charges-and-securities-transaction-tax-from-october-1-2024\n\n## 4. Research (folder 08)\n- ✅ SEBI (Jul 2024), *Analysis of Intraday Trading by Individuals in the Equity Cash Segment*: 71% lost in FY23; costs added 57% to loss-makers' losses.\n- ✅ Novy-Marx & Velikov (2016), \"A Taxonomy of Anomalies and Their Trading Costs\", RFS (author copy).\n- ✅ Frazzini, Israel & Moskowitz, \"Trading Costs of Asset Pricing Anomalies\" (working paper, author copy).\n- Frazzini, Israel & Moskowitz (2018), \"Trading Costs\": SSRN abstract https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3229719\n\n## 5. Built for you (folder 04), all tested\n- `nse_costs.py`: the calculator. Rates as a dataclass with sources; `leg_costs`, `round_trip`, `breakeven_move_pct`, `after_tax_gain`.\n- `test_nse_costs.py`: 7 hand-checked tests (all pass).\n- `contract_note_check.py`: the Gate 1 within-20% check.\n- `cost_drag_lab.py` / `.ipynb` + chart: costs and tax applied to two toy rules on real NIFTYBEES data, plus cost vs account size.\n\n## 6. GitHub / code to read\n- Zerodha's official Kite Connect Python client (you'll use it from Day 13; read how orders are placed): https://github.com/zerodha/pykiteconnect\n\n## 7. Gate 1 (folder 07)\n- ✅ `GATE_1_CHECKLIST.md`\n", "problems": "# Day 7: 10 problems on the cost stack\nUse only the rates in 01_official_rates/RATES_SNAPSHOT. Do these BY HAND first, then check them with nse_costs.py.\nRules: gut guess → worked answer → one-line trading implication.\n\n1. **Delivery share, ₹50,000.** Buy ₹50,000 of a stock (delivery) and sell it later at ₹50,000. Zerodha. List every charge and the total. What % of the total is STT?\n\n2. **Same money, NIFTYBEES.** The same round trip at ₹1,00,000 in NIFTYBEES (an equity ETF, delivery). Total? Why so much cheaper than a share?\n\n3. **Intraday, ₹2 lakh.** Buy and sell ₹2,00,000 of a stock intraday (MIS), same day. Total costs?\n\n4. **Breakeven.** For problem 3, what % move do you need just to break even (ignoring spread)? If you do that trade 250 days a year, what's the annual cost in % of ₹2 lakh?\n\n5. **The GST trap.** Is GST charged on STT? On stamp duty? Recompute problem 1's GST if someone wrongly applied 18% to everything. How big is the error?\n\n6. **Small account.** A ₹5,000 NIFTYBEES round trip (delivery). Round-trip cost in bps? Why is it 8× worse than at ₹1 lakh?\n\n7. **The rate change.** Before 1 Mar 2026 the NSE charge was ₹297 + ₹10 IPFT per crore. After, ₹306.99 + ₹0.01. Did your cost change? Why did NSE do it?\n\n8. **Tax is a cost.** You make a ₹20,000 gain on NIFTYBEES. Tax if you sell after 3 months? After 13 months (assume no other LTCG this year)? What does this do to a strategy that trades monthly?\n\n9. **Annual drag.** A strategy does 24 round trips a year in NIFTYBEES with ₹1 lakh. Statutory + DP ≈ 3.9 bps per round trip; assume spread + slippage 2 bps per round trip. Annual drag in %? What if it's 250 round trips?\n\n10. **Contract note check.** Your ₹1 lakh delivery round trip in a share has a contract note total (all charges) of ₹223.00. Your calculator says ₹237.82. Is your calculator 6.6% wrong? Find the real explanation before you \"fix\" anything.\n", "files": ["00_START_HERE.md", "01_official_rates/BSE_Master_Circular_Apr2026_STT_extract.pdf", "01_official_rates/MSE_Circular_Mar2026_STT_rates_from_1Apr2026.pdf", "01_official_rates/NSE_Capital_Market_Consolidated_Circular_Apr2026.pdf", "01_official_rates/NSE_FA64232_Sep2024_Uniform_Transaction_Charges.pdf", "01_official_rates/NSE_FA73061_Feb2026_Transaction_Charges_from_1Mar2026.pdf", "01_official_rates/RATES_SNAPSHOT_2026-10-31.md", "01_official_rates/SEBI_FAQ_Indian_Stamp_Act_2021.pdf", "02_tax/HSBC_MF_Tax_Reckoner_FY2026-27.pdf", "03_data/README_DATA.md", "04_build_along/contract_note_check.py", "04_build_along/cost_drag_lab.ipynb", "04_build_along/cost_drag_lab.png", "04_build_along/cost_drag_lab.py", "04_build_along/nse_costs.py", "04_build_along/test_nse_costs.py", "05_problems/10_problems.md", "05_problems/SOLUTIONS_open_after_all_10.md", "06_templates/prediction-sheet.md", "06_templates/training-log-day7-row.md", "07_gate1/GATE_1_CHECKLIST.md", "08_research/Frazzini_Israel_Moskowitz_Trading_Costs_of_Asset_Pricing_Anomalies.pdf", "08_research/Novy-Marx_Velikov_2016_Taxonomy_of_Anomalies_and_Trading_Costs.pdf", "08_research/SEBI_2024_Intraday_Trading_by_Individuals_Equity_Cash.pdf", "RESOURCES.md"]}, {"day": 8, "date": "Sat 07 Nov 2026", "focus": "Edge families: where money actually comes from", "week": 2, "start_here": "# DAY 8: Sat 7 Nov 2026\n## Edge families: where money actually comes from\n\nWeek 1 taught you how to lose less: costs, overfitting, sizing. Week 2 is about finding something worth testing.\nToday's one question: **who pays me, and why do they keep paying?**\n\nSix families cover almost every systematic edge:\n| Family | The bet | Who pays | Founding evidence (in this ZIP) |\n|---|---|---|---|\n| Trend (time-series momentum) | What went up keeps going up for months | Hedgers, slow updaters | Moskowitz-Ooi-Pedersen 2012; Hurst-Ooi-Pedersen 2017 (since 1880) |\n| Momentum (cross-sectional) | Winners beat losers | Under-reacting investors | Jegadeesh-Titman 2001; Asness-Moskowitz-Pedersen 2013; IIMA India factors |\n| Mean reversion | Short-term overshoots snap back | Impatient traders paying for liquidity | Lo-MacKinlay 1990 |\n| Carry | Earn the yield if nothing changes | Those buying insurance or certainty | Koijen-Moskowitz-Pedersen-Vrugt |\n| Events / calendar / flows | Predictable flows move prices | Rule-bound traders (index funds, month-end) | Lou-Polk-Skouras 2019; India calendar studies (RESOURCES) |\n| Pairs / relative value | Close substitutes drift apart and come back | Liquidity shocks in one leg | Gatev-Goetzmann-Rouwenhorst 2006 |\n\nAnd the reality check: **McLean & Pontiff** found published anomalies earn 58% less after publication; **Lo's Adaptive Markets** explains why edges come and go.\n\n**Deliverable: 3 idea cards** (template + my worked example in 08_templates).\n\n---\n\n## THE NEW RULE (permanent from today)\n**All exploration uses data up to 2018-12-31 only. 2019–2026 is LOCKED** as your future out-of-sample test. The lab's loader enforces it.\nDon't even look at a 2021 chart of your idea. Once seen, never clean again.\n\n---\n\n## Your day (about 6 h; deep work about 4 h)\n| Time | Block | What | Files |\n|---|---|---|---|\n| 30 min | Drill | Zetamac + market-making game | |\n| 75 min | Deep 1: Read | MOP 2012 (abstract, intro, Fig. 1, Sec. 4), Gatev et al. (intro + results), McLean-Pontiff (abstract + intro). Skim the rest: Hurst, Asness, Carry, Lou-Polk-Skouras, Lo. For each family, write: bet / payer / how it dies. | 01–05 |\n| 30 min | Deep 2: India | Run `india_factor_facts.py`: India's academic factors from the IIMA library, including momentum's size, pain and era-by-era Sharpe. Skim the Nifty200 Momentum 30 methodology. | 04, 06 |\n| 45 min | Deep 3: Explore | Predict first, then run `edge_family_explorer.py`: 8 pre-declared tests, one per family, 2007–2018 only, robust t-stats. **Add 8 to your trial log.** | 06 |\n| 60 min | Deep 4: Cards | Write 3 idea cards. At least 2 families. Each must fit our rules (NSE cash ETFs/index, long/flat, 1.0×, no F&O) and carry a Day 7 cost estimate. | 08 |\n| 45 min | Problems | The 10 problems | 07 |\n| 15 min | Review | Training log row | |\n\n---\n\n## What the explorer found (so you know it's honest)\nNothing clears |t| > 3. The best three: overnight-minus-intraday on NIFTYBEES (t = 2.49), daily continuation in the index (robust t = 2.20; the naive t was 3.99) and turn-of-month (t = 2.00). With 8 tests, at least one |t| > 2 shows up by luck about 31% of the time. **These are clues for cards, not strategies.** And the BANK/NIFTY \"pair\" isn't a pair: 0.88 daily correlation, but a spread half-life of 403 days.\n\n## Mentor's rules for Day 8 (permanent)\n1. **No payer, no card.** A pattern without a reason is noise until proven otherwise, and you can't prove it with the same data.\n2. **One parameter set, from the literature.** Never tune a card's numbers on data.\n3. **Haircut every published edge by about half,** then subtract Day 7 costs and tax.\n4. **Fit the rules or die:** NSE cash, index ETFs, long/flat, 1.0×, no F&O, no borrowing.\n5. **The locked sample stays locked.**\n\nSend me: 3 idea cards, explorer predictions vs actuals + 6 answers, the 10 problems, and your trial-log count.\n", "resources": "# Day 8 resources: edge families\n✅ = in this ZIP (author/working-paper copies, free). Checked 31 Oct 2026.\n\n## 1. Trend and momentum (folder 01)\n- ✅ Moskowitz, Ooi & Pedersen (2012), \"Time Series Momentum\", JFE. **The core paper for your realistic family.**\n- ✅ Hurst, Ooi & Pedersen (2017), \"A Century of Evidence on Trend-Following Investing\", JPM.\n- ✅ Asness, Moskowitz & Pedersen (2013), \"Value and Momentum Everywhere\", JF.\n- ✅ Jegadeesh & Titman (2001), \"Profitability of Momentum Strategies: An Evaluation of Alternative Explanations\" (NBER WP).\n- AQR's data for the TSMOM paper: https://www.aqr.com/Insights/Datasets/Time-Series-Momentum-Original-Paper-Data\n- TSMOM slides by the authors: http://docs.lhpedersen.com/TSMOM_Slides.pdf\n\n## 2. Mean reversion and pairs (folder 02)\n- ✅ Gatev, Goetzmann & Rouwenhorst (2006), \"Pairs Trading: Performance of a Relative-Value Arbitrage Rule\" (Yale WP).\n- ✅ Lo & MacKinlay (1990), \"When Are Contrarian Profits Due to Stock Market Overreaction?\" (NBER WP). Explains why index returns look autocorrelated (stale prices).\n\n## 3. Carry and events (folder 03)\n- ✅ Koijen, Moskowitz, Pedersen & Vrugt, \"Carry\" (working paper).\n- ✅ Lou, Polk & Skouras (2019), \"A Tug of War: Overnight versus Intraday Expected Returns\", JFE.\n- Jain & Dua (2021), \"Evaluation of Different Seasonal Anomalies in the Indian Equity Market\" (NIFTY 1990–2021; effects fading in recent years): https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3984188\n\n## 4. India evidence (folder 04)\n- ✅ Agarwalla, Jacob & Varma, \"Four Factor Model in Indian Equities Market\" (IIMA WP).\n- ✅ IIMA Indian Fama-French-Momentum data library, release 2025-12 (monthly + yearly CSVs, incl. survivorship-adjusted). Live library: https://faculty.iima.ac.in/iffm/Indian-Fama-French-Momentum/\n- ✅ NSE Indices, Nifty200 Momentum 30 methodology whitepaper (Sep 2020). Several NSE-listed ETFs track this index (e.g. MOM30IETF, MOMOMENTUM).\n\n## 5. Where edges die (folder 05)\n- ✅ McLean & Pontiff (2016), \"Does Academic Research Destroy Stock Return Predictability?\", JF: 26% lower out-of-sample, 58% lower post-publication.\n- ✅ Lo (2004), \"The Adaptive Markets Hypothesis\", JPM.\n- ✅ Kakushadze & Serur, \"151 Trading Strategies\" (361 pp): a catalogue to browse for card ideas. Most strategies won't fit our rules; checking WHY is the exercise.\n- (Day 5's ZIP already has Harvey-Liu-Zhu, \"...and the Cross-Section of Expected Returns\".)\n\n## 6. Videos\n- Toby Moskowitz (AQR/Yale): systematic investing and trend following: https://www.youtube.com/watch?v=fiQiFtUV4iE\n- Cliff Asness: momentum in a few minutes: https://www.youtube.com/watch?v=TM3qYdb8lQo\n- Aswath Damodaran (NYU), Session 9: Random Walks and Momentum: https://www.youtube.com/watch?v=T3WoIU8_ebQ\n- Ernie Chan (QuantInsti): mean reversion trading: https://www.youtube.com/watch?v=sFwyS-L-aDE\n- Quantopian lecture: p-hacking and multiple comparisons: https://www.youtube.com/watch?v=YiDfbYtgUPc\n\n## 7. GitHub\n- Quantopian lecture notebooks (pairs trading, mean reversion, overfitting; free): https://github.com/quantopian/research_public/tree/master/notebooks/lectures\n- Hudson & Thames arbitrage_research (pairs approaches: distance, cointegration, copula), notebooks: https://github.com/hudson-and-thames/arbitrage_research\n\n## 8. Built for you (folder 06), tested\n- `edge_family_explorer.py` / `.ipynb` + chart: 8 pre-declared tests, 2007–2018 only, robust t-stats, trial count.\n- `india_factor_facts.py`: IIMA factor stats; momentum by era.\n\n## 9. Templates (folder 08)\n- `idea-card-template.md` (with a 30-point score), `example-idea-card-FILLED.md`.\n", "problems": "# Day 8: 10 problems on edge families\nGut guess → worked answer → one-line trading implication. No code needed.\n\n1. **Time-series vs cross-sectional momentum.** Explain the difference in two lines. Which one can you trade with a single ETF, long/flat?\n\n2. **Who's on the other side?** For each family (trend, mean reversion, carry, event, pairs), name the counterparty who loses on average and why they keep doing it.\n\n3. **Carry for a cash-only trader.** Koijen et al. define carry as the return if prices don't change. What's the carry of holding NIFTYBEES? Of a liquid-fund ETF? Why is \"carry\" mostly closed to us?\n\n4. **The decay haircut.** A paper reports 10% a year for a strategy. Using McLean-Pontiff (26% lower out-of-sample, 58% lower post-publication), what should you expect now? What does that do to a strategy that also costs 4% a year to run?\n\n5. **Turnover kills.** Novy-Marx & Velikov find few anomalies above 50% monthly turnover survive costs. Convert: a strategy that flips its whole position every week has roughly what monthly turnover?\n\n6. **Pairs ≠ correlation.** NIFTY and NIFTYBANK have a daily return correlation of about 0.88 (2007–2018), yet the explorer's spread had a half-life of 403 days and failed Dickey-Fuller. How can both be true?\n\n7. **The robust t.** The explorer's daily autocorrelation had naive t = 3.99 but robust t = 2.20. Explain why volatility clustering inflates the naive t.\n\n8. **Eight tests.** You ran 8 independent-ish tests. The best has |t| = 2.49. Is that evidence? (Use Day 5: the expected maximum of 8 |N(0,1)| draws.)\n\n9. **The locked sample.** Why is it worse to glance at a 2021 chart of your idea than to never test it at all?\n\n10. **India momentum.** The IIMA WML factor earned about 13% a year with a −53% worst drawdown. Name three reasons you can't harvest it in this program, and one honest way part of the idea might still reach an ETF trader.\n", "files": ["00_START_HERE.md", "01_trend_momentum/Asness_Moskowitz_Pedersen_2013_Value_and_Momentum_Everywhere.pdf", "01_trend_momentum/Hurst_Ooi_Pedersen_2017_Century_of_Trend_Following.pdf", "01_trend_momentum/Jegadeesh_Titman_2001_Profitability_of_Momentum_Strategies_Evaluation.pdf", "01_trend_momentum/Moskowitz_Ooi_Pedersen_2012_Time_Series_Momentum.pdf", "02_mean_reversion_pairs/Gatev_Goetzmann_Rouwenhorst_2006_Pairs_Trading.pdf", "02_mean_reversion_pairs/Lo_MacKinlay_1990_When_Are_Contrarian_Profits_Due_to_Overreaction.pdf", "03_carry_value_events/Koijen_Moskowitz_Pedersen_Vrugt_Carry.pdf", "03_carry_value_events/Lou_Polk_Skouras_2019_Tug_of_War_Overnight_vs_Intraday.pdf", "04_india_evidence/Agarwalla_Jacob_Varma_Four_Factor_Model_India.pdf", "04_india_evidence/NSE_Indices_Nifty200_Momentum30_Whitepaper_Sep2020.pdf", "05_meta_where_edges_die/Kakushadze_Serur_151_Trading_Strategies.pdf", "05_meta_where_edges_die/Lo_2004_Adaptive_Markets_Hypothesis.pdf", "05_meta_where_edges_die/McLean_Pontiff_2016_Academic_Research_Destroys_Predictability.pdf", "06_build_along/edge_family_explorer.ipynb", "06_build_along/edge_family_explorer.png", "06_build_along/edge_family_explorer.py", "06_build_along/india_factor_facts.py", "07_problems/10_problems.md", "07_problems/SOLUTIONS_open_after_all_10.md", "08_templates/example-idea-card-FILLED.md", "08_templates/idea-card-template.md", "09_data/README_DATA.md", "RESOURCES.md"]}, {"day": 9, "date": "Sun 08 Nov 2026", "focus": "(Diwali): LIGHT DAY", "week": 2, "start_here": "# DAY 9: Sun 8 Nov 2026 (Diwali): LIGHT DAY\n## Read two things well. Write 3 more idea cards. Then go celebrate.\n\nPlan from the schedule: **read Chan ch. 1–2 + one SSRN paper → 3 more idea cards (6 total).** About 3 hours, no more.\nRest is part of training (Ericsson: deliberate practice needs recovery). The market's Muhurat session is at 14:20–15:30. We don't trade it.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 15 min | Drill | Zetamac only (light) | |\n| 40 min | Read 1 | Chan ch. 1 (free publisher excerpt) + ch. 2 if you can get it legally (see the guide; if not, work from its table of contents) | 01_chan/ |\n| 10 min | Method | Keshav, \"How to Read a Paper\" (2 pages): the 3-pass method | 03_how_to_read/ |\n| 50 min | Read 2 | **The SSRN paper: Faber, \"A Quantitative Approach to Tactical Asset Allocation\"** (2013 update, 70 pp; read pp. 1–20 + the FAQ). Fill the paper-reading card. Original 2006 version included for comparison. | 02_ssrn_paper/, 06_templates/ |\n| 25 min | Replicate | Predict first, then run `replicate_faber.py`: Faber's 10-month rule on NIFTY (and 50/50 with gold), 2008–2018 only, with Day 7 costs. +2 trials. | 05_build_along/ |\n| 45 min | Cards | 3 new idea cards (6 total). Use Chan's \"suits you\" filter + his 7 pitfall questions. | 06_templates/ |\n| 15 min | Problems | 10 short problems | 07_problems/ |\n\n## Why Faber's paper?\nIt fits our rules almost exactly: one asset class at a time, long or cash, monthly, one parameter, famous enough\nto be heavily criticised. That makes it perfect practice for reading a paper like a sceptic.\n\n## What the replication found (2008-07 to 2018-12, exploration only)\n| | CAGR | Vol | Max DD |\n|---|---|---|---|\n| NIFTY buy & hold (price index, no dividends) | 9.88% | 20.8% | −36.8% |\n| NIFTY 10-month filter, net of costs | 8.87% | 14.8% | −19.4% |\n| 50/50 NIFTY+gold, hold | 8.76% | 9.6% | −10.9% |\n| 50/50, each filtered, net | 6.87% | 8.4% | −10.5% |\nFaber's claim (\"similar return, much lower drawdown\") roughly holds on NIFTY. But the window starts in a crash, cash\nis an assumed 6%, and on a diversified mix the filter only cost return. 21 switches cost about 0.14% a year in fees;\nthe real hidden cost is short-term tax. Questions 3–6 in the script make you face all of that.\n\n## Mentor's rules for Day 9\n1. **Read with a pencil:** every paper gets a reading card. No card, it didn't happen.\n2. **Replicate before you believe:** small, honest, exploration window only.\n3. **Legal sources only.**\n4. **Rest is training.** Happy Diwali.\n\nSend me (by Monday): 3 new idea cards, the Faber reading card, replication predictions vs actuals + 6 answers, the 10 problems.\n", "resources": "# Day 9 resources (checked 31 Oct 2026)\n✅ = in this ZIP.\n\n## Chan (folder 01)\n- ✅ Chapter 1 of *Quantitative Trading* (2nd ed.), Wiley's free publisher excerpt.\n- ✅ Table of contents (Wiley), used to build `CHAN_CH1-2_GUIDE.md` (how to read ch. 2 legally + its checklist).\n- Wiley book page: https://www.wiley.com/en-us/Quantitative+Trading%3A+How+to+Build+Your+Own+Algorithmic+Trading+Business%2C+2nd+Edition-p-9781119800064\n- Chan's blog (strategy ideas and pitfalls, free): https://epchan.blogspot.com/\n- Ernie Chan on mean reversion (QuantInsti, YouTube): https://www.youtube.com/watch?v=sFwyS-L-aDE\n\n## The SSRN paper (folder 02)\n- ✅ Faber (2013 update), \"A Quantitative Approach to Tactical Asset Allocation\" (70 pp), from the author's site. SSRN page: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=962461\n- ✅ Faber (2006) original working paper (13 pp).\n- The critique, Marmi, Pacati, Risso & Renò, \"A Quantitative Approach to Faber's Tactical Asset Allocation\" (bootstrap tests): https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1476225\n- A 2025 update with Python/IBKR implementation (Gabriel, Pagani, Zarattini): https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5230603\n\n## How to read (folder 03)\n- ✅ S. Keshav, \"How to Read a Paper\" (ACM SIGCOMM CCR): the 3-pass method.\n\n## Diwali (folder 04)\n- ✅ NSE/CMTR/76941 (Muhurat timings) and NCL/CMPT/77038 (settlement: 6 and 8 Nov trades settle Mon 9 Nov, 08:30). `MUHURAT_NOTES.md`.\n\n## Build-along (folder 05), tested\n- `replicate_faber.py` / `.ipynb` + chart; reuses Day 7's `nse_costs.py`.\n\n## Templates (folder 06)\n- `paper-reading-template.md`, `idea-card-template.md`.\n", "problems": "# Day 9: 10 short problems (light day)\n1. Chan says quantitative trading needs no marketing and scales. Name two ways that's LESS true for a retail trader in India in 2026.\n2. Using Chan's \"suits you\" filter (hours, skills, capital, goal), rule OUT two families from Day 8 for yourself, with reasons.\n3. Faber's rule switched 21 times on NIFTY in about 10.5 years. Using Day 7, what did statutory costs take per year? (≈7 bps per switch.)\n4. The filter's CAGR (8.9%) is BELOW buy-and-hold (9.9%), yet its drawdown is half. Under what Kelly-style reasoning (Day 3) could the filter still be better for you?\n5. Faber's paper is a risk-reduction tool. Write its \"who pays\" box. Is there a payer at all, or is it insurance you pay for?\n6. The window starts 2008-07. Explain in two lines why that start date flatters a trend filter.\n7. The 50/50 NIFTY+gold mix WITHOUT the filter had a better Sharpe than WITH it. Explain why diversification can make a filter redundant.\n8. Keshav's 3 passes: which pass is enough to KILL an idea card, and which is needed to ACCEPT one?\n9. Chan's 7 pitfall questions: which one does a price-index-based NIFTY backtest automatically fail, and how big is the error?\n10. Muhurat: if you placed a CNC buy on 8 Nov, when does it settle, and why might the price you see that day be a poor guide to fair value?\n", "files": ["00_START_HERE.md", "01_chan/CHAN_CH1-2_GUIDE.md", "01_chan/Chan_QuantTrading_2ndEd_Chapter1_Wiley_free_excerpt.pdf", "01_chan/Chan_QuantTrading_2ndEd_Table_of_Contents_Wiley.pdf", "02_ssrn_paper/Faber_2006_original_working_paper.pdf", "02_ssrn_paper/Faber_2013_Quantitative_Approach_to_Tactical_Asset_Allocation.pdf", "03_how_to_read/Keshav_How_to_Read_a_Paper.pdf", "04_diwali_muhurat/MUHURAT_NOTES.md", "04_diwali_muhurat/NCL_CMPT77038_Muhurat_settlement.pdf", "04_diwali_muhurat/NSE_CMTR76941_Muhurat_Trading_8Nov2026.pdf", "05_build_along/nse_costs.py", "05_build_along/replicate_faber.ipynb", "05_build_along/replicate_faber.png", "05_build_along/replicate_faber.py", "06_templates/idea-card-template.md", "06_templates/paper-reading-template.md", "07_problems/10_problems.md", "07_problems/SOLUTIONS_open_after_all_10.md", "RESOURCES.md"]}, {"day": 10, "date": "Mon 09 Nov 2026", "focus": "THE KILL SESSION", "week": 2, "start_here": "# DAY 10: Mon 9 Nov 2026: THE KILL SESSION\n## I attack your cards. You defend. About 3 of 10 survive.\n\n**Deliverable:** 4 more idea cards (10 in total), then all 10 through the card killer and the kill session. Survivors\nget a pre-mortem. Tomorrow (Day 11, market shut) the survivors face the 8-point paper checklist.\n\nA trader's real skill isn't finding ideas. It's killing them cheaply, before they cost money. At a desk, the\njuniors who lasted were the ones who could hear \"that's dead\" without arguing with the data.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 20 min | Drill | Zetamac + 2 mental cost checks: \"edge X bps, cost 13.9 bps, alive?\" | |\n| 45 min | Read | **Hou–Xue–Zhang** intro + Table 1 (most anomalies don't replicate) → **Jensen–Kelly–Pedersen** abstract + intro (the other side) → **Novy-Marx–Velikov** abstract + intro (costs kill high turnover) | 01_, 02_ |\n| 20 min | Read | **Arnott–Harvey–Markowitz** backtesting protocol (11 pages, all of it) | 03_kill_methods/ |\n| 10 min | Watch | Kahneman on the pre-mortem (3 min) + Harvey on the risks of historical backtests | RESOURCES.md |\n| 45 min | Write | 4 new idea cards → 10 in total | Day 8 idea-card template |\n| 30 min | Run | Enter all 10 into `my_cards.csv` → `python card_killer.py my_cards.csv`. Predict each verdict FIRST. | 04_build_along/ |\n| 60 min | Kill session | For each card: the 12 attacks, a defence sheet, then accept the verdict | 05_templates/kill-session-protocol.md |\n| 20 min | Pre-mortem | One per survivor | 05_templates/premortem-template.md |\n| 20 min | Problems | 10 problems | 06_problems/ |\n≈ 4.5 h. That's the deep-work ceiling; stop there.\n\n## The card killer on my 10 demo cards (numbers are my rough priors from Day 8, not facts)\n| Card | Verdict | Why |\n|---|---|---|\n| Overnight NIFTYBEES | KILL | 9.1 bps gross < 13.9 bps cost: −25% a year (t 2.49 meant nothing) |\n| Turn-of-month | PARK | net 8 bps per trade, thinner than 2x cost |\n| Faber 10-month filter | SURVIVE (overlay) | costs about 0.28% a year; a drawdown tool, not alpha |\n| 12-month trend | SURVIVE (confirm mode) | a century of outside evidence; discovering it alone would need about 1,600 years |\n| 1-month trend | KILL | our data says the wrong sign |\n| BANK/NIFTY pairs | KILL | needs shorting |\n| Intraday mean reversion | KILL | costs eat it |\n| High-VIX buying | PARK | needs about 95 years to prove |\n| NIFTY vs gold rotation | KILL | wrong sign |\n| Nifty200 Momentum 30 ETF | SURVIVE (confirm mode) | IIMA momentum t ≈ 3.1; ETF is long-only, check liquidity |\n5 killed, 2 parked, 3 survived. That's the shape of a real research pipeline.\n\n## Mentor's rules for Day 10\n1. **Predict the verdict before running the script.** Where you were wrong is where you learn.\n2. **No 2019+ data in defences.** Ever.\n3. **Accept the kill gracefully.** Arguing with a dead card is how traders blow up.\n4. **Parked isn't dead:** write exactly what would un-park it.\n5. **The script is a filter, not a judge.** I'll still attack your survivors' payer stories.\n\nSend me: 10 cards, `my_cards.csv` + verdicts, 10 defence sheets, survivor pre-mortems, the 10 problems, and trial-log/training-log updates.\n", "resources": "# Day 10 resources (checked 31 Oct 2026)\n✅ = in this ZIP.\n\n## Why ideas die (folder 01)\n- ✅ Hou, Xue & Zhang, \"Replicating Anomalies\" (Oct 2018 version of the RFS 2020 paper, from the authors' site). 452 anomalies: 65% fail |t| ≥ 1.96 and 82% fail the 2.78 hurdle. NBER page: https://www.nber.org/papers/w23394\n- ✅ Novy-Marx & Velikov, \"A Taxonomy of Anomalies and Their Trading Costs\" (RFS 2016; Aug 2015 author version). Costs kill most strategies above about 50% monthly turnover.\n\n## The other side (folder 02): read it so your scepticism is calibrated, not lazy\n- ✅ Jensen, Kelly & Pedersen, \"Is There a Replication Crisis in Finance?\" (Journal of Finance 2023, open access, CC BY).\n- Their data site (153 factors, 13 themes, 93 countries, India included): https://jkpfactors.com/\n- Code: https://github.com/bkelly-lab/jkp-data (MIT; needs a WRDS subscription to rebuild)\n\n## Kill methods (folder 03)\n- ✅ Arnott, Harvey & Markowitz (2019), \"A Backtesting Protocol in the Era of Machine Learning\" (author copy, Duke).\n- Gary Klein, \"Performing a Project Premortem,\" HBR Sept 2007 (copyrighted, so linked): https://hbr.org/2007/09/performing-a-project-premortem · Klein's own page: https://www.gary-klein.com/premortem\n- Free summary of the pre-mortem steps (Psychology Today, Klein): https://www.psychologytoday.com/us/blog/seeing-what-others-dont/202101/the-pre-mortem-method\n\n## Videos and audio\n- Daniel Kahneman on the pre-mortem (about 3 min): https://www.youtube.com/watch?v=f432ultnPQI\n- Campbell Harvey, \"The Risks of Historical Backtests\" (JTPM 2015 talk): https://www.youtube.com/watch?v=aKehKmay4bY\n- Excess Returns, \"The Pitfalls of Backtesting\": https://www.youtube.com/watch?v=tLsF8pvs6XY\n- EconTalk podcast: Campbell Harvey on randomness, skill and investment strategies: https://www.econtalk.org/campbell-harvey-on-randomness-skill-and-investment-strategies/\n- Harvey's practical one-pager on backtest haircuts: https://people.duke.edu/~charvey/Media/2016/Practical_applications_backtesting.pdf\n\n## Already in earlier kits (re-read if needed)\nHarvey–Liu–Zhu \"…and the Cross-Section\" and Harvey–Liu \"Backtesting\" (Day 5); McLean–Pontiff decay (Day 8); SEBI intraday study (Day 1).\n\n## Build-along (folder 04), tested\n- `card_killer.py` / `.ipynb` + `demo_cards.csv` + `verdicts_demo_cards.csv`; reuses Day 7's `nse_costs.py`.\n\n## Templates (folder 05)\n- `kill-session-protocol.md` (12 attacks + defence sheet), `premortem-template.md`, `backtest-protocol-checklist.md` (AHM 7 categories).\n", "problems": "# Day 10: 10 problems (do before reading the solutions)\n1. Hou, Xue & Zhang tried to replicate 452 anomalies. Roughly what share failed |t| > 1.96, and what share failed the multiple-test hurdle (2.78)? Which category failed most, and why does that matter for a cost-sensitive retail trader?\n2. Jensen, Kelly & Pedersen say most factors DO replicate. Reconcile them with Hou et al. in 4 lines. (Hint: what each counts as success, Bayesian shrinkage, the 13 themes.)\n3. Novy-Marx & Velikov: what turnover level roughly separates anomalies that survive costs from those that don't? Translate that into trades per year for a single-ETF rule.\n4. The overnight NIFTYBEES card: gross 9.1 bps per day, cost 13.9 bps per round trip. Even with NO haircut, what's the yearly result at 245 trades? What's the lesson about \"statistically significant\"?\n5. Turn-of-month: gross 52 bps per trade. With a 42% keep and 13.9 bps cost, what's the net per trade? Why is \"net < 2x cost\" a sensible PARK rule?\n6. A card with net Sharpe 0.3: how many years are needed for t = 3? With net Sharpe 0.8? What does this say about discovering slow strategies?\n7. Explain \"confirm mode\" vs \"discovery mode\". Why is confirm mode NOT a loophole? What must the literature evidence satisfy?\n8. Which AHM protocol category did you personally break most in Days 4–8? Be honest; cite a trial.\n9. Pre-mortem: write the single most likely failure story for the 12-month trend card in 3 sentences.\n10. Your mentor kills a card you love. List three things that are NOT valid defences.\n", "files": ["00_START_HERE.md", "01_why_ideas_die/Hou_Xue_Zhang_Replicating_Anomalies_RFS2020_version.pdf", "01_why_ideas_die/Novy-Marx_Velikov_Taxonomy_of_Anomalies_and_Trading_Costs.pdf", "02_the_other_side/Jensen_Kelly_Pedersen_2023_Is_There_a_Replication_Crisis_JF_CC-BY.pdf", "03_kill_methods/Arnott_Harvey_Markowitz_2019_Backtesting_Protocol.pdf", "04_build_along/card_killer.ipynb", "04_build_along/card_killer.py", "04_build_along/nse_costs.py", "05_templates/backtest-protocol-checklist.md", "05_templates/idea-card-template.md", "05_templates/kill-session-protocol.md", "05_templates/premortem-template.md", "06_problems/10_problems.md", "06_problems/SOLUTIONS_open_after_all_10.md", "RESOURCES.md"]}, {"day": 11, "date": "Tue 10 Nov 2026", "focus": "(NSE shut): THE 8-POINT PAPER CHECKLIST", "week": 2, "start_here": "# DAY 11: Tue 10 Nov 2026 (NSE shut): THE 8-POINT PAPER CHECKLIST\n## Your Day 10 survivors face 8 checks. Any zero = dead. Tomorrow you pick ONE plus a backup.\n\nMarket's closed, so it's a desk day. On a real desk, this is the day you write the memo before anyone gives you money.\n\n| Time | Block | What | Files |\n|---|---|---|---|\n| 20 min | Drill | Zetamac + \"beta 0.4, NIFTY −20%: what does the overlay lose?\" × 5 | |\n| 40 min | Read (payer, P1) | Moskowitz–Ooi–Pedersen *Time Series Momentum* §1 + §6 (why it works) · Hurst–Ooi–Pedersen *Century of Evidence* (all 16 pages) · Asness et al. *Fact, Fiction and Momentum* (the 10 myths) | 01_ |\n| 20 min | Read (costs, P2–3) | Frazzini–Israel–Moskowitz abstract + intro + conclusion: real costs are smaller than academics think, but capacity is finite | 02_ |\n| 25 min | Read (beta, P4) | Agarwalla–Jacob–Varma (IIMA) §1–3: how India's factors are built. Then open the factor CSV in 09_data | 03_ |\n| 15 min | Read (regimes, P6) | Daniel–Moskowitz *Momentum Crashes*, abstract + intro | 04_ |\n| 10 min | Read (execution, P8) | NSE data-definitions PDF: Close vs LTP (the close is \"averaging of trades over the last 30 minutes\") | 05_ |\n| 45 min | Run | `python checklist_scorer.py`. Predict each number first. Then add YOUR survivors | 06_build_along/ |\n| 60 min | Write | One scoresheet per survivor (0/1/2 per point, a number per line) | 07_templates/ |\n| 20 min | Problems | 10 problems | 08_problems/ |\n≈ 4.3 h.\n\n## What the scorer found on my two demo survivors (2008-07 to 2018-12, net of costs, daily data)\n| | NIFTY hold | Faber 10m | 12m trend |\n|---|---|---|---|\n| CAGR | 9.91% | 8.34% | 5.91% |\n| Max drawdown | −45.4% | −25.3% | −20.5% |\n| Market beta (IIMA factors) | 1 | 0.43 | 0.28 |\n| Alpha t-stat | n/a | −0.05 | −0.56 |\n| Independent decisions | n/a | 11 spells | 10 spells |\n| 2008 crash | −25.2% | +4.4% | +4.4% |\n| Cost of a one-day delay | n/a | 0.27%/yr | 1.03%/yr |\n\n**Reading:** both are drawdown overlays (part-time beta), not alpha. Both fail point 5 on our data, so they live only in\nconfirm mode. The 12-month version looks weaker and more timing-sensitive here. **Don't pick on that number alone;**\nit's 10 decisions. The momentum ETF can't be tested pre-2019 at all (no ETF before 2022; backfilled index).\nNote: Day 9's numbers differ slightly (monthly bars, no 1-day lag). Same story.\n\n## Mentor's rules for Day 11\n1. **A zero anywhere kills it.** No averaging away a fatal flaw.\n2. **Every score needs a number.** \"Seems liquid\" scores 0; \"₹3 cr ADV vs ₹1 lakh order\" scores 2.\n3. **Call an overlay an overlay.** Getting this right is worth more than any Sharpe ratio.\n4. **2019+ stays locked.** Liquidity and launch dates are facts you may look up. Returns after 2018 are not.\n5. **If nothing passes, say so.** That's a valid result; we'd fall back to a plain baseline and say so honestly (Gate 3 rule).\n\nSend me: a scoresheet per survivor, the scorer output (+ your own survivors), the 10 problems, trial log (+2 trials for\nthe two demo variants if you run them), and your training-log row. Tomorrow (Day 12): pick one + backup and pre-register.\n", "resources": "# Day 11 resources (checked 31 Oct 2026)\n✅ = in this ZIP. Organised by checklist point.\n\n## P1 Economic reason (01_payer_and_myths)\n- ✅ Moskowitz, Ooi & Pedersen (2012), \"Time Series Momentum,\" JFE (author copy). Slides: http://docs.lhpedersen.com/TSMOM_Slides.pdf\n- ✅ Hurst, Ooi & Pedersen (2017), \"A Century of Evidence on Trend-Following Investing,\" JPM (AQR copy). Positive in every decade since 1880; did well in 8 of 10 worst 60/40 crises.\n- ✅ Asness, Frazzini, Israel & Moskowitz (2014), \"Fact, Fiction and Momentum Investing,\" JPM (AQR copy).\n\n## P2–P3 Costs and capacity (02_costs_capacity)\n- ✅ Frazzini, Israel & Moskowitz, \"Trading Costs of Asset Pricing Anomalies\" (Oct 2015 draft): real fund trading data; costs are much lower than earlier estimates; capacity is finite.\n- Liquidity check (facts, allowed): NSE ETF page https://www.nseindia.com/market-data/exchange-traded-funds-etf\n\n## P4 Hidden beta, India (03_hidden_beta_india + 09_data)\n- ✅ Agarwalla, Jacob & Varma (IIMA WP 2013-09-05), \"Four Factor Model in Indian Equities Market.\"\n- ✅ IIMA factor data, Dec 2025 release, survivorship-adjusted, daily + monthly (in %; MF = market minus RF). Library: https://faculty.iima.ac.in/iffm/Indian-Fama-French-Momentum/ (please cite the paper if you use it)\n- Video: Alpha Architect (Wes Gray), \"How to Calculate Fama French 3 Factor Alpha\": https://www.youtube.com/watch?v=mrfWCUKX1Qw\n- Video: Algovibes, \"Fama French Regression in Python\": https://www.youtube.com/watch?v=pLyatGMTqzY\n\n## P5–P6 Sample size and bad regimes (04_sample_regimes)\n- ✅ Daniel & Moskowitz, \"Momentum Crashes\" (2015 draft of JFE 2016).\n- Re-read: Lo (2002) Sharpe ratio statistics (Day 2), Bailey & López de Prado MinTRL (Day 5).\n\n## P8 Executable (05_executable_nse)\n- ✅ NSE \"Historical Data Dissemination of Capital Market Segment\" (defines Close vs LTP; close uses rules such as averaging the last 30 minutes).\n- NSE Closing Auction Session page: https://www.nse.in/static/products-services/closing-auction-session (CAS reference price = VWAP 3:00–3:15 pm, ±3% band)\n- NSE index FAQ (NIFTY close = last-half-hour weighted average of constituents): https://www.nseindia.com/static/products-services/indices-faqs\n\n## Listening\n- Lasse Pedersen on Trend Following Radio (Ep. 373): https://www.youtube.com/watch?v=FapcJm91oHg\n\n## Build-along (06_build_along), tested\n- `checklist_scorer.py` / `.ipynb`: P2–P6 and P8 numbers on exploration data; reuses Day 7 `nse_costs.py`.\n\n## Templates (07_templates)\n- `8-point-checklist-scoresheet.md`, including the honest note on point 5 (confirm vs discovery mode).\n", "problems": "# Day 11: 10 problems (before solutions)\n1. The scorer says Faber's mean gain per in-market spell is 7.49% but the median is 0.15%. What does that tell you about where the strategy's money comes from, and about point 2?\n2. 12-month trend: alpha on the market alone −1.83%/yr (t −0.56), beta 0.28. In plain words, what did we build?\n3. Why is \"beta 0.43, no alpha\" still potentially useful? What would make it useless?\n4. Point 8: the 12-month rule lost about 1.0%/yr from a one-day delay; Faber lost 0.27%. Give two reasons the numbers differ, and say which matters for live trading.\n5. NSE's official close for a non-CAS ETF is the volume-weighted price of the last 30 minutes. Name two ways a backtest using that close can be unexecutable.\n6. Capacity: NIFTYBEES traded a median of about ₹3 cr/day in 2018 (per Yahoo volume). At a 1%-of-ADV limit, how large a single-day order was fine? Why is capacity a non-issue for you but not for a fund?\n7. Why can't the Nifty200 Momentum 30 ETF card be tested in 2007–2018? What's backfill bias?\n8. Using Momentum Crashes (Daniel–Moskowitz), when does momentum lose most? Does that apply to a long-only momentum ETF?\n9. Score Faber on all 8 points (0/1/2) with one line each.\n10. A friend says: \"Trend following failed point 5, so it's just luck.\" Answer him in 3 sentences.\n", "files": ["00_START_HERE.md", "01_payer_and_myths/Asness_et_al_2014_Fact_Fiction_and_Momentum_Investing.pdf", "01_payer_and_myths/Hurst_Ooi_Pedersen_2017_Century_of_Evidence_Trend_Following.pdf", "01_payer_and_myths/Moskowitz_Ooi_Pedersen_2012_Time_Series_Momentum_JFE.pdf", "02_costs_capacity/Frazzini_Israel_Moskowitz_2015_Trading_Costs_of_Anomalies.pdf", "03_hidden_beta_india/Agarwalla_Jacob_Varma_2013_Four_Factor_Model_India_IIMA_WP.pdf", "04_sample_regimes/Daniel_Moskowitz_2016_Momentum_Crashes.pdf", "05_executable_nse/NSE_Historical_Data_Details_CM_closing_price_definition.pdf", "06_build_along/checklist_scorer.ipynb", "06_build_along/checklist_scorer.py", "06_build_along/nse_costs.py", "07_templates/8-point-checklist-scoresheet.md", "08_problems/10_problems.md", "08_problems/SOLUTIONS_open_after_all_10.md", "09_data/README_DATA.md", "RESOURCES.md"]}, {"day": 12, "date": "Wed 11 Nov 2026", "focus": "PICK ONE, PICK A BACKUP, PRE-REGISTER, LOCK", "week": 2, "start_here": "# DAY 12: Wed 11 Nov 2026: PICK ONE, PICK A BACKUP, PRE-REGISTER, LOCK\n## After today, the plan can't move. That's the point.\n\nFrom Day 11 you have scored survivors. Today you commit, in writing, to exactly what you'll test, what result kills it,\nand when. Then you hash it and push it to GitHub. On Day 20 you open the 2019+ holdout once and live with the answer.\n\n| Time | ision, not a loophole. Write it down.\n2. **Holdout boundary = 2019-01-01, written as a date.** This replaces the Day 17 \"70/30\" line in the plan\n   (the 2019+ lock came first, on Day 8).\n3. **Parameter chosen before the grid:** 10m (Faber 2007). Max 3 values × max 2 knobs, and all of them count as trials.\n4. **Backup gets its own falsifier.** No backup = no Gate 2.\n5. **Leakage note is mandatory.** Write what you already know about 2019–2026 markets.\n6. **After locking:** any change = v2 file + reason + trial count up. Never edit v1.\n\nSend me: the locked pre-reg + LOCK.txt + the GitHub tag link, the designer output, the 10 problems, and your trial-log\nand training-log rows. Day 13 (Thu 12 Nov): data pipeline.\n", "resources": "# Day 12 resources (checked 31 Oct 2026). ✅ = in this ZIP\n\n## Why pre-register (01_why_preregister)\n- ✅ Nosek, Ebersole, DeHaven & Mellor (2018), \"The Preregistration Revolution,\" PNAS 115(11):2600–2606 (author manuscript). Open access: https://doi.org/10.1073/pnas.1708274114\n- ✅ Harvey (2017), \"Presidential Address: The Scientific Outlook in Financial Economics,\" J. Finance 72(4) (Duke copy). p-hacking, minimum Bayes factor, research-culture guidelines.\n\n## The hurdle (see Day 5 kit)\n- Harvey, Liu & Zhu (2016), \"…and the Cross-Section of Expected Returns\": t > 3. Already in Day 5 kit.\n- Harvey & Liu (2015), \"Backtesting\": haircut Sharpe. Already in Day 5 kit. Their code: https://people.duke.edu/~charvey/backtesting\n- Bailey & López de Prado (2014), Deflated Sharpe Ratio. Already in Day 5 kit (you'll use it on Day 20).\n\n## Templates and registries \n- OSF template list (incl. AsPredicted's questions): https://osf.io/zab38/overview\n- COS guide to choosing a template: https://www.cos.io/blog/choosing-preregistration-template-guide-for-researchers\n- AsPredicted (free, private-until-you-share registrations): https://aspredicted.org/\n- Optional: register on OSF for a third-party timestamp: https://osf.io/registries\n\n## Videos\n- Center for Open Science, \"The What, Why, and How of Preregistration\" (56 min): https://www.youtube.com/watch?v=8QK2-udwoK8\n- Brunel University London, \"Why you should pre-register your research study – and how easy it is to do\": https://www.youtube.com/watch?v=_505Oek-wHM\n\n## Build-along (04_build_along), tested\n- `prereg_designer.py` / `.ipynb`: power table, fixed-grid stability, block-bootstrap falsifier sizing, SHA-256 lock/verify. Reuses Day 7 `nse_costs.py`.\n\n## Templates (05_templates)\n- `preregistration-template.md`: an AsPredicted-style form adapted for trading (data status, leakage note, overlay vs alpha, falsifier, kill date, backup).\n\n## Data (07_data)\n- NIFTY50_daily.csv (Yahoo; script reads only to 2018-12-31), IIMA monthly four factors (Dec 2025 release).\n", "problems": "# Day 12: 10 problems\n1. Your holdout is about 7.8 years. If the true Sharpe is 0.5, what's P(t > 3)? What does that mean for an ALPHA pre-registration?\n2. In the exploration window, buy & hold had Sharpe 0.27 and the 10m filter 0.21. Why might you still pre-register the filter, and as what?\n3. The bootstrap says the overlay's vol ratio sits between 0.65 and 0.87 (10th–90th pct). Write a falsifier on vol ratio that a true overlay passes about 90% of the time.\n4. Why is \"P(t of return difference > 3) = 0%\" not a bug?\n5. Critique this pre-reg line: \"Hypothesis: the strategy will perform well out of sample.\"\n6. Critique: \"Parameters: SMA length chosen by best Sharpe in 8–12 months.\"\n7. You open the holdout and find a bug in your cost code. What does your pre-registration let you do?\n8. You already know COVID crashed markets in Mar 2020 and the filter would probably have exited. Does that ruin the holdout? What do you write in section 0?\n9. Day 17 in the plan says \"first 70% in-sample, last 30% locked\". Our rule locked 2019+. Which wins, and why must the pre-reg say so explicitly?\n10. Why hash + git tag + push, and not just \"save the file\"
